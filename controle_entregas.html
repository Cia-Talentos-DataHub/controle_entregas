// Busca todos os campos da lista SP e resolve os StaticNames reais das colunas Head PCT.
// Usa matching por palavras-chave para tolerar variações de nome (ex: encoding SP).
async function fetchHeadPctCols(token, siteUrl, listName) {
  try {
    const base = _spListBase(siteUrl, listName);
    const json = await spFetch(token, `${base}/fields?$select=StaticName,Title&$top=500`);
    const fields = json.value || [];
    PHASES.forEach(ph => {
      const words = ph.key.toLowerCase().split('_');
      // Busca por contenção de 'consultor' e 'head' + todas as palavras da chave da fase
      // NÃO exige 'pct' no nome — evita falha para colunas com nome truncado (ex: _P)
      const match = fields.find(f => {
        const s = f.StaticName.toLowerCase();
        return s.includes('consultor') && s.includes('head') && words.every(w => s.includes(w));
      });
      // Só atualiza se encontrou — nunca sobrescreve com null (preserva o default correto)
      if (match) HEAD_PCT_COLS[ph.key] = match.StaticName;
    });
  } catch {/* mantém defaults */}
}

// ─── Date Helpers (always LOCAL midnight — never UTC) ──────────────────────────
function parseSPDate(v) {
  if (!v) return null;
  const s = String(v).trim();
  if (!s) return null;
  if (s.includes('T')) {
    const [y, m, d] = s.split('T')[0].split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  if (s.includes('/')) {
    const [d, m, y] = s.split(' ')[0].split('/').map(Number);
    if (y && m && d) return new Date(y, m - 1, d);
  }
  if (s.includes('-')) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  return null;
}

  // → YYYY-MM-DD for <input type="date">
  const d = parseSPDate(raw);
  if (!d || isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function fmtDateForSP(raw) {
  // → "YYYY-MM-DDTHH:mm:ssZ" (avoids UTC shift)
  const d = parseSPDate(raw);
  if (!d || isNaN(d)) return null;
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}T00:00:00Z`;
}
function fmtDateDisplay(raw) {

  return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
}
function monthKey(date) {
  const d = typeof date === 'string' ? parseSPDate(date) : date;
  if (!d || isNaN(d)) return null;
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function monthLabel(mk) {
  if (!mk) return '';
  const [y, m] = mk.split('-');
  return ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'][parseInt(m) - 1] + '/' + y;
}
function rangeMonths(start, end) {
  if (!start || !end) return [];
  const [sy, sm] = start.split('-').map(Number);
  const [ey, em] = end.split('-').map(Number);
  if (!sy || !sm || !ey || !em) return [];
  const s = new Date(sy, sm - 1, 1);
  const e = new Date(ey, em - 1, 1);
  const out = [];
  let cur = new Date(s);
  while (cur <= e && out.length < 36) {
    out.push(`${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}`);
    cur.setMonth(cur.getMonth() + 1);
  }
  return out;
}
function daysOverlapInMonth(startRaw, endRaw, mk) {
  if (!startRaw || !endRaw || !mk) return 0;
  const [y, m] = mk.split('-').map(Number);
  const mS = new Date(y, m - 1, 1),
    mE = new Date(y, m, 0);
  const phS = parseSPDate(startRaw),
    phE = parseSPDate(endRaw);
  if (!phS || !phE) return 0;
  const oS = phS > mS ? phS : mS,
    oE = phE < mE ? phE : mE;
  return Math.max(0, Math.round((oE - oS) / 864e5) + 1);
}

// ─── Build SP PATCH/POST payload from internal project ────────────────────────
function buildSPPayload(project) {
  const payload = {};

  if (project.title !== undefined) payload['Title'] = project.title || null;
  if (project.client !== undefined) payload['Cliente'] = project.client || null;
  if (project.status !== undefined) payload['Status_Programa'] = project.status || null;
  if (project.ciclo !== undefined) payload['Ciclo_Orcamentario'] = project.ciclo || null;
  if (project.ka !== undefined) payload['KA'] = project.ka || null;
  if (project.trimestre !== undefined) payload['Trimestre_Orcamentario'] = project.trimestre || null;
  if (project.semestre !== undefined) payload['Periodo'] = project.semestre || null;
  if (project.codigoProposta !== undefined) payload['Codigo_Proposta'] = project.codigoProposta || null;
  if (project.publico !== undefined) payload['Publico'] = project.publico || null;
  if (project.pedra !== undefined) payload['Pedra'] = project.pedra || null;
  if (project.respPedra !== undefined) payload['Responsavel_Pedra'] = project.respPedra || null;
  if (project.tipoProg !== undefined) payload['Tipo_Programa'] = project.tipoProg || null;
  if (project.qtdVagas !== undefined && project.qtdVagas > 0) payload['Quantidade_Vagas_Prevista'] = project.qtdVagas;
  if (project.solucao !== undefined) payload['FrenteNegocio'] = project.solucao || null;
  if (project.produto !== undefined) payload['Produto_Principal'] = project.produto || null;
  if (project.head1 !== undefined) payload['Head_1'] = project.head1 || null;
  if (project.head2 !== undefined) payload['Head_2'] = project.head2 || null;
  if (project.head3 !== undefined) payload['Head_3'] = project.head3 || null;
  for (let i = 0; i < MAX_ANALYSTS; i++) {
    payload[`Analista_${i + 1}`] = project.analysts[i] || null;
  }
  PHASES.forEach(ph => {
    const phase = project.phases[ph.key] || {};
    const headPhase = project.headPhases?.[ph.key] || {};
    const total = totalPhasePct(phase);
    const headTotal = totalPhasePct(headPhase);
    payload[`Inicio_${ph.key}`] = phase.start ? fmtDateForSP(phase.start) : null;
    payload[PHASE_END_COLS[ph.key] || `Fim_${ph.key}`] = phase.end ? fmtDateForSP(phase.end) : null;
    if (!PHASE_NO_PCT.has(ph.key)) {
      payload[`Analista_${ph.key}_PCT`] = pctToSP(total);
      const headCol = HEAD_PCT_COLS[ph.key];
      if (headCol) payload[headCol] = pctToSP(headTotal);
    }
  });
  return payload;
}

// ─── Compute Allocations (day-weighted, per-analyst pct) ──────────────────────
function computeAllocations(projects) {
  const result = {};
  projects.forEach(proj => {
    proj.analysts.forEach((analyst, idx) => {
      if (!analyst) return;
      if (!result[analyst]) result[analyst] = {};
      PHASES.forEach(ph => {
        const phase = proj.phases[ph.key];
        const pct = phase?.pcts?.[idx] || 0;
        if (!phase?.start || !phase?.end || !pct) return;
        const sMk = monthKey(parseSPDate(phase.start));
        const eMk = monthKey(parseSPDate(phase.end));
        if (!sMk || !eMk) return;
        rangeMonths(sMk, eMk).forEach(mk => {
          const [y, m] = mk.split('-').map(Number);
          const dim = new Date(y, m, 0).getDate();
          const ov = daysOverlapInMonth(phase.start, phase.end, mk);
          result[analyst][mk] = (result[analyst][mk] || 0) + pct * (ov / dim);
        });
      });
    });
  });
  Object.values(result).forEach(a => Object.keys(a).forEach(mk => {
    a[mk] = Math.round(a[mk]);
  }));
  return result;
}

// ─── Weekly / Daily Allocation Computation ────────────────────────────────────
function weekMonday(d) {
  const day = calSoD(d instanceof Date ? d : parseSPDate(d) || new Date());
  return calAddDays(day, -((day.getDay() || 7) - 1));
}

  const m = weekMonday(d instanceof Date ? d : parseSPDate(d) || new Date());
  return `${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, '0')}-${String(m.getDate()).padStart(2, '0')}`;
}
function weekLabel(wk) {
  const d = parseSPDate(wk);
  if (!d) return wk;
  return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function rangeWeeks(startMk, endMk) {
  const [sy, sm] = startMk.split('-').map(Number);
  const [ey, em] = endMk.split('-').map(Number);
  const endDate = new Date(ey, em, 0);
  let cur = weekMonday(new Date(sy, sm - 1, 1));
  const wks = [];
  while (cur <= endDate && wks.length < 104) {
    wks.push(weekKey(cur));
    cur = calAddDays(cur, 7);
  }
  return wks;
}
function dayKey(d) {
  const day = calSoD(d instanceof Date ? d : parseSPDate(d) || new Date());
  return `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, '0')}-${String(day.getDate()).padStart(2, '0')}`;
}
function rangeDays(startMk, endMk, maxDays = 45) {
  const [sy, sm] = startMk.split('-').map(Number);
  const [ey, em] = endMk.split('-').map(Number);
  const endDate = new Date(ey, em, 0);
  let cur = calSoD(new Date(sy, sm - 1, 1));
  const result = [];
  while (cur <= endDate && result.length < maxDays) {
    result.push(dayKey(cur));
    cur = calAddDays(cur, 1);
  }
  return result;
}
function computeAllocationsWeekly(projects, weeks) {
  const result = {};
  projects.forEach(proj => {
    proj.analysts.forEach((analyst, idx) => {
      if (!analyst) return;
      if (!result[analyst]) result[analyst] = {};
      PHASES.forEach(ph => {
        const phase = proj.phases[ph.key];
        const pct = phase?.pcts?.[idx] || 0;
        if (!phase?.start || !phase?.end || !pct) return;
        weeks.forEach(wk => {
          const wkS = parseSPDate(wk),
            wkE = calAddDays(wkS, 6);
          const phS = parseSPDate(phase.start),
            phE = parseSPDate(phase.end);
          if (!phS || !phE) return;
          const oS = phS > wkS ? phS : wkS,
            oE = phE < wkE ? phE : wkE;
          const ov = Math.max(0, Math.round((oE - oS) / 864e5) + 1);
          if (ov > 0) result[analyst][wk] = (result[analyst][wk] || 0) + pct * (ov / 7);
        });
      });
    });
  });
  Object.values(result).forEach(a => Object.keys(a).forEach(k => {
    a[k] = Math.round(a[k]);
  }));
  return result;
}
function computeAllocationsDaily(projects, days) {
  const result = {};
  projects.forEach(proj => {
    proj.analysts.forEach((analyst, idx) => {
      if (!analyst) return;
      if (!result[analyst]) result[analyst] = {};
      PHASES.forEach(ph => {
        const phase = proj.phases[ph.key];
        const pct = phase?.pcts?.[idx] || 0;
        if (!phase?.start || !phase?.end || !pct) return;
        const phS = parseSPDate(phase.start),
          phE = parseSPDate(phase.end);
        if (!phS || !phE) return;
        days.forEach(dk => {
          const d = parseSPDate(dk);
          if (d >= phS && d <= phE) result[analyst][dk] = (result[analyst][dk] || 0) + pct;
        });
      });
    });
  });
  Object.values(result).forEach(a => Object.keys(a).forEach(k => {
    a[k] = Math.round(a[k]);
  }));
  return result;
}

function _projHeads(proj) {

        const phase = proj.headPhases?.[ph.key];

function calcNpsMetrics(rows, scoreCol) {
  const valid = rows.filter(r => {
    const v = r[scoreCol];
    if (v === '' || v === null || v === undefined) return false;
    const n = Number(v);
    return !isNaN(n) && n >= 0 && n <= 10; // estrito 0-10: exclui notas 1-5 de classificação
  });
  const total = valid.length;
  if (!total) return {
    total: 0,
    respondentes: rows.length,
    promotores: 0,
    neutros: 0,
    detratores: 0,
    nps: null,
    pctProm: 0,
    pctNeu: 0,
    pctDet: 0
  };
  const promotores = valid.filter(r => Number(r[scoreCol]) >= 9).length;
  const neutros = valid.filter(r => Number(r[scoreCol]) >= 7 && Number(r[scoreCol]) <= 8).length;
  const detratores = valid.filter(r => Number(r[scoreCol]) <= 6).length;
  const nps = Math.round((promotores - detratores) / total * 100);
  return {
    total,
    respondentes: rows.length,
    promotores,
    neutros,
    detratores,
    nps,
    pctProm: Math.round(promotores / total * 100),
    pctNeu: Math.round(neutros / total * 100),
    pctDet: Math.round(detratores / total * 100)
  };
}

async function fetchMoskitCSV(clientId, tenantId) {
  const token = await acquireTokenForResource(clientId, tenantId, MOSKIT_SP_SCOPE);

  const url = `${MOSKIT_SITE_URL}/_api/web/GetFileByServerRelativeUrl('${safeRel}')/$value`;
  const res = await fetch(url, {
    headers: {
      'Authorization': `Bearer ${token}`
    }
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const buffer = await res.arrayBuffer();
  // Try UTF-8 first; if garbled characters detected, fall back to Windows-1252
  const utf8 = new TextDecoder('utf-8').decode(buffer);
  if (utf8.includes('\uFFFD')) return new TextDecoder('windows-1252').decode(buffer);
  return utf8;
}

    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/json;odata=nometadata',
      ...(opts.headers || {})

  });
  if (!res.ok) {
    const t = await res.text().catch(() => '');

  return res.json();

// Busca o item marcador sem $filter (mais confiável — SP às vezes não retorna resultado
// com $filter em Title mesmo o item existindo, causando tentativa de criação duplicada).
async function _findDistItem(token, siteUrl) {
  const base = _spListBase(siteUrl, SP_LIST_NAME);
  const hdrs = {
    'Authorization': `Bearer ${token}`,
    'Accept': 'application/json;odata=nometadata'
  };
  let url = `${base}/items?$select=Id,Title&$top=500`;
  while (url) {
    const res = await fetch(url, {
      headers: hdrs
    });
    if (!res.ok) return null;
    const json = await res.json();
    const found = (json.value || []).find(i => i.Title === DIST_MARKER);
    if (found) return found;
    url = json['@odata.nextLink'] || null;
  }
  return null;
}
async function _getOrCreateDistItem(token, siteUrl) {
  const base = _spListBase(siteUrl, SP_LIST_NAME);
  const hdrs = {
    'Authorization': `Bearer ${token}`,
    'Accept': 'application/json;odata=nometadata'
  };

  // 1. Busca sem $filter server-side (evita inconsistências do SP)
  const existing = await _findDistItem(token, siteUrl);
  if (existing) return existing.Id;

  // 2. Cria o item marcador
  const postRes = await fetch(`${base}/items`, {
    method: 'POST',
    headers: {
      ...hdrs,
      'Content-Type': 'application/json;odata=nometadata'
    },
    body: JSON.stringify({
      Title: DIST_MARKER
    })
  });
  if (postRes.ok) return (await postRes.json()).Id;

  // 3. Se criação falhar (duplicate ou race condition), tenta achar de novo
  const retry = await _findDistItem(token, siteUrl);
  if (retry) return retry.Id;
  const t = await postRes.text().catch(() => '');
  throw new Error(`Erro ao criar dist item: ${postRes.status} ${t.slice(0, 150)}`);
}
async function fetchDistFile(token, siteUrl) {
  // "Arquivo não existe ainda" é diferente de "erro de rede/auth".
  // Somente retorna objeto vazio quando é 1º uso (sem item ou 404 no attachment).
  // Para qualquer outro erro, lança — assim loadAll pode bloquear saves e avisar o usuário.
  const item = await _findDistItem(token, siteUrl);
  if (!item) return {
    distributions: {},
    localProjects: []
  }; // 1º uso, sem dados ainda
  const base = _spListBase(siteUrl, SP_LIST_NAME);
  const attRes = await fetch(`${base}/items(${item.Id})/AttachmentFiles('${DIST_ATT_NAME}')/$value`, {
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'text/plain'
    }
  });
  if (attRes.status === 404) return {
    distributions: {},
    localProjects: []
  }; // attachment ainda não criado
  if (!attRes.ok) throw new Error(`Erro ao ler dist.json do SharePoint: ${attRes.status}`);
  const text = await attRes.text();
  try {
    return JSON.parse(text);
  } catch {
    throw new Error('dist.json está corrompido (JSON inválido). Contate o suporte antes de continuar.');
  }
}
async function saveDistFile(token, siteUrl, data) {
  const base = _spListBase(siteUrl, SP_LIST_NAME);
  const itemId = await _getOrCreateDistItem(token, siteUrl);
  const body = new TextEncoder().encode(JSON.stringify(data));
  const hdrs = {
    'Authorization': `Bearer ${token}`,
    'Content-Type': 'application/octet-stream'
  };
  // Strategy: try PUT ($value update) first — works if attachment already exists.
  // If 404 (doesn't exist yet), fall back to add(). Avoids 409 from delete+create race.
  const putRes = await fetch(`${base}/items(${itemId})/AttachmentFiles('${DIST_ATT_NAME}')/$value`, {
    method: 'PUT',
    headers: hdrs,
    body
  });
  if (putRes.ok) return; // updated successfully
  if (putRes.status !== 404) {
    // Unexpected error on PUT — try DELETE then ADD as fallback
    await fetch(`${base}/items(${itemId})/AttachmentFiles('${DIST_ATT_NAME}')`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'X-HTTP-Method': 'DELETE',
        'If-Match': '*'
      }
    }).catch(() => {});
  }
  // Add (create) the attachment
  const addRes = await fetch(`${base}/items(${itemId})/AttachmentFiles/add(FileName='${DIST_ATT_NAME}')`, {
    method: 'POST',
    headers: hdrs,
    body
  });
  if (!addRes.ok) {
    const t = await addRes.text().catch(() => '');
    throw new Error(`Erro ao salvar dist: ${addRes.status} ${t.slice(0, 150)}`);
  }
}

// Merge SP items + distribution file → complete project list
function mergeProjectsWithDist(spItems, dist) {
  const spProjects = spItems.filter(item => item.Title !== DIST_MARKER).map(item => {
    const proj = parseSPItem(item);
    const projHeadNames = _projHeads(proj);

    // Restore analyst per-phase pcts from dist.json
    const saved = dist.distributions?.[String(proj.spId)];
    const phases = {};
    PHASES.forEach(ph => {
      const base = proj.phases[ph.key];
      const storedPcts = saved?.[ph.key];
      phases[ph.key] = {
        ...base,
        pcts: storedPcts && storedPcts.length === proj.analysts.length ? storedPcts : base.pcts
      };
    });

    // Restore head per-phase pcts from dist.json (headDistributions)
    // Usa storedPcts sempre que existirem (sem check de comprimento exato —
    // diferente dos analistas, a contagem de heads pode variar levemente).
    const savedHead = dist.headDistributions?.[String(proj.spId)];
    const headPhases = {};
    PHASES.forEach(ph => {
      const base = proj.headPhases[ph.key];
      const storedPcts = savedHead?.[ph.key];
      // Usa dist.json se tiver dados; adapta o tamanho ao número atual de heads
      const bestPcts = storedPcts && storedPcts.some(p => p > 0) ? storedPcts.slice(0, Math.max(projHeadNames.length, 1)) : base.pcts;
      headPhases[ph.key] = {
        ...base,
        pcts: bestPcts
      };
    });
    return {
      ...proj,
      phases,
      headPhases
    };
  });
  return [...spProjects, ...(dist.localProjects || [])];
}

// 2=Text, 3=Note, 4=DateTime, 6=Choice, 8=Boolean, 9=Number, 10=Currency, 15=MultiChoice

// Mapeamento explícito: k do código → StaticName real no SP (obtido via console log).
// null = campo não existe no SP (será silenciosamente ignorado no save).

  'Meta_etnico_racial': 'Tevemetaparap_x00fa_blico_x00e9_',
  // Choice: Não teve/Atingida/Não atingida
  'Meta_feminino': 'Tevemetaparap_x00fa_blicofeminin',
  // Choice: Não teve/Atingida/Não atingida
  'Meta_PcD': 'Metaparap_x00fa_blicoPcD',
  // Choice: Não teve/Atingida/Não atingida
  'Meta_LGBTQIA': 'Metaparap_x00fa_blicoLGBTQIA_x00',
  // Choice: Não teve/Atingida/Não atingida

  'Flexibilizacao_criterios_internos': 'Flexibiliza_x00e7__x00e3_odecrit',
  'Criterios_Flexibilizados_Internos': 'Crit_x00e9_rios_Flexibilizados_I',
  // Prospecção — EntityPropertyName tem prefixo OData_ (SP adiciona quando InternalName começa com _x)
  '_1a_Prospeccao': 'OData__x0031__x00aa__Prospec_x00e7_ao',
  '_2a_Prospeccao': 'OData__x0032__x00aa__Prospec_x00e7_ao',
  '_3a_Prospeccao': 'OData__x0033__x00aa__Prospec_x00e7_ao'
  // Data_Inicio/Termino_Etapa removidos do PULSE_FIELDS — datas unificadas com alocação
};
const _spFieldMap = {}; // { codigoKey → StaticName real no SP }
const _spValidFields = new Set(); // StaticNames reais e graváveis
const _spRequiredFields = new Set(); // StaticNames de campos Required no SP
const _spFieldTypes = {}; // { StaticName → FieldTypeKind } — para saber o tipo real no SP
const _spUnresolved = []; // PULSE_FIELDS sem correspondência confirmada no SP

// Decodifica _xNNNN_ usado pelo SP nos nomes internos de colunas com acentos/especiais
// Ex: 'Semestre_Or_x00e7_ament_x00e1_rio' → 'Semestre_Orçamentário'
function _decodeSPName(s) {
  return (s || '').replace(/_x([0-9a-fA-F]{4})_/gi, (m, h) => String.fromCharCode(parseInt(h, 16)));
}
// Normaliza para comparação: decode SP → remove acentos → lowercase → só alfanumérico
function _normMatch(s) {
  return _decodeSPName(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
}
async function fetchSPChoices(token, siteUrl, listName) {
  _spUnresolved.length = 0; // reset
  try {
    const base = _spListBase(siteUrl, listName);
    const json = await spFetch(token, `${base}/fields?$select=InternalName,StaticName,Title,Choices,FieldTypeKind,ReadOnlyField,Required&$top=500`);
    const allFields = json.value || [];
    const choiceMap = {};

    // Separa campos graváveis
    const writable = allFields.filter(f => !f.ReadOnlyField && SP_WRITABLE_TYPES.has(f.FieldTypeKind));
    writable.forEach(f => {
      if (f.InternalName) _spValidFields.add(f.InternalName);
      if (f.StaticName) _spValidFields.add(f.StaticName);
      // Registra o tipo real do campo — usado em savePulse para enviar número vs. string
      if (f.InternalName) _spFieldTypes[f.InternalName] = f.FieldTypeKind;
      if (f.StaticName) _spFieldTypes[f.StaticName] = f.FieldTypeKind;
      // Registra campos obrigatórios — null será omitido para esses
      if (f.Required) {
        if (f.InternalName) _spRequiredFields.add(f.InternalName);
        if (f.StaticName) _spRequiredFields.add(f.StaticName);
      }
      if (f.FieldTypeKind === 6 || f.FieldTypeKind === 15) {
        const choices = (f.Choices?.results || f.Choices || []).filter(c => c && c.trim());
        if (choices.length) {
          if (f.InternalName) choiceMap[f.InternalName] = choices;
          if (f.StaticName && f.StaticName !== f.InternalName) choiceMap[f.StaticName] = choices;
        }
      }
    });

    // Log diagnóstico completo — abre DevTools (F12 → Console)
    // Mostra TODOS os campos do SP com tipo e flag ReadOnly para achar os que faltam
    console.log('📋 TODOS os campos SP (Tipo | RO | InternalName | StaticName | Title):');
    allFields.forEach(f => console.log(`  [${f.FieldTypeKind}${f.ReadOnlyField ? '|RO' : ''}] ${f.InternalName} | ${f.StaticName} | ${f.Title}`));

    // Passo 0: aplicar overrides explícitos primeiro (nomes confirmados via console log)
    Object.entries(PULSE_FIELD_SP_OVERRIDES).forEach(([k, spName]) => {
      if (spName === null) {
        _spFieldMap[k] = '__nonexistent__'; // não existe no SP — skip silencioso
      } else {
        _spFieldMap[k] = spName;
        _spValidFields.add(spName);
      }
    });

    // Match em 3 passos para campos não cobertos pelos overrides
    const normK = f => _normMatch(f.k);
    PULSE_FIELDS.forEach(f => {
      if (_spFieldMap[f.k]) return; // já resolvido pelo override
      const nk = normK(f);

      // 1. Exact string match (InternalName ou StaticName)
      let match = writable.find(sf => sf.InternalName === f.k || sf.StaticName === f.k);

      // 2. Normalized exact match — resolve diferenças de codificação de acentos no SP
      //    Ex: código 'Semestre_Orcamentario' ↔ SP 'Semestre_Or_x00e7_ament_x00e1_rio'
      if (!match) match = writable.find(sf => _normMatch(sf.InternalName) === nk || _normMatch(sf.StaticName) === nk);

      // 3. Normalized Title match — para casos onde o nome interno difere muito do label
      //    Só aceita match EXATO (normalizado) no Title para evitar ambiguidade
      if (!match) {
        const normL = _normMatch(f.l);
        match = writable.find(sf => _normMatch(sf.Title) === normL);
      }
      if (match) {
        _spFieldMap[f.k] = match.StaticName || match.InternalName;
        _spValidFields.add(_spFieldMap[f.k]);
      } else if (_spFieldMap[f.k] !== '__nonexistent__') {
        _spUnresolved.push({
          k: f.k,
          l: f.l,
          s: f.s
        });
      }
      if ((f.t === 'select' || f.t === 'multicheck') && !f.fixedOptions) {
        const resolved = _spFieldMap[f.k] || f.k;
        const opts = choiceMap[resolved] || choiceMap[f.k];
        if (opts) f.o = opts.filter(o => !/^Escolha\s*\d+$/i.test(o.trim()));
      }
    });
    if (_spUnresolved.length > 0) {
      console.warn('⚠️ PULSE_FIELDS sem match no SP (código k → label):');
      _spUnresolved.forEach(u => console.warn(`  k:"${u.k}" → l:"${u.l}"`));
    } else {
      console.log('✅ Todos os PULSE_FIELDS mapeados com sucesso no SP.');
    }
    return choiceMap;
  } catch {
    return {};
  }
}

// Retorna o StaticName real para usar no PATCH — se não houver mapeamento, usa f.k original
function _resolveFieldName(k) {
  return _spFieldMap[k] || k;
}

// Retorna true se o campo é seguro para incluir no PATCH
function _isSpWritable(k) {
  if (_spValidFields.size === 0) return true; // fallback: inclui tudo se não carregou
  const resolved = _resolveFieldName(k);
  return _spValidFields.has(resolved) || _spValidFields.has(k);
}

  (colResp.data || []).forEach(c => { collMap[c.id] = c.name || ''; });
  const total = firstResp.total || 0;
  const totalPages = Math.ceil(total / 100);
  const allData = [...(firstResp.data || [])];
  for (let p = 2; p <= totalPages; p++) {
    if (onProgress) onProgress(p, totalPages);
    const r = await smFetch('/surveys/' + SM_CAND_ID + '/responses/bulk?per_page=100&page=' + p);
    allData.push(...(r.data || []));
    if (p % 10 === 0 && p < totalPages) await new Promise(r => setTimeout(r, 300));
  }

  // Parse all responses
  function parseCandResponse(r) {
    const qMap = {};
    for (const p of r.pages || []) {
      for (const q of p.questions || []) { qMap[q.id] = q.answers || []; }
    }
    const npsRaw = (qMap[SM_CAND_NPS_QID] || [])[0]?.text || '';
    const nps = parseInt(npsRaw, 10);
    const imprAns = (qMap[SM_CAND_IMPR_QID] || [])[0];
    const facilAns = (qMap[SM_CAND_FACIL_QID] || [])[0];
    const comentAns = (qMap['245840110'] || [])[0];
    return {
      programa: collMap[r.collector_id] || '',
      nps: isNaN(nps) ? null : nps,
      impressao: imprAns ? (SM_CAND_IMPR_CHOICES[imprAns.choice_id] || null) : null,
      facilidade: facilAns ? (SM_CAND_FACIL_CHOICES[facilAns.choice_id] || null) : null,
      comentario: comentAns?.text || '',
      tipoPesquisa: 'Avaliado em etapa (survey)',
      data: (r.date_created || '').slice(0,10),
      source: 'SM'
    };
  }

  return allData.map(parseCandResponse);
}

// Normalizes Excel rows into unified candidate rows \u2014 formato longo (long format)
// Estrutura: C\u00d3DIGO (processo) | PROCESSO_SELETIVO | TIPO_PESQUISA | CODIGO_CANDIDATO | PERGUNTA | RESPOSTA | SUB_RESPOSTA
// Chave de agrupamento: (CODIGO_CANDIDATO + '|' + C\u00d3DIGO) \u2192 1 respondente por processo
// Returns {rows, diag}
// Estrutura do Excel Base_Pesquisa_8020:
//   [0] CÓDIGO           — código numérico do programa (= ID_do_Programa_ATS no SP)
//   [1] PROCESSO_SELETIVO — nome do programa
//   [2] TIPO_PESQUISA    — tipo da pesquisa (ex: "Avaliação Comportamental CT")
//   [3] CODIGO_CANDIDATO — identificador único do candidato (respondente)
//   [4] PERGUNTA         — pergunta (formato longo: N linhas por respondente)
//   [5] RESPOSTA         — resposta
//   [6] SUB_RESPOSTA     — ranking (1,2,3) para perguntas multi-select
//
// Matching SP: CÓDIGO ↔ pulseData['ID_do_Programa_ATS'] (= campo ID_do_Programa_Globe no SP)
function normalizeCandExcelRows(excelRows) {
  if (!excelRows || !excelRows.length) return { rows: [], diag: {} };
  const cols = Object.keys(excelRows[0]);

  // norm: remove acentos + não-alfanumérico → para comparação de padrões de coluna/pergunta
  const norm = s => (s||'').toString().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
  // find: retorna nome da coluna cujo norm inclui qualquer padrão da lista
  const find = patterns => cols.find(c => patterns.some(p => norm(c).includes(norm(p))));

  // ── Detecção de colunas com fallback por índice (estrutura conhecida e estável) ──
  // CÓDIGO: match exato (norm='codigo') para não confundir com CODIGO_CANDIDATO ('codigocandidato')
  const codigoCol    = cols.find(c => norm(c) === 'codigo') || cols[0]; // CÓDIGO (= ATS ID → match com SP)
  const processoCol  = find(['processo','programa']) || cols[1]; // PROCESSO_SELETIVO
  const tipoPesqCol  = find(['tipo'])                || cols[2]; // TIPO_PESQUISA
  const candidatoCol = find(['candidato'])           || cols[3]; // CODIGO_CANDIDATO
  const perguntaCol  = find(['pergunta'])            || cols[4]; // PERGUNTA
  const respostaCol  = find(['resposta'])            || cols[5]; // RESPOSTA

  if (!perguntaCol || !respostaCol) {
    return { rows: [], diag: { error: 'Colunas PERGUNTA/RESPOSTA não encontradas. Colunas: ' + cols.join(', ') } };
  }

  // ── Agrupa por respondente: chave = CODIGO_CANDIDATO + '|' + CÓDIGO ──
  // CÓDIGO é o id numérico do programa e é comparado com SP.pulseData['ID_do_Programa_ATS']
  const byKey = {};
  let skippedNoCand = 0;
  excelRows.forEach(row => {
    const cand = String(row[candidatoCol] ?? '').trim();
    const cod  = String(row[codigoCol]    ?? '').trim();
    if (!cand) { skippedNoCand++; return; } // sem candidato → ignora linha
    const key  = cand + '|' + cod;

    if (!byKey[key]) byKey[key] = {
      processo:     String(row[processoCol]  || '').trim(),
      tipoPesquisa: String(row[tipoPesqCol]  || '').trim(),
      codigo:       cod,
      idAts:        cod, // CÓDIGO = ID do programa → atsToProject faz match com SP.ID_do_Programa_ATS
      answers:      {},  // pergNorm → primeira resposta (single-answer)
      lists:        {}   // pergNorm → [respostas] (multi-select: motivos, expectativas)
    };

    const perg = String(row[perguntaCol] || '').trim();
    const resp = String(row[respostaCol] ?? '').trim();
    if (!perg) return; // linha sem pergunta → ignora

    const pergNorm = norm(perg);

    // Perguntas multi-select: coleta TODAS as respostas em lista
    if (pergNorm.includes('motivos') || pergNorm.includes('expectativas')) {
      if (!byKey[key].lists[pergNorm]) byKey[key].lists[pergNorm] = [];
      if (resp) byKey[key].lists[pergNorm].push(resp);
    } else {
      // Single-answer: primeira ocorrência vence
      if (!(pergNorm in byKey[key].answers)) byKey[key].answers[pergNorm] = resp;
    }
  });

  // ── Helpers ──
  // Busca valor de pergunta por padrão (tenta padrões em ordem, retorna null se nenhum)
  const getAns = (answers, ...patterns) => {
    for (const pat of patterns) {
      const k = Object.keys(answers).find(k => k.includes(pat));
      if (k != null) return answers[k] || null;
    }
    return null;
  };
  // Converte resposta para escala 1–5; null se fora do intervalo
  const p15 = val => {
    if (val == null || val === '') return null;
    const n = parseInt(String(val), 10);
    return (!isNaN(n) && n >= 1 && n <= 5) ? n : null;
  };
  // Normaliza rótulos de "experiência comparada" (variações de capitalização/espaço/trailing)
  const normExp = s => {
    if (!s) return null;
    const t = s.trim();
    const l = t.toLowerCase();
    if (l.startsWith('prefiro esta'))                                     return 'Prefiro esta';
    if (l.startsWith('prefiro outras') || l.startsWith('prefiro outra')) return 'Prefiro outras';
    if (l.includes('semelhante'))                                          return 'São semelhantes';
    if (l.includes('1a vez') || l.includes('primeira vez'))              return 'Primeira vez neste tipo';
    if (l.includes('saberia dizer'))                                       return 'Não saberia dizer';
    if (l === 'melhor' || (l.includes('melhor') && l.length < 30))       return 'Melhor';
    if (l === 'igual'  || (l.includes('igual')  && l.length < 30))       return 'Igual';
    if (l === 'pior'   || (l.includes('pior')   && l.length < 30))       return 'Pior';
    return t;
  };

  // ── Constrói 1 linha de saída por respondente ──
  const result = Object.values(byKey).map(entry => {
    const { processo, tipoPesquisa, codigo, idAts, answers, lists } = entry;
    const getList = pat => {
      const k = Object.keys(lists).find(k => k.includes(pat));
      return k ? lists[k] : [];
    };
    const npsStr = getAns(answers, 'recomendar');
    const npsVal = npsStr != null ? parseInt(npsStr, 10) : NaN;
    return {
      programa:       processo,
      nps:            (!isNaN(npsVal) && npsVal >= 0 && npsVal <= 10) ? npsVal : null,
      impressao:      p15(getAns(answers, 'impressoes', 'impressao')),
      facilidade:     p15(getAns(answers, 'facilidade')),
      conduta:        p15(getAns(answers, 'conduziu', 'maneira')),
      representantes: p15(getAns(answers, 'representantes')),
      informacoes:    p15(getAns(answers, 'informac')),
      experiencia:    normExp(getAns(answers, 'comparada')),
      expInscricao:   normExp(getAns(answers, 'anteriores')),
      motivos:        getList('motivos'),
      expectativas:   getList('expectativas'),
      comentario:     getAns(answers, 'sugestao', 'comentario') || '',
      outrosPS:       getAns(answers, 'alemdeste') || null,
      sentimosReason: getAns(answers, 'sentimos')  || null,
      tipoPesquisa:   tipoPesquisa || '',
      codigo:         codigo || '',
      idAts:          idAts  || '',  // = CÓDIGO → atsToProject casa com SP.ID_do_Programa_ATS
      data:           '',
      source:         'Excel'
    };
  });

  return { rows: result, diag: {
    totalInput:        excelRows.length,
    uniqueRespondents: result.length,
    nullCandSkipped:   skippedNoCand,
    colsDetected: { codigoCol, candidatoCol, processoCol, tipoPesqCol, perguntaCol, respostaCol }
  }};
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const local = loadLocal();
  const [projects, setProjects] = useState([]);
  const [authState, setAuthState] = useState({
    isAuth: false,
    user: '',
    token: ''
  });
  const [clientId, setClientId] = useState(APP_CONFIG.clientId || local.clientId || '');
  const [tenantId, setTenantId] = useState(APP_CONFIG.tenantId || local.tenantId || 'common');
  const [loading, setLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');
  const [saveMsg, setSaveMsg] = useState(null);
  const [view, setView] = useState('dashboard');
  const [monthRange, setMonthRange] = useState(() => {
    const n = new Date();
    const s = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}`;
    const e = new Date(n.getFullYear() + 1, n.getMonth(), 1);
    return {
      start: s,
      end: `${e.getFullYear()}-${String(e.getMonth() + 1).padStart(2, '0')}`
    };
  });
  const [distData, setDistData] = useState({
    distributions: {},
    localProjects: []
  });
  const [teamMembers, setTeamMembers] = useState([]);
  const [cicloFilter, setCicloFilter] = useState('');
  const [showEdit, setShowEdit] = useState(null); // project obj or 'new'
  const [showAnalystDetail, setShowAnalystDetail] = useState(null);
  const [module, setModule] = useState(null); // null=home | 'gestao' | 'pulse'
  const [accessLevel, setAccessLevel] = useState(null); // 1|2=full 3+=pulse-only 99=não encontrado
  const [userFuncao, setUserFuncao] = useState(''); // valor da coluna Função na List_Pulse_Equipe
  const [extraAllocations, setExtraAllocations] = useState([]);
  const [vacations, setVacations] = useState([]);
  const [headMembers, setHeadMembers] = useState([]);
  const [teamDescriptivos, setTeamDescriptivos] = useState({});
  const [headDescriptivos, setHeadDescriptivos] = useState({});
  const [kaMembers, setKaMembers] = useState([]);
  const [entityView, setEntityView] = useState('analyst'); // 'analyst' | 'head'
  const [spChoices, setSpChoices] = useState({}); // campos Choice do SP
  // Analytics — rastreia eventos da sessão para evitar duplicatas
  const sessionLoggedRef = useRef(new Set()); // 'login', 'module:pulse', 'save:project', etc.

  // ── projectsRef: sempre aponta para o projects mais recente ─────────────────
  // Evita stale closure em saveProject: sem isso, maxIndice sempre seria 0
  // (o valor de projects no momento do login), gerando indice=1 sempre → duplicate.
  const projectsRef = useRef(projects);
  projectsRef.current = projects;

  // ── distDataRef: sempre aponta para o distData mais recente ──────────────────
  // Evita race conditions de stale closure: qualquer save que aconteça após outro
  // save (ex: salvar férias e depois salvar projeto) lê o estado mais atual do
  // dist.json em vez do valor capturado no momento em que o callback foi criado.
  const distDataRef = useRef(distData);
  distDataRef.current = distData; // atualiza a cada render, antes de qualquer callback

  // ── saveLockRef: impede saves concorrentes ao dist.json ──────────────────────
  // Dois saves ao mesmo arquivo em paralelo → o último sobrescreve o primeiro.
  // Qualquer função que escreva no dist.json deve adquirir este lock antes de
  // iniciar e liberá-lo no finally.
  const saveLockRef = useRef(false);

  // ── distFetchBlockedRef: bloqueia saves quando fetchDistFile falhou ───────────
  // Se o dist.json não pôde ser lido do SP (rede, auth), qualquer save subsequente
  // sobrescreveria todos os dados com um objeto vazio. Este flag bloqueia saves
  // até que um loadAll bem-sucedido confirme o estado real do SP.
  const distFetchBlockedRef = useRef(false);

  // Only persist config locally when it wasn't baked into APP_CONFIG
  useEffect(() => {
    if (!APP_CONFIG.clientId) saveLocal({
      clientId,
      tenantId
    });
  }, [clientId, tenantId]);

  // Se módulo 'gestao' for acessado sem permissão, redireciona para home
  useEffect(() => {
    if (module === 'gestao' && accessLevel !== null && accessLevel >= 3) setModule(null);
  }, [module, accessLevel]);

  // Ao abrir analytics, rebusca o dist.json para trazer registros recentes de outros usuários
  useEffect(() => {
    if (module === 'analytics' && authState.isAuth && authState.token) {
      loadAll(authState.token);
    }
  }, [module]);
  const ciclos = useMemo(() => [...new Set(projects.map(p => p.ciclo).filter(Boolean))].sort(), [projects]);
  const filteredProjects = useMemo(() => cicloFilter ? projects.filter(p => p.ciclo === cicloFilter) : projects, [projects, cicloFilter]);

  // Alocações de analistas — nomes não oficiais mesclados em "Alocação pendente"
  const allocations = useMemo(() => {
    const raw = computeAllocations(filteredProjects);
    if (!teamMembers.length) return raw;
    const officialSet = new Set(teamMembers);
    const pending = {},
      result = {};
    Object.entries(raw).forEach(([name, monthAlloc]) => {
      if (officialSet.has(name)) {
        result[name] = monthAlloc;
      } else {
        Object.entries(monthAlloc).forEach(([m, pct]) => {
          pending[m] = Math.round((pending[m] || 0) + pct);
        });
      }
    });
    if (Object.keys(pending).length > 0) result[PENDING_LABEL] = pending;
    return result;
  }, [filteredProjects, teamMembers]);

  // Alocações de heads — nomes não oficiais mesclados em "Alocação pendente"
  const headAllocations = useMemo(() => {
    const raw = computeHeadAllocations(filteredProjects);
    if (!headMembers.length) return raw;
    const officialSet = new Set(headMembers);
    const pending = {},
      result = {};
    Object.entries(raw).forEach(([name, monthAlloc]) => {
      if (officialSet.has(name)) {
        result[name] = monthAlloc;
      } else {
        Object.entries(monthAlloc).forEach(([m, pct]) => {
          pending[m] = Math.round((pending[m] || 0) + pct);
        });
      }
    });
    if (Object.keys(pending).length > 0) result[PENDING_LABEL] = pending;
    return result;
  }, [filteredProjects, headMembers]);

  // Analyst list: oficial + "Alocação pendente" se houver não-oficiais alocados
  const analysts = useMemo(() => {
    if (!teamMembers.length) return Object.keys(allocations).sort();
    return PENDING_LABEL in allocations ? [...teamMembers, PENDING_LABEL] : teamMembers;
  }, [teamMembers, allocations]);

  // Head list: oficial + "Alocação pendente" se houver não-oficiais alocados
  const heads = useMemo(() => {
    if (!headMembers.length) {
      const set = new Set();
      filteredProjects.forEach(p => _projHeads(p).forEach(h => set.add(h)));
      return [...set].sort();
    }
    return PENDING_LABEL in headAllocations ? [...headMembers, PENDING_LABEL] : headMembers;
  }, [headMembers, headAllocations, filteredProjects]);
  const months = useMemo(() => rangeMonths(monthRange.start, monthRange.end), [monthRange]);
  // Alocações base + extras mescladas para o Dashboard (mensal)
  const activeAllocsWithExtras = useMemo(() => {
    const base = entityView === 'head' ? headAllocations : allocations;
    return mergeExtras(base, extraAllocations, months, 'month');
  }, [entityView, headAllocations, allocations, extraAllocations, months]);

  // ── Load all data: SP items + dist file → merged projects ──
  const loadAll = useCallback(async token => {
    setLoading(true);
    setError('');
    try {
      // Rodar primeiro para que _spValidFields e HEAD_PCT_COLS estejam prontos
      // antes de fetchSPList (evita race condition e campos inexistentes no $select)
      await fetchHeadPctCols(token, SP_SITE_URL, SP_LIST_NAME);
      const choices = await fetchSPChoices(token, SP_SITE_URL, SP_LIST_NAME);
      // fetchDistFile lança em erros reais (rede/auth/JSON corrompido).
      // Separamos do Promise.all para tratar sem abortar o carregamento dos projetos SP.
      let dist;
      let distError = null;
      try {
        dist = await fetchDistFile(token, SP_SITE_URL);
        distFetchBlockedRef.current = false; // carregou com sucesso — desbloqueia saves
      } catch (distE) {
        distError = distE.message;
        distFetchBlockedRef.current = true; // bloqueia saves até próximo loadAll bem-sucedido
        dist = null; // não sobrescreve o estado atual
      }
      const [spItems, team, hteam, kateam] = await Promise.all([fetchSPList(token, SP_SITE_URL, SP_LIST_NAME), fetchTeamMembers(token, SP_SITE_URL), fetchHeadMembers(token, SP_SITE_URL), fetchKAMembers(token, SP_SITE_URL)]);
      setSpChoices(choices || {});
      if (dist !== null) {
        // Só atualiza estado de distribuições quando o fetch foi bem-sucedido
        setDistData(dist);
        setExtraAllocations(dist.extraAllocations || []);
        setVacations(dist.vacations || []);
      }
      setTeamMembers(team.members);
      setTeamDescriptivos(team.descriptivos || {});
      setHeadMembers(hteam.members);
      setHeadDescriptivos(hteam.descriptivos || {});
      setKaMembers(kateam);
      setProjects(mergeProjectsWithDist(spItems, dist || distDataRef.current));
      if (distError) {
        setError(`⚠️ Alocações/férias não carregadas: ${distError}\nSalvamentos bloqueados até recarregar com sucesso.`);
      }
    } catch (e) {
      // Diagnostic: try to list all visible lists to find correct name
      let diagMsg = 'Erro ao carregar dados: ' + e.message;
      try {
        const diagUrl = `${SP_SITE_URL}/_api/web/lists?$select=Title,Hidden,RootFolder/ServerRelativeUrl&$expand=RootFolder&$top=100`;
        const diagRes = await fetch(diagUrl, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/json;odata=nometadata'
          }
        });
        if (diagRes.ok) {
          const diagJson = await diagRes.json();
          const names = (diagJson.value || []).map(l => `"${l.Title}"${l.Hidden ? '[oculta]' : ''} (${l.RootFolder?.ServerRelativeUrl || ''})`).join(' | ');
          diagMsg += `\n\n📋 Listas encontradas no site:\n${names || '(nenhuma)'}`;
        } else {
          diagMsg += `\n\n⚠️ Sem acesso ao site (${diagRes.status}). Verifique permissões do app no Azure AD (AllSites.Read).`;
        }
      } catch (diagE) {
        diagMsg += '\n\n⚠️ Diagnóstico falhou: ' + diagE.message;
      }
      setError(diagMsg);
    } finally {
      setLoading(false);
    }
  }, []);

  // ── Save extra allocations / vacations to the shared dist.json in SharePoint ──
  // Usa distDataRef.current (sempre atualizado) para evitar sobrescrever dados
  // salvos por outro callback antes de um re-render completar.
  const saveExtraAllocs = useCallback(async newExtras => {
    if (distFetchBlockedRef.current) {
      setSaveMsg({
        type: 'error',
        text: '❌ Dados não carregados do SP. Recarregue antes de salvar.'
      });
      setTimeout(() => setSaveMsg(null), 7000);
      throw new Error('Dist fetch blocked');
    }
    if (saveLockRef.current) {
      setSaveMsg({
        type: 'warn',
        text: '⏳ Aguarde o salvamento anterior terminar.'
      });
      setTimeout(() => setSaveMsg(null), 4000);
      throw new Error('Save in progress');
    }
    saveLockRef.current = true;
    const prevDist = distDataRef.current;
    const newDist = {
      ...prevDist,
      extraAllocations: newExtras
    };
    distDataRef.current = newDist;
    setSaving(true);
    setSaveMsg(null);
    try {
      const tok = await getWriteToken();
      await saveDistFile(tok, SP_SITE_URL, newDist);
      setExtraAllocations(newExtras);
      setDistData(newDist);
      setSaveMsg({
        type: 'success',
        text: '✅ Alocações extras salvas no SharePoint.'
      });
    } catch (e) {
      distDataRef.current = prevDist;
      setSaveMsg({
        type: 'error',
        text: `❌ Erro ao salvar alocações: ${e.message}. Tente novamente.`
      });
      throw e;
    } finally {
      saveLockRef.current = false;
      setSaving(false);
      setTimeout(() => setSaveMsg(null), 7000);
    }
  }, [authState.token]);
  const saveVacations = useCallback(async newVacs => {
    if (distFetchBlockedRef.current) {
      setSaveMsg({
        type: 'error',
        text: '❌ Dados não carregados do SP. Recarregue antes de salvar.'
      });
      setTimeout(() => setSaveMsg(null), 7000);
      throw new Error('Dist fetch blocked');
    }
    if (saveLockRef.current) {
      setSaveMsg({
        type: 'warn',
        text: '⏳ Aguarde o salvamento anterior terminar.'
      });
      setTimeout(() => setSaveMsg(null), 4000);
      throw new Error('Save in progress');
    }
    saveLockRef.current = true;
    const prevDist = distDataRef.current;
    const newDist = {
      ...prevDist,
      vacations: newVacs
    };
    distDataRef.current = newDist;
    setSaving(true);
    setSaveMsg(null);
    try {
      const tok = await getWriteToken();
      await saveDistFile(tok, SP_SITE_URL, newDist);
      // Só atualiza o estado React APÓS confirmação do SP — evita mostrar dado não salvo
      setVacations(newVacs);
      setDistData(newDist);
      setSaveMsg({
        type: 'success',
        text: '✅ Férias salvas no SharePoint.'
      });
    } catch (e) {
      distDataRef.current = prevDist;
      setSaveMsg({
        type: 'error',
        text: `❌ Erro ao salvar férias: ${e.message}. Tente novamente.`
      });
      throw e; // re-throw: modal permanece aberto e exibe erro
    } finally {
      saveLockRef.current = false;
      setSaving(false);
      setTimeout(() => setSaveMsg(null), 7000);
    }
  }, [authState.token]);

  // ── Analytics event logger ────────────────────────────────────────────────
  // Grava entrada de analytics no dist.json. Fire-and-forget — nunca bloqueia o fluxo.
  const logEvent = useCallback(async (action, detail = '') => {
    if (!authState.isAuth || !authState.token) return;
    if (distFetchBlockedRef.current) return; // não gravar analytics se dist não foi carregado

// ─── Criar coluna Frente de Negócio no SP ─────────────────────────────────────
// Cria campo Choice 'FrenteNegocio' e renomeia o título para display correto
async function createFrenteNegocioField(token, siteUrl, listName) {
  const base = _spListBase(siteUrl, listName);
  const hdrs = {
    'Authorization': `Bearer ${token}`,
    'Content-Type': 'application/json;odata=nometadata',
    'Accept': 'application/json;odata=nometadata'
  };

  // Verifica se o campo já existe
  const checkRes = await fetch(`${base}/fields?$filter=InternalName eq 'FrenteNegocio'&$select=InternalName&$top=1`, {
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/json;odata=nometadata'
    }
  });
  if (checkRes.ok) {
    const checkJson = await checkRes.json();
    if ((checkJson.value || []).length > 0) return true; // já existe
  }

  // Cria como Text (tipo 2) — mais simples, sem validação de choices
  const createRes = await fetch(`${base}/fields`, {
    method: 'POST',
    headers: hdrs,
    body: JSON.stringify({
      Title: 'FrenteNegocio',
      FieldTypeKind: 2,
      Required: false
    })
  });
  if (!createRes.ok) {
    const t = await createRes.text();
    if (!t.toLowerCase().includes('exist') && !t.includes('duplicate')) {
      throw new Error(`Criar campo: ${createRes.status} ${t.slice(0, 150)}`);
    }
  }
  return true;
}
