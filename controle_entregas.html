function CalMonthWeekRow({ week, events, month, today, onDayClick }) {
  const weekStart=week[0], weekEnd=week[6];

  const weekEvents=events
    .filter(e=>e.start<=weekEnd&&e.end>=weekStart)
    .sort((a,b)=>a.start-b.start||(b.end-b.start)-(a.end-a.start));

  const tracks=[];
  const eventTracks=new Map();
  weekEvents.forEach(evt=>{
    let placed=false;
    for (let t=0;t<tracks.length;t++) {
      const last=tracks[t][tracks[t].length-1];
      if (last.end<evt.start) { tracks[t].push(evt); eventTracks.set(evt.id,t); placed=true; break; }
    }
    if (!placed) { tracks.push([evt]); eventTracks.set(evt.id,tracks.length-1); }
  });

  const numTracks=tracks.length;
  const rowH=Math.max(90, 38+numTracks*26);

  return (
    <div className="relative border-b border-slate-100 last:border-b-0" style={{height:rowH}}>
      {/* Day cells */}
      <div className="absolute inset-0 grid grid-cols-7">
        {week.map((day,di)=>{
          const isToday=calSameDay(day,today);
          const isCurMo=day.getMonth()===month;
          return (
            <div key={di} onClick={()=>onDayClick(calSoD(day))}
              className={`border-r border-slate-100 last:border-r-0 cursor-pointer hover:bg-emerald-50/70 transition-colors ${!isCurMo?'bg-slate-50/60':''}`}>
              <div className={`text-xs w-7 h-7 flex items-center justify-center rounded-full font-semibold mx-auto mt-2
                ${isToday?'bg-emerald-500 text-white':isCurMo?'text-slate-700':'text-slate-300'}`}>
                {day.getDate()}
              </div>
            </div>
          );
        })}
      </div>
      {/* Event bars */}
      {weekEvents.map(evt=>{
        const track=eventTracks.get(evt.id);
        const cs=evt.start<weekStart?weekStart:evt.start;
        const ce=evt.end>weekEnd?weekEnd:evt.end;
        const sd=Math.round((cs-weekStart)/864e5);
        const ed=Math.round((ce-weekStart)/864e5);
        const leftPct=(sd/7)*100;
        const widthPct=((ed-sd+1)/7)*100;
        const continuesLeft=evt.start<weekStart;
        const continuesRight=evt.end>weekEnd;
        return (
          <div key={evt.id}
            onClick={e=>{e.stopPropagation();onDayClick(calSoD(cs));}}
            title={`${evt.projTitle} · ${evt.phaseLabel}\n${calFmt(evt.start)} → ${calFmt(evt.end)}`}
            style={{
              position:'absolute',
              left:`calc(${leftPct}% + ${continuesLeft?0:3}px)`,
              width:`calc(${widthPct}% - ${(continuesLeft?0:3)+(continuesRight?0:3)}px)`,
              top:`${36+track*26}px`,
              height:'20px',
              background:evt.color,
              borderRadius:`${continuesLeft?0:5}px ${continuesRight?0:5}px ${continuesRight?0:5}px ${continuesLeft?0:5}px`,
              display:'flex',alignItems:'center',
              paddingLeft:continuesLeft?5:7,
              overflow:'hidden',opacity:0.88,cursor:'pointer',zIndex:2,
              boxShadow:'0 1px 3px rgba(0,0,0,0.15)',
              borderLeft:continuesLeft?`2px dashed rgba(255,255,255,0.6)`:'none',
            }}>
            <span style={{fontSize:'10px',color:'white',fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',lineHeight:1,letterSpacing:'0.01em'}}>
              {continuesLeft&&'↩ '}{evt.projTitle} – {evt.phaseLabel}
            </span>
          </div>
        );
      })}
    </div>
  );
}

// Algoritmo squarified treemap (binary split recursivo)
function squarifyLayout(data, rect) {
  if (!data.length) return [];
  if (data.length === 1) return [{...data[0], ...rect}];
  const total = data.reduce((s,d)=>s+d.value,0);
  let accum=0, splitIdx=1;
  const half = total/2;
  for (let i=0;i<data.length-1;i++) { accum+=data[i].value; if(accum>=half){splitIdx=i+1;break;} }
  const firstHalf=data.slice(0,splitIdx), secondHalf=data.slice(splitIdx);
  const ratio=firstHalf.reduce((s,d)=>s+d.value,0)/total;
  let r1,r2;
  if (rect.w>=rect.h) {
    r1={x:rect.x,y:rect.y,w:rect.w*ratio,h:rect.h};
    r2={x:rect.x+rect.w*ratio,y:rect.y,w:rect.w*(1-ratio),h:rect.h};
  } else {
    r1={x:rect.x,y:rect.y,w:rect.w,h:rect.h*ratio};
    r2={x:rect.x,y:rect.y+rect.h*ratio,w:rect.w,h:rect.h*(1-ratio)};
  }
  return [...squarifyLayout(firstHalf,r1),...squarifyLayout(secondHalf,r2)];
}

function ClientesFrentesView({projects, ciclos}) {
  const [filterCiclos,   setFilterCiclos]  = useState([]); // multi-select
  const [filterFrente,   setFilterFrente]  = useState('');

  const [filterFarol,    setFilterFarol]   = useState('');
  const [filterRespPedra, setFilterRespPedra] = useState('');

  const [filterStatus,   setFilterStatus]  = useState([]);
  const [openDropdown,   setOpenDropdown]  = useState(null); // 'ciclo'|'remove'|'status'|'publico'

  React.useEffect(()=>{
    function handleOutside(e){
      if(dropdownRef.current && !dropdownRef.current.contains(e.target)) setOpenDropdown(null);
    }
    document.addEventListener('mousedown', handleOutside);
    return ()=>document.removeEventListener('mousedown', handleOutside);
  },[]);
  const [topN,           setTopN]          = useState(60);
  const [viewMode,       setViewMode]      = useState('frentes');
  const [selected,       setSelected]      = useState(null);

  const spProjects = useMemo(()=>projects.filter(p=>p.source==='sharepoint'),[projects]);

  // Clientes que têm ao menos um projeto com o farol selecionado
  const clientsWithFarol = useMemo(()=>{
    if (!filterFarol) return null;
    return new Set(spProjects.filter(p=>(p.farol||'')===filterFarol).map(p=>p.client));
  },[spProjects,filterFarol]);

  // Filtros — farol filtra no nível do CLIENTE (todos os projetos do cliente aparecem)
  const filtered = useMemo(()=>spProjects.filter(p=>{
    if (filterCiclos.length>0 && !filterCiclos.includes(p.ciclo)) return false;
    if (filterFrente  && normFrente(p.solucao)!==normFrente(filterFrente)) return false;
    if (filterCliente && p.client!==filterCliente) return false;
    if (removeClientes.length>0 && removeClientes.includes(p.client)) return false;
    if (filterPedra     && (p.pedra||'')!==filterPedra) return false;
    if (filterRespPedra && !(p.respPedra||'').split(',').map(x=>x.trim()).includes(filterRespPedra)) return false;
    if (filterPublico.length>0 && !filterPublico.includes(p.publico||'')) return false;
    if (filterStatus.length>0  && !filterStatus.includes(p.status||''))  return false;
    if (clientsWithFarol && !clientsWithFarol.has(p.client)) return false;
    return true;
  }),[spProjects,filterCiclos,filterFrente,filterCliente,removeClientes,filterPedra,filterRespPedra,filterPublico,filterStatus,clientsWithFarol]);

  // Opções únicas para os filtros
  const frenteOpts   = useMemo(()=>[...new Set(spProjects.map(p=>p.solucao).filter(Boolean))].sort(),[spProjects]);
  const pedraOpts    = useMemo(()=>[...new Set(spProjects.map(p=>p.pedra).filter(Boolean))].sort(),[spProjects]);
  const respPedraOpts= useMemo(()=>[...new Set(spProjects.flatMap(p=>(p.respPedra||'').split(',').map(x=>x.trim())).filter(Boolean))].sort(),[spProjects]);
  const farolOpts    = useMemo(()=>[...new Set(spProjects.map(p=>p.farol).filter(Boolean))].sort(),[spProjects]);
  const clienteOpts  = useMemo(()=>[...new Set(spProjects.map(p=>p.client).filter(Boolean))].sort(),[spProjects]);
  const publicoOpts  = useMemo(()=>[...new Set(spProjects.map(p=>p.publico).filter(Boolean))].sort(),[spProjects]);
  const statusOpts   = useMemo(()=>[...new Set(spProjects.map(p=>p.status).filter(Boolean))].sort(),[spProjects]);

  // Hierarquia de valor da Pedra
  const PEDRA_RANK={'Diamante':4,'Safira':3,'Rubi':2};
  const PEDRA_COLOR={'Diamante':'#1d4ed8','Safira':'#6d28d9','Rubi':'#be185d','':' #cbd5e1'};

  // Stats por cliente — inclui nProdutos
  const clientStats = useMemo(()=>{
    const map={};
    filtered.forEach(p=>{
      const c=p.client||'(sem cliente)';
      if (!map[c]) map[c]={client:c,projects:[],nFrentes:0,nProjetos:0,nProdutos:0,pedra:''};
      map[c].projects.push(p);
    });
    Object.values(map).forEach(s=>{
      s.nProjetos=s.projects.length;
      // Frentes: valores distintos da nova coluna FrenteNegocio
      const frentesSet=new Set(s.projects.map(p=>(p.solucao||'').trim()).filter(Boolean));
      s.nFrentes=frentesSet.size;
      s.frentesLabels=[...frentesSet];
      // Produto: valores distintos de Produto_Principal
      const produtosSet=new Set(s.projects.map(p=>(p.produto||'').trim()).filter(Boolean));
      s.nProdutos=produtosSet.size;
      // Pedra de maior hierarquia do cliente
      const bestPedra=s.projects.reduce((best,p)=>(PEDRA_RANK[p.pedra]||0)>(PEDRA_RANK[best]||0)?p.pedra:best,'');
      s.pedra=bestPedra;
      s.pedraRank=PEDRA_RANK[bestPedra]||0;
    });
    // Ordenação e valor do bloco mudam conforme viewMode
    const sortKey=viewMode==='frentes'?'nFrentes':viewMode==='pedra'?'pedraRank':'nProdutos';
    return Object.values(map)
      .filter(s=>s.nProjetos>0)
      .sort((a,b)=>b[sortKey]-a[sortKey]||b.nProjetos-a.nProjetos)
      .slice(0,topN);
  },[filtered,topN,viewMode]);

  // KPIs
  const totalClients  = clientStats.length;
  const totalProjects = clientStats.reduce((s,c)=>s+c.nProjetos,0);
  const frentesDist   = useMemo(()=>{
    const d={}; FRENTES_CATS.forEach(f=>{d[f.label]=0;});
    filtered.forEach(p=>{const cat=getClientFrente(p.solucao);if(cat)d[cat]=(d[cat]||0)+1;});
    return d;
  },[filtered]);
  const totalVagasTrab    = useMemo(()=>filtered.reduce((s,p)=>s+(p.vagasTrab||0),0),[filtered]);
  const totalVagasFech    = useMemo(()=>filtered.reduce((s,p)=>s+(p.vagasFech||0),0),[filtered]);
  const totalVagasExtra   = useMemo(()=>filtered.reduce((s,p)=>s+(p.vagasExtra||0),0),[filtered]);
  const totalVagasCanc    = useMemo(()=>filtered.reduce((s,p)=>s+(p.vagasCanc||0),0),[filtered]);
  const totalVagasNaoFech = useMemo(()=>filtered.reduce((s,p)=>s+(p.vagasNaoFech||0),0),[filtered]);
  const pctContratados    = totalVagasTrab>0 ? Math.round((totalVagasFech/totalVagasTrab)*100) : 0;
  const pctExtras         = totalVagasFech>0 ? Math.round((totalVagasExtra/totalVagasFech)*100) : 0;
  const pctCanceladas     = totalVagasTrab>0 ? Math.round((totalVagasCanc/totalVagasTrab)*100) : 0;
  const pctNaoFechadas    = totalVagasTrab>0 ? Math.round((totalVagasNaoFech/totalVagasTrab)*100) : 0;

  // Cores e escala por viewMode
  const BLUE_SCALE  =['#e0f2fe','#7dd3fc','#38bdf8','#0ea5e9','#0369a1'];
  const GREEN_SCALE =['#d1fae5','#6ee7b7','#34d399','#10b981','#047857'];
  function getCellColor(stat){
    if (viewMode==='frentes') return BLUE_SCALE[Math.min(stat.nFrentes, BLUE_SCALE.length-1)]||'#cbd5e1';
    if (viewMode==='pedra')   return PEDRA_COLOR[stat.pedra]||'#cbd5e1';
    // produto
    const maxP=Math.max(...clientStats.map(s=>s.nProdutos),1);
    const idx=Math.round((stat.nProdutos/maxP)*(GREEN_SCALE.length-1));
    return GREEN_SCALE[Math.min(idx,GREEN_SCALE.length-1)];
  }
  function getCellTextColor(stat){
    if (viewMode==='frentes') return stat.nFrentes>=3?'#fff':'#0c4a6e';
    if (viewMode==='pedra')   return stat.pedraRank>=2?'#fff':'#1e293b';
    const maxP=Math.max(...clientStats.map(s=>s.nProdutos),1);
    return (stat.nProdutos/maxP)>=0.6?'#fff':'#064e3b';
  }

  // Tamanho do bloco proporcional ao modo selecionado
  function getCellValue(stat){
    if (viewMode==='frentes') return Math.max(stat.nFrentes, 0.5);
    if (viewMode==='pedra')   return Math.max(stat.pedraRank, 0.5);
    return Math.max(stat.nProdutos, 0.5);
  }

  // Número exibido no bloco conforme viewMode
  function getCellLabel(stat){
    if (viewMode==='frentes') return stat.nFrentes;
    if (viewMode==='pedra')   return stat.pedra||'—';
    return stat.nProdutos;
  }
  function getCellSublabel(stat){
    if (viewMode==='frentes') return stat.nFrentes===1?'frente':'frentes';
    if (viewMode==='pedra')   return '';
    return stat.nProdutos===1?'solução':'soluções';
  }

  // Treemap layout
  const tmW=600, tmH=360;
  const tmData=useMemo(()=>clientStats.map(s=>({...s,value:getCellValue(s)})),[clientStats,viewMode]);
  const layout=useMemo(()=>squarifyLayout(tmData,{x:0,y:0,w:tmW,h:tmH}),[tmData]);

  // Tabela: projetos filtrados ou do cliente selecionado
  const tableRows = useMemo(()=>{
    const base = selected ? filtered.filter(p=>p.client===selected) : filtered;
    return base.sort((a,b)=>(a.client||'').localeCompare(b.client||''));
  },[filtered,selected]);

  const hasFilters=filterCiclos.length>0||filterFrente||filterCliente||removeClientes.length>0||filterPedra||filterFarol||filterRespPedra||filterPublico.length>0||filterStatus.length>0;

  return (
    <div className="max-w-screen-xl mx-auto px-4 pb-12 space-y-6 mt-4">

      {/* Filtros */}
      <div ref={dropdownRef} className="bg-white rounded-2xl border border-slate-200 px-5 py-4 flex flex-wrap gap-4 items-end">
        {/* Ciclo — multi-select via checkboxes em dropdown */}
        <div className="relative">
          <label className="text-xs font-semibold text-slate-400 uppercase tracking-wide block mb-1.5">Ciclo</label>
          <div onClick={()=>setOpenDropdown(openDropdown==='ciclo'?null:'ciclo')}
            className="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white min-w-[150px] cursor-pointer select-none focus:ring-2 focus:ring-sky-300 flex items-center justify-between gap-2">
            <span className="truncate">{filterCiclos.length===0?'Todos':`${filterCiclos.length} selecionado(s)`}</span>
            <span className="text-slate-400">▾</span>
          </div>
          {openDropdown==='ciclo'&&(
            <div className="absolute top-full left-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-30 min-w-[160px] py-1">
              {(ciclos||[]).map(c=>(
                <label key={c} className="flex items-center gap-2 px-3 py-1.5 hover:bg-sky-50 cursor-pointer text-sm">
                  <input type="checkbox" checked={filterCiclos.includes(c)}
                    onChange={e=>setFilterCiclos(prev=>e.target.checked?[...prev,c]:prev.filter(x=>x!==c))}/>
                  {c}
                </label>
              ))}
              {filterCiclos.length>0&&<button onClick={()=>setFilterCiclos([])} className="w-full text-xs text-red-400 px-3 py-1 text-left hover:bg-red-50">✕ Limpar</button>}
            </div>
          )}
        </div>
        {/* Frente */}
        <div>
          <label className="text-xs font-semibold text-slate-400 uppercase tracking-wide block mb-1.5">Frente de Negócio</label>
          <select value={filterFrente} onChange={e=>setFilterFrente(e.target.value)}
            className="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white min-w-[170px] focus:ring-2 focus:ring-sky-300">
            <option value="">Todas</option>
            {frenteOpts.map(f=><option key={f} value={f}>{f}</option>)}
          </select>
        </div>
        {/* Cliente */}
        <div>
          <label className="text-xs font-semibold text-slate-400 uppercase tracking-wide block mb-1.5">Mostrar cliente</label>
          <select value={filterCliente} onChange={e=>{setFilterCliente(e.target.value);setSelected(e.target.value||null);}}
            className="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white min-w-[150px] focus:ring-2 focus:ring-sky-300">
            <option value="">Todos</option>
            {clienteOpts.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        {/* Filtro inverso — remover clientes */}
        <div className="relative">
          <label className="text-xs font-semibold text-slate-400 uppercase tracking-wide block mb-1.5">Remover clientes</label>
          <div onClick={()=>setOpenDropdown(openDropdown==='remove'?null:'remove')}
            className="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white min-w-[160px] cursor-pointer select-none flex items-center justify-between gap-2">
            <span className="truncate text-red-500">{removeClientes.length===0?'Nenhum':`${removeClientes.length} removido(s)`}</span>
            <span className="text-slate-400">▾</span>
          </div>
          {openDropdown==='remove'&&(
            <div className="absolute top-full left-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-30 min-w-[180px] py-1 max-h-48 overflow-y-auto">
              {clienteOpts.map(c=>(
                <label key={c} className="flex items-center gap-2 px-3 py-1.5 hover:bg-red-50 cursor-pointer text-sm">
                  <input type="checkbox" checked={removeClientes.includes(c)}
                    onChange={e=>setRemoveClientes(prev=>e.target.checked?[...prev,c]:prev.filter(x=>x!==c))}/>
                  {c}
                </label>
              ))}
              {removeClientes.length>0&&<button onClick={()=>setRemoveClientes([])} className="w-full text-xs text-red-400 px-3 py-1 text-left hover:bg-red-50">✕ Limpar</button>}
            </div>
          )}
        </div>
        {/* Pedra */}
        <div>
          <label className="text-xs font-semibold text-slate-400 uppercase tracking-wide block mb-1.5">Pedra</label>
          <select value={filterPedra} onChange={e=>setFilterPedra(e.target.value)}
            className="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white focus:ring-2 focus:ring-sky-300">
            <option value="">Todas</option>
            {pedraOpts.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
        </div>
        {/* Responsável Pedra */}
        <div>
          <label className="text-xs font-semibold text-slate-400 uppercase tracking-wide block mb-1.5">Resp. Pedra</label>
          <select value={filterRespPedra} onChange={e=>setFilterRespPedra(e.target.value)}
            className="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white focus:ring-2 focus:ring-sky-300">
            <option value="">Todos</option>
            {respPedraOpts.map(r=><option key={r} value={r}>{r}</option>)}
          </select>
        </div>
        {/* Farol */}
        <div>
          <label className="text-xs font-semibold text-slate-400 uppercase tracking-wide block mb-1.5">Farol</label>
          <select value={filterFarol} onChange={e=>setFilterFarol(e.target.value)}
            className="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white focus:ring-2 focus:ring-sky-300">
            <option value="">Todos</option>
            {farolOpts.map(f=><option key={f} value={f}>{f}</option>)}
          </select>
        </div>
        {/* Status — multi-select */}
        <div className="relative">
          <label className="text-xs font-semibold text-slate-400 uppercase tracking-wide block mb-1.5">Status</label>
          <div onClick={()=>setOpenDropdown(openDropdown==='status'?null:'status')}
            className="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white min-w-[160px] cursor-pointer select-none flex items-center justify-between gap-2">
            <span className="truncate">{filterStatus.length===0?'Todos':`${filterStatus.length} selecionado(s)`}</span>
            <span className="text-slate-400">▾</span>
          </div>
          {openDropdown==='status'&&(
            <div className="absolute top-full left-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-30 min-w-[200px] py-1 max-h-48 overflow-y-auto">
              {statusOpts.map(s=>(
                <label key={s} className="flex items-center gap-2 px-3 py-1.5 hover:bg-sky-50 cursor-pointer text-sm">
                  <input type="checkbox" checked={filterStatus.includes(s)}
                    onChange={e=>setFilterStatus(prev=>e.target.checked?[...prev,s]:prev.filter(x=>x!==s))}/>
                  {s}
                </label>
              ))}
              {filterStatus.length>0&&<button onClick={()=>setFilterStatus([])} className="w-full text-xs text-red-400 px-3 py-1 text-left hover:bg-red-50">✕ Limpar</button>}
            </div>
          )}
        </div>
        {/* Público — multi-select */}
        <div className="relative">
          <label className="text-xs font-semibold text-slate-400 uppercase tracking-wide block mb-1.5">Público</label>
          <div onClick={()=>setOpenDropdown(openDropdown==='publico'?null:'publico')}
            className="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white min-w-[180px] cursor-pointer select-none focus:ring-2 focus:ring-sky-300 flex items-center justify-between gap-2">
            <span className="truncate">{filterPublico.length===0?'Todos':`${filterPublico.length} selecionado(s)`}</span>
            <span className="text-slate-400">▾</span>
          </div>
          {openDropdown==='publico'&&(
            <div className="absolute top-full left-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-30 min-w-[220px] py-1 max-h-48 overflow-y-auto">
              {publicoOpts.map(p=>(
                <label key={p} className="flex items-center gap-2 px-3 py-1.5 hover:bg-sky-50 cursor-pointer text-sm">
                  <input type="checkbox" checked={filterPublico.includes(p)}
                    onChange={e=>setFilterPublico(prev=>e.target.checked?[...prev,p]:prev.filter(x=>x!==p))}/>
                  {p}
                </label>
              ))}
              {filterPublico.length>0&&<button onClick={()=>setFilterPublico([])} className="w-full text-xs text-red-400 px-3 py-1 text-left hover:bg-red-50">✕ Limpar</button>}
            </div>
          )}
        </div>
        {/* Top N */}
        <div>
          <label className="text-xs font-semibold text-slate-400 uppercase tracking-wide block mb-1.5">Top N</label>
          <input type="number" min="5" max="200" value={topN} onChange={e=>setTopN(Number(e.target.value)||60)}
            className="text-sm border border-slate-200 rounded-xl px-3 py-2 w-20 focus:ring-2 focus:ring-sky-300"/>
        </div>
        {(hasFilters||selected)&&(
          <button onClick={()=>{setFilterCiclos([]);setFilterFrente('');setFilterCliente('');setRemoveClientes([]);setFilterPedra('');setFilterRespPedra('');setFilterFarol('');setFilterPublico([]);setFilterStatus([]);setSelected(null);}}
            className="text-xs text-slate-400 hover:text-red-500 border border-slate-200 px-3 py-2 rounded-xl self-end transition">
            ✕ Limpar tudo
          </button>
        )}
        <div className="ml-auto self-end flex items-center gap-3">
          <div className="flex bg-slate-100 rounded-xl p-1 gap-0.5">
            {[
              {k:'frentes', l:'Frentes', title:'Organiza por maior nº de frentes envolvidas'},
              {k:'pedra',   l:'Pedra',   title:'Organiza pelo valor da Pedra (Diamante > Safira > Rubi)'},
              {k:'produto', l:'Produto', title:'Organiza por maior nº de produtos distintos por cliente'},
            ].map(v=>(
              <button key={v.k} onClick={()=>setViewMode(v.k)} title={v.title}
                className={`px-3 py-1 rounded-lg text-xs font-semibold transition ${viewMode===v.k?'bg-white shadow text-sky-600':'text-slate-500 hover:text-slate-700'}`}>
                {v.l}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* KPIs — linha principal */}
      <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 divide-x divide-slate-100">
          {/* Clientes atendidos */}
          <div className="p-4 text-center">
            <p className="text-3xl font-bold text-slate-900">{totalClients}</p>
            <p className="text-xs text-slate-500 mt-1">Clientes atendidos</p>
          </div>
          {/* Programas */}
          <div className="p-4 text-center">
            <p className="text-3xl font-bold text-slate-900">{totalProjects}</p>
            <p className="text-xs text-slate-500 mt-1">Programas</p>
          </div>
          {/* Vagas Trabalhadas */}
          <div className="p-4 text-center">
            <p className="text-3xl font-bold text-slate-900">{totalVagasTrab.toLocaleString('pt-BR')}</p>
            <p className="text-xs text-slate-500 mt-1">Vagas Trabalhadas</p>
            {totalVagasTrab>0&&<p className="text-sm font-semibold text-indigo-600 mt-2">{pctContratados}%</p>}
            {totalVagasTrab>0&&<p className="text-[10px] text-slate-400">Contratados x vagas trabalhadas</p>}
          </div>
          {/* Vagas Fechadas */}
          <div className="p-4 text-center">
            <p className="text-3xl font-bold text-slate-900">{totalVagasFech.toLocaleString('pt-BR')}</p>
            <p className="text-xs text-slate-500 mt-1">Vagas Fechadas</p>
          </div>
          {/* Vagas Extras */}
          <div className="p-4 text-center">
            <p className="text-3xl font-bold text-slate-900">{totalVagasExtra.toLocaleString('pt-BR')}</p>
            <p className="text-xs text-slate-500 mt-1">Vagas Extras</p>
            {totalVagasFech>0&&<p className="text-sm font-semibold text-emerald-600 mt-2">{pctExtras}%</p>}
            {totalVagasFech>0&&<p className="text-[10px] text-slate-400">Extras x contratados</p>}
          </div>
          {/* Vagas Canceladas */}
          <div className="p-4 text-center">
            <p className="text-3xl font-bold text-slate-900">{totalVagasCanc.toLocaleString('pt-BR')}</p>
            <p className="text-xs text-slate-500 mt-1">Vagas Canceladas</p>
            {totalVagasTrab>0&&<p className="text-sm font-semibold text-orange-600 mt-2">{pctCanceladas}%</p>}
            {totalVagasTrab>0&&<p className="text-[10px] text-slate-400">Canceladas x trabalhadas</p>}
          </div>
          {/* Vagas Não Fechadas */}
          <div className="p-4 text-center">
            <p className="text-3xl font-bold text-slate-900">{totalVagasNaoFech.toLocaleString('pt-BR')}</p>
            <p className="text-xs text-slate-500 mt-1">Vagas Não Fechadas</p>
            {totalVagasTrab>0&&<p className="text-sm font-semibold text-red-500 mt-2">{pctNaoFechadas}%</p>}
            {totalVagasTrab>0&&<p className="text-[10px] text-slate-400">Não fechadas x trabalhadas</p>}
          </div>
        </div>
      </div>

      {/* KPIs — projetos por frente */}
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
        {FRENTES_CATS.map(f=>(
          <div key={f.label} className="bg-white rounded-2xl border border-slate-200 p-4">
            <p className="text-2xl font-bold text-slate-900">{frentesDist[f.label]||0}</p>
            <p className="text-xs font-semibold text-slate-700 mt-0.5 truncate" title={f.label}>{f.label}</p>
            <p className="text-xs text-slate-400">projetos</p>
          </div>
        ))}
      </div>

      {/* Treemap */}
      <div className="bg-white rounded-2xl border border-slate-200 p-5">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-sm font-bold text-slate-700">Visual principal</h3>
          <div className="flex items-center gap-3 text-xs text-slate-400 flex-wrap">
            {viewMode==='frentes'&&<><span className="font-medium">N_frentes:</span>{BLUE_SCALE.map((c,i)=><span key={i} className="flex items-center gap-0.5"><span style={{background:c,width:12,height:12,display:'inline-block',borderRadius:2,border:'1px solid #e2e8f0'}}/><span>{i+1}</span></span>)}</>}
            {viewMode==='pedra'&&Object.entries(PEDRA_COLOR).filter(([k])=>k).map(([k,c])=><span key={k} className="flex items-center gap-1"><span style={{background:c,width:12,height:12,display:'inline-block',borderRadius:2}}/><span>{k}</span></span>)}
            {viewMode==='produto'&&<><span className="font-medium">N_produtos:</span>{GREEN_SCALE.map((c,i)=><span key={i} className="flex items-center gap-0.5"><span style={{background:c,width:12,height:12,display:'inline-block',borderRadius:2,border:'1px solid #e2e8f0'}}/><span>{i+1}+</span></span>)}</>}
          </div>
        </div>
        {clientStats.length===0?(
          <div className="text-center text-slate-400 py-12">Nenhum projeto encontrado com os filtros selecionados.</div>
        ):(
          <div style={{position:'relative',width:'100%',paddingBottom:`${(tmH/tmW)*100}%`}}>
            <div style={{position:'absolute',inset:0}}>
              {layout.map(cell=>{
                const stat=cell;
                const isSelected=selected===stat.client;
                const color=getCellColor(stat);
                const textColor=getCellTextColor(stat);
                return (
                  <div key={stat.client}
                    onClick={()=>setSelected(isSelected?null:stat.client)}
                    title={`${stat.client}\n${stat.nProjetos} projeto(s)\n${viewMode==='frentes'?`${stat.nFrentes} frente(s): ${stat.frentesLabels.join(', ')}`:viewMode==='pedra'?`Pedra: ${stat.pedra||'—'}`:`${stat.nProdutos} solução(ões) distinta(s)`}`}
                    style={{
                      position:'absolute',
                      left:`${(cell.x/tmW)*100}%`,
                      top:`${(cell.y/tmH)*100}%`,
                      width:`${(cell.w/tmW)*100}%`,
                      height:`${(cell.h/tmH)*100}%`,
                      background:color,
                      border:isSelected?'2px solid #0c4a6e':'1px solid rgba(255,255,255,0.5)',
                      boxSizing:'border-box',
                      cursor:'pointer',
                      overflow:'hidden',
                      display:'flex',
                      flexDirection:'column',
                      justifyContent:'center',
                      alignItems:'center',
                      padding:'2px',
                    }}>
                    {cell.w>40&&cell.h>20&&(
                      <>
                        <div style={{fontSize:Math.min(Math.max(cell.w/8,8),13),fontWeight:700,color:textColor,textAlign:'center',lineHeight:1.1,wordBreak:'break-word',maxWidth:'100%',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:cell.w>80?'nowrap':'normal'}}>
                          {stat.client}
                        </div>

// ─── Module Projects View (C&D, EB, Frentes Internacionais) ──────────────────
function ModuleProjectsView({projects, moduleConfig, allAnalysts, allHeads, allKAs, spChoices, onSave, saving, isSpConnected, clientId, tenantId}) {
  const [showEdit, setShowEdit] = useState(null);
  const [search,   setSearch]   = useState('');

  // Filtra somente os projetos das frentes deste módulo
  const frenteSet = new Set((moduleConfig.frentes||[]).map(f=>f.toLowerCase()));
  const moduleProjects = projects.filter(p=>
    !frenteSet.size || frenteSet.has((p.solucao||'').toLowerCase())
  );
  const filtered = moduleProjects.filter(p=>
    !search ||
    p.title.toLowerCase().includes(search.toLowerCase()) ||
    (p.client||'').toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div className="fade-in max-w-screen-xl mx-auto px-4 pb-10 mt-4 space-y-4">
      <div className="flex items-center gap-3 flex-wrap">
        <h2 className="text-lg font-bold text-slate-800">Projetos — {moduleConfig.label}</h2>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar..."
          className="border border-slate-200 rounded-lg px-3 py-1.5 text-sm flex-1 min-w-48 focus:ring-2 focus:ring-indigo-200"/>
        <button onClick={()=>setShowEdit('new')}
          className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-2 rounded-lg font-medium">
          + Novo Projeto
        </button>
      </div>

      {filtered.length===0&&(
        <div className="text-center text-slate-400 py-12">
          <p className="text-3xl mb-2">📁</p>
          <p>{moduleProjects.length===0?'Nenhum projeto cadastrado nesta frente.':'Nenhum resultado.'}</p>
        </div>
      )}

      <div className="space-y-2">
        {filtered.map(proj=>(
          <div key={proj.id} className="bg-white rounded-xl border border-slate-200 px-4 py-3 flex items-center gap-3 hover:border-indigo-200 transition">
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="font-semibold text-slate-800 truncate">{proj.title}</span>
                {proj.client&&<span className="text-xs text-slate-500">{proj.client}</span>}
                <StatusBadge status={proj.status}/>
              </div>
              <div className="text-xs text-slate-400 mt-0.5">
                {[proj.ciclo, proj.trimestre, proj.semestre, proj.pedra, proj.ka&&`GSC: ${proj.ka}`].filter(Boolean).join(' · ')}
              </div>
            </div>
            <button onClick={()=>setShowEdit(proj)}
              className="text-xs text-slate-600 border border-slate-200 px-3 py-1 rounded-lg hover:bg-slate-50 shrink-0">
              Editar
            </button>
          </div>
        ))}
      </div>

      {showEdit&&(
        <ModuleProjectModal
          project={showEdit==='new'?null:showEdit}
          moduleConfig={moduleConfig}
          allKAs={allKAs}
          spChoices={spChoices}
          onSave={p=>{ onSave(p); setShowEdit(null); }}
          onClose={()=>setShowEdit(null)}
          saving={saving}
          isSpConnected={isSpConnected}
          clientId={clientId}
          tenantId={tenantId}/>
      )}
    </div>
  );
}

function ModuleProjectModal({project, moduleConfig, allKAs, spChoices, onSave, onClose, saving, isSpConnected, clientId, tenantId}) {
  const isNew = !project?.spId;
  const [showMoskit, setShowMoskit] = useState(false);
  const [title,    setTitle]    = useState(project?.title||'');
  const [client,   setClient]   = useState(project?.client||'');
  const [solucao,  setSolucao]  = useState(project?.solucao||moduleConfig?.defaultFrente||'');
  const [produto,  setProduto]  = useState(project?.produto||'');
  const [status,   setStatus]   = useState(project?.status||'');
  const [ciclo,    setCiclo]    = useState(project?.ciclo||'');
  const [trimestre,setTrimestre]= useState(project?.trimestre||'');
  const [semestre, setSemestre] = useState(project?.semestre||'');
  const [codigoProposta,setCodigoProposta]= useState(project?.codigoProposta||'');
  const [pedra,    setPedra]    = useState(project?.pedra||'');
  const [respPedra,setRespPedra]= useState(project?.respPedra||'');
  // FI extras
  const [qtdVagas, setQtdVagas] = useState(project?.qtdVagas||'');
  const [ka,       setKa]       = useState(project?.ka||'');
  const [phases,   setPhases]   = useState(()=>{
    const p={}; PHASES.forEach(ph=>{
      const ex=project?.phases?.[ph.key];
      p[ph.key]={start:fmtDateForInput(ex?.start)||'',end:fmtDateForInput(ex?.end)||''};
    }); return p;
  });
  // Moskit clients (lazy)
  const [moskitClients, setMoskitClients] = useState([]);
  useEffect(()=>{
    if (!clientId||!tenantId) return;
    fetchMoskitCSV(clientId, tenantId).then(text=>{
      const parsed=window.Papa?.parse(text,{header:true,skipEmptyLines:true});
      if (!parsed?.data?.length) return;
      const keys=Object.keys(parsed.data[0]);
      const empCol=keys.find(k=>k.toLowerCase().includes('empresa'));
      if (empCol) setMoskitClients([...new Set(parsed.data.map(r=>(r[empCol]||'').trim()).filter(Boolean))].sort());
    }).catch(()=>{});
  },[clientId,tenantId]);

  const [syncToSP, setSyncToSP] = useState(!project||!!project?.spId||(isSpConnected&&!project?.id));

  function handleSave() {
    if (!title.trim()) return;
    const filteredPhases={};
    PHASES.forEach(ph=>{
      filteredPhases[ph.key]={...project?.phases?.[ph.key]||{},start:phases[ph.key].start,end:phases[ph.key].end,pcts:[]};
    });
    const source = project?.spId?'sharepoint':(syncToSP&&isSpConnected?'sharepoint':'local');
    onSave({
      id: project?.id||'proj_'+Date.now(),
      spId: project?.spId||null,
      title:title.trim(), client:client.trim(), solucao:normFrente(solucao), produto,
      status, ciclo, trimestre, semestre, codigoProposta:codigoProposta.trim(),
      pedra, respPedra, qtdVagas:Number(qtdVagas)||0, ka:ka.trim(),
      source, analysts:project?.analysts||[], phases:filteredPhases,
      head1:project?.head1||null, head2:project?.head2||null, head3:project?.head3||null,
      headPhases:project?.headPhases||{},
    });
  }

  const cls='w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-200';
  const isFI = moduleConfig?.key==='fi';

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col mx-4" onClick={e=>e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <div>
            <h2 className="text-lg font-bold text-slate-800">{isNew?'Novo Projeto':'Editar Projeto'} — {moduleConfig?.label}</h2>
          </div>
          <div className="flex items-center gap-2">
            {isNew&&<button type="button" onClick={()=>setShowMoskit(true)}
              className="text-xs text-indigo-600 hover:text-indigo-800 font-semibold border border-indigo-200 px-2.5 py-1 rounded-lg hover:bg-indigo-50 transition flex items-center gap-1">
              🔍 Buscar no Moskit
            </button>}
            <button onClick={onClose} className="text-slate-400 hover:text-red-500 text-xl w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100">✕</button>
          </div>
        </div>
        {showMoskit&&(
          <MoskitPickerModal clientId={clientId} tenantId={tenantId}
            onClose={()=>setShowMoskit(false)}
            onSelect={row=>{
              setTitle(row['Nome']||'');
              setCiclo(row['Ciclo Orçamentário']||'');
              if (row['Frente de Negócio']) setSolucao(row['Frente de Negócio']);
              if (row['Produto Principal'])    setProduto(row['Produto Principal']);
              setShowMoskit(false);
            }}/>
        )}
        <div className="flex-1 overflow-y-auto px-6 py-5">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div className="sm:col-span-2">
              <label className="block text-xs font-medium text-slate-600 mb-1">Nome do Projeto *</label>
              <input value={title} onChange={e=>setTitle(e.target.value)} className={cls} placeholder="Nome do programa/projeto"/>
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-600 mb-1">Cliente</label>
              <input value={client} onChange={e=>setClient(e.target.value)} list="modClientDL" className={cls}/>
              <datalist id="modClientDL">{moskitClients.map(c=><option key={c} value={c}/>)}</datalist>
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-600 mb-1">Frente de Negócio</label>
              {(moduleConfig?.frentes||[]).length>1
                ? <select value={solucao} onChange={e=>setSolucao(e.target.value)} className={cls}>
                    <option value="">—</option>
                    {moduleConfig.frentes.map(f=><option key={f} value={f}>{f}</option>)}
                  </select>
                : <input value={solucao} onChange={e=>setSolucao(e.target.value)} className={cls} readOnly={!!(moduleConfig?.frentes?.length===1)}/>
              }
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-600 mb-1">Produto Principal</label>
              <input value={produto} onChange={e=>setProduto(e.target.value)} className={cls}/>
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-600 mb-1">Status</label>
              <select value={status} onChange={e=>setStatus(e.target.value)} className={cls}>
                <option value="">—</option>
                {(spChoices?.Status_Programa||['Em andamento','Concluído','Cancelado','Planejamento']).map(o=><option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-600 mb-1">Ciclo Orçamentário</label>
              <select value={ciclo} onChange={e=>setCiclo(e.target.value)} className={cls}>
                <option value="">—</option>
                {(spChoices?.Ciclo_Orcamentario||[]).map(o=><option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-600 mb-1">Trimestre Orç.</label>
              <select value={trimestre} onChange={e=>setTrimestre(e.target.value)} className={cls}>
                <option value="">—</option>
                {(spChoices?.Trimestre_Orcamentario||['Q1','Q2','Q3','Q4']).map(o=><option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-600 mb-1">Semestre Orç.</label>
              <select value={semestre} onChange={e=>setSemestre(e.target.value)} className={cls}>
                <option value="">—</option>
                {(spChoices?.Periodo||['1S','2S']).map(o=><option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-600 mb-1">Código Proposta</label>
              <input value={codigoProposta} onChange={e=>setCodigoProposta(e.target.value)} className={cls}/>
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-600 mb-1">Pedra</label>
              <select value={pedra} onChange={e=>setPedra(e.target.value)} className={cls}>
                <option value="">—</option>
                {(spChoices?.Pedra||_pedra).map(o=><option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div className="sm:col-span-2">
              <label className="block text-xs font-medium text-slate-600 mb-1">Responsável Pedra</label>
              <div className="flex flex-wrap gap-2 pt-1">
                {_respPedra.map(opt=>{
                  const sel=(respPedra||'').split(',').map(x=>x.trim()).filter(Boolean);
                  const checked=sel.includes(opt);
                  return (
                    <label key={opt} className={`flex items-center gap-1.5 cursor-pointer px-2.5 py-1 rounded-lg border text-xs transition ${checked?'bg-indigo-50 border-indigo-300 text-indigo-700':'border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
                      <input type="checkbox" checked={checked} onChange={e=>{
                        const next=e.target.checked?[...sel,opt]:sel.filter(s=>s!==opt);
                        setRespPedra(next.join(','));
                      }} className="accent-indigo-600"/>
                      {opt}
                    </label>
                  );
                })}
              </div>
            </div>
            {/* Extras exclusivos de Frentes Internacionais */}
            {isFI&&(<>
              <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">Qtd. Vagas Previstas</label>
                <input type="number" min="0" value={qtdVagas} onChange={e=>setQtdVagas(e.target.value)} className={cls}/>
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">GSC</label>
                <input value={ka} onChange={e=>setKa(e.target.value)} list="modKADL" className={cls}/>
                <datalist id="modKADL">{(allKAs||[]).map(k=><option key={k} value={k}/>)}</datalist>
              </div>
              {/* Datas das fases (sem alocação) */}
              <div className="sm:col-span-2 border-t border-slate-100 pt-4">
                <p className="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">Datas das Fases</p>
                <div className="space-y-2">
                  {PHASES.map(ph=>(
                    <div key={ph.key} className="flex items-center gap-3">
                      <span className="text-sm text-slate-600 w-36 shrink-0">{ph.label}</span>
                      <input type="date" value={phases[ph.key]?.start||''} onChange={e=>setPhases(p=>({...p,[ph.key]:{...p[ph.key],start:e.target.value}}))}
                        className="border border-slate-200 rounded-lg px-2 py-1 text-xs focus:ring-1 focus:ring-indigo-300"/>
                      <span className="text-slate-300 text-xs">→</span>
                      <input type="date" value={phases[ph.key]?.end||''} onChange={e=>setPhases(p=>({...p,[ph.key]:{...p[ph.key],end:e.target.value}}))}
                        className="border border-slate-200 rounded-lg px-2 py-1 text-xs focus:ring-1 focus:ring-indigo-300"/>
                    </div>
                  ))}
                </div>
              </div>
            </>)}
          </div>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex items-center justify-between gap-3 shrink-0 bg-white rounded-b-2xl">
          {!project?.spId&&isSpConnected&&(
            <label className="flex items-center gap-2 cursor-pointer text-xs text-slate-600">
              <div onClick={()=>setSyncToSP(v=>!v)} className={`relative w-9 h-5 rounded-full transition ${syncToSP?'bg-indigo-600':'bg-slate-300'}`}>
                <div className={`absolute top-0.5 w-4 h-4 rounded-full bg-white shadow transition-transform ${syncToSP?'translate-x-4':'translate-x-0.5'}`}/>
              </div>
              {syncToSP?'📋 Salvar no SharePoint':'🗂️ Somente na ferramenta'}
            </label>
          )}
          <div className="flex gap-2 ml-auto">
            <button onClick={onClose} className="border border-slate-300 text-slate-600 px-4 py-2 rounded-lg text-sm hover:bg-slate-50">Cancelar</button>
            <button onClick={handleSave} disabled={!title.trim()||saving}
              className="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white px-5 py-2 rounded-lg text-sm font-semibold">
              {saving?'⏳ Salvando...':(isNew?'➕ Criar':'💾 Salvar')}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Analytics View ───────────────────────────────────────────────────────────
function AnalyticsView({logs}) {
  const [period, setPeriod] = useState(30); // dias

  const cutoff = useMemo(()=>{
    const d=new Date(); d.setDate(d.getDate()-period); return d.toISOString();
  },[period]);

  const filtered = useMemo(()=>logs.filter(e=>e.ts>=cutoff),[logs,cutoff]);

  // Usuários únicos
  const byUser = useMemo(()=>{
    const map={};
    filtered.forEach(e=>{
      if (!e.email) return;
      if (!map[e.email]) map[e.email]={email:e.email,name:e.name,count:0,modules:new Set(),saved:false,last:''};
      map[e.email].count++;
      if (e.detail&&e.action==='module_view') map[e.email].modules.add(e.detail);
      if (e.action==='save') map[e.email].saved=true;

// Auto-detecta a coluna de score NPS (valores inteiros 0-10)
function detectScoreCol(rows) {
  if (!rows || !rows.length) return null;
  const headers = Object.keys(rows[0]);
  let best = {col: null, ratio: 0};
  for (const h of headers) {
    const vals = rows.map(r => r[h]).filter(v => v!=='' && v!==null && v!==undefined);
    if (vals.length < 5) continue;
    const nums = vals.map(Number).filter(n => !isNaN(n));
    const in0to10 = nums.filter(n => Number.isInteger(n) && n>=0 && n<=10);
    const ratio = in0to10.length / vals.length;
    if (ratio > 0.65 && ratio > best.ratio) best = {col:h, ratio};
  }
  return best.col;
}
// Auto-detecta coluna de texto por palavras-chave no nome da coluna
function detectTextCol(rows, keywords) {
  if (!rows || !rows.length) return null;
  const headers = Object.keys(rows[0]);
  const lower = headers.map(h => h.toLowerCase().replace(/[^a-záéíóúãõâêôç_]/gi,''));
  for (const kw of keywords) {
    const idx = lower.findIndex(h => h.includes(kw.toLowerCase()));
    if (idx >= 0) return headers[idx];
  }
  return null;
}
// Retorna amostras únicas de valores de uma coluna
function colSamples(rows, col, n=4) {
  const seen = new Set();
  const out = [];
  for (const r of rows) {
    const v = String(r[col]??'').trim();
    if (v && !seen.has(v)) { seen.add(v); out.push(v); }
    if (out.length >= n) break;
  }
  return out;
}

function NpsDonut({pctProm, pctNeu, pctDet, nps, size=120}) {
  const r = 40, cx = 60, cy = 60;
  const C = 2 * Math.PI * r;
  const segs = [
    {pct:pctProm, color:'#16a34a'},
    {pct:pctNeu,  color:'#d97706'},
    {pct:pctDet,  color:'#dc2626'},
  ];
  let accumulated = 0;
  const paths = segs.map((s, i) => {
    if (!s.pct) { accumulated += s.pct; return null; }
    const dashLen = (s.pct / 100) * C;
    const rotateDeg = accumulated * 3.6 - 90;
    const el = (
      <circle key={i} cx={cx} cy={cy} r={r}
        fill="none" stroke={s.color} strokeWidth="16"
        strokeDasharray={`${dashLen} ${C - dashLen}`}
        transform={`rotate(${rotateDeg}, ${cx}, ${cy})`}/>
    );
    accumulated += s.pct;
    return el;
  });
  const zona = npsZona(nps);
  return (
    <svg width={size} height={size} viewBox="0 0 120 120">
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#e2e8f0" strokeWidth="16"/>
      {paths}
      <text x={cx} y={cy-4} textAnchor="middle" fontSize="18" fontWeight="bold" fill={zona.color}>
        {nps!==null ? nps : '—'}
      </text>
      <text x={cx} y={cy+12} textAnchor="middle" fontSize="9" fill="#64748b">NPS</text>
    </svg>
  );
}

function NpsView({projects, ciclos, clientId, tenantId}) {
  const [tab,           setTab]           = useState('cli');
  const [npsData,       setNpsData]       = useState({cli:null, cdd:null});
  const [detected,      setDetected]      = useState(null);
  const [loadingNps,    setLoadingNps]    = useState(true);
  const [npsError,      setNpsError]      = useState(null);
  const [showInspector, setShowInspector] = useState(false);

  // Filtros SP — aba CLI
  const [cliCiclo,   setCliCiclo]   = useState('');
  const [cliPublico, setCliPublico] = useState('');
  const [cliTipo,    setCliTipo]    = useState('');
  const [cliSolucao, setCliSolucao] = useState('');

  // Filtros Excel — aba CDD
  const [cddTipoPesq, setCddTipoPesq] = useState('');
  const [cddProcesso, setCddProcesso] = useState('');

  useEffect(()=>{ loadNpsData(); }, []);

  async function loadNpsData() {
    setLoadingNps(true);
    setNpsError(null);
    setDetected(null);
    try {
      const [cli, cdd] = await Promise.all([
        fetchExcelSheet(clientId, tenantId, NPS_CLI_REL, NPS_CLI_SHEET),
        fetchExcelSheet(clientId, tenantId, NPS_CDD_REL, NPS_CDD_SHEET),
      ]);
      setNpsData({cli, cdd});
      // ── Auto-detecção de colunas ──
      const cliScore = detectScoreCol(cli);
      const cliProg  = detectTextCol(cli, ['nome_programa','programa','processo','nome']);
      const cddScore = detectScoreCol(cdd);
      const cddProc  = detectTextCol(cdd, ['processo_seletivo','processo_sel','processo','programa','nome']);
      const cddTipo  = detectTextCol(cdd, ['tipo_pesquisa','tipo_pesq','tipopesquisa','tipo','pesquisa']);
      setDetected({
        cliScore, cliProg,
        cddScore, cddProc, cddTipo,
        cliCols: Object.keys(cli[0]||{}),
        cddCols: Object.keys(cdd[0]||{}),
        cliRows: cli.length,
        cddRows: cdd.length,
      });
    } catch(e) {
      setNpsError(e.message);
    }
    setLoadingNps(false);
  }

  // ── CLI metrics — NPS vem DIRETAMENTE do Excel; SP só para contagem de elegíveis ──
  const cliMetrics = useMemo(()=>{
    if (!npsData.cli || !detected) return null;
    const scoreCol = detected.cliScore;

    // Contagem de elegíveis no SP (com filtros)
    let spProjs = projects;
    if (cliCiclo)   spProjs = spProjs.filter(p=>p.semestre===cliCiclo);
    if (cliPublico) spProjs = spProjs.filter(p=>p.publico===cliPublico);
    if (cliTipo)    spProjs = spProjs.filter(p=>p.tipoProg===cliTipo);
    if (cliSolucao) spProjs = spProjs.filter(p=>normFrente(p.solucao)===normFrente(cliSolucao));
    const elegiveis = spProjs.filter(p=>NPS_ETAPAS_ELEG.has(p.etapa));

    // NPS: TODOS os registros do Excel (sem join restritivo)
    const rows = npsData.cli;
    const metrics = scoreCol
      ? calcNpsMetrics(rows, scoreCol)
      : {total:0, respondentes:rows.length, promotores:0, neutros:0, detratores:0, nps:null, pctProm:0, pctNeu:0, pctDet:0};

    // Join best-effort para "elegíveis sem pesquisa"
    let semPesquisa = [];
    if (detected.cliProg && elegiveis.length > 0) {
      const excelProgs = new Set(rows.map(r=>String(r[detected.cliProg]||'').toLowerCase().trim()).filter(Boolean));
      semPesquisa = elegiveis.filter(p=>!excelProgs.has(String(p.nome||'').toLowerCase().trim()));
    }

    return {
      elegiveis: elegiveis.length,
      comPesquisa: elegiveis.length - semPesquisa.length,
      semPesquisa, rows, scoreCol,
      ...metrics,
    };
  }, [npsData.cli, detected, projects, cliCiclo, cliPublico, cliTipo, cliSolucao]);

  // ── CDD metrics ──
  const cddMetrics = useMemo(()=>{
    if (!npsData.cdd || !detected) return null;
    const {cddScore:scoreCol, cddProc:procCol, cddTipo:tipoCol} = detected;

    let rows = npsData.cdd;
    if (cddTipoPesq && tipoCol) rows = rows.filter(r=>r[tipoCol]===cddTipoPesq);
    if (cddProcesso && procCol) rows = rows.filter(r=>String(r[procCol]||'').toLowerCase().includes(cddProcesso.toLowerCase()));

    const tiposPesq = tipoCol ? [...new Set(npsData.cdd.map(r=>r[tipoCol]).filter(Boolean))].sort() : [];
    const metrics = scoreCol
      ? calcNpsMetrics(rows, scoreCol)
      : {total:0, respondentes:rows.length, promotores:0, neutros:0, detratores:0, nps:null, pctProm:0, pctNeu:0, pctDet:0};

    return {...metrics, rows, scoreCol, tipoCol, procCol, tiposPesq};
  }, [npsData.cdd, detected, cddTipoPesq, cddProcesso]);

  // ── Listas de filtros SP ──
  const eligProjects = projects.filter(p=>NPS_ETAPAS_ELEG.has(p.etapa));
  const cliPublicos  = [...new Set(eligProjects.map(p=>p.publico).filter(Boolean))].sort();
  const cliTipos     = [...new Set(eligProjects.map(p=>p.tipoProg).filter(Boolean))].sort();
  const cliSolucoes  = [...new Set(eligProjects.map(p=>normFrente(p.solucao)).filter(Boolean))].sort();

  // ── Helpers de UI ──
  const fsEl = (label, value, setter, opts) => (
    <div className="flex flex-col gap-1" key={label}>
      <label className="text-xs font-medium text-slate-500">{label}</label>
      <select value={value} onChange={e=>setter(e.target.value)}
        className="text-sm border border-slate-200 rounded-lg px-3 py-1.5 bg-white min-w-[130px]">
        <option value="">Todos</option>
        {opts.map(o=><option key={o} value={o}>{o}</option>)}
      </select>
    </div>
  );

  const npsClass = (score) => {
    const n = Number(score);
    if (isNaN(n) || score==='' || score===null) return {cls:'—', cc:'text-slate-400'};
    if (n>=9) return {cls:'Promotor',  cc:'text-green-700 bg-green-50'};
    if (n>=7) return {cls:'Neutro',    cc:'text-amber-700 bg-amber-50'};
    return       {cls:'Detrator',  cc:'text-red-700 bg-red-50'};
  };

  return (
    <div className="max-w-screen-xl mx-auto px-4 pb-10">

      {/* ── Cabeçalho: tabs + refresh ── */}
      <div className="flex items-center justify-between mt-4 mb-4 flex-wrap gap-3">
        <div className="flex bg-slate-100 rounded-xl p-1 gap-1">
          {[{k:'cli',label:'Clientes'},{k:'cdd',label:'Candidatos'}].map(t=>(
            <button key={t.k} onClick={()=>setTab(t.k)}
              className={`px-5 py-2 rounded-lg text-sm font-semibold transition ${tab===t.k?'bg-white shadow text-amber-600':'text-slate-500 hover:text-slate-700'}`}>
              {t.label}
            </button>
          ))}
        </div>
        <div className="flex items-center gap-2">
          {detected&&(
            <button onClick={()=>setShowInspector(v=>!v)}
              className={`text-xs border px-3 py-1.5 rounded-lg transition ${showInspector?'border-indigo-300 text-indigo-600 bg-indigo-50':'border-slate-200 text-slate-400 hover:text-indigo-600'}`}>
              🔍 Inspetor de dados
            </button>
          )}
          <button onClick={loadNpsData} disabled={loadingNps}
            className="flex items-center gap-1.5 text-xs border border-slate-200 hover:border-amber-300 text-slate-500 hover:text-amber-600 px-3 py-1.5 rounded-lg transition disabled:opacity-40">
            {loadingNps
              ? <><span className="animate-spin inline-block w-3 h-3 border-2 border-amber-400 border-t-transparent rounded-full mr-1"/>Carregando…</>
              : '🔄 Atualizar Excel'}
          </button>
        </div>
      </div>

      {/* ── Inspetor de dados ── */}
      {showInspector && detected && (
        <div className="mb-4 bg-indigo-50 border border-indigo-200 rounded-xl p-4 fade-in text-xs">
          <p className="font-bold text-indigo-700 mb-3">Estrutura detectada nos arquivos Excel</p>
          {[
            {label:'CLI (Clientes)', cols:detected.cliCols, rows:detected.cliRows, scoreCol:detected.cliScore, progCol:detected.cliProg, data:npsData.cli},
            {label:'CDD (Candidatos)', cols:detected.cddCols, rows:detected.cddRows, scoreCol:detected.cddScore, progCol:detected.cddProc, tipoCol:detected.cddTipo, data:npsData.cdd},
          ].map(({label,cols,rows,scoreCol,progCol,tipoCol,data})=>(
            <div key={label} className="mb-3">
              <p className="font-semibold text-slate-700 mb-1">{label} — {rows} linhas, {cols.length} colunas</p>
              <div className="flex flex-wrap gap-1.5">
                {cols.map(c=>{
                  const isScore = c===scoreCol;
                  const isProg  = c===progCol;
                  const isTipo  = c===tipoCol;
                  const tag = isScore?'NPS score':isProg?'prog/join':isTipo?'tipo pesq.':null;
                  const samples = colSamples(data||[], c, 3).join(', ');

                    <span key={c}

              {scoreCol&&(
                <p className="mt-1 text-slate-500">
