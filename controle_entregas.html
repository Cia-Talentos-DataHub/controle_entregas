// ─── Moskit Picker Modal ──────────────────────────────────────────────────────
function MoskitPickerModal({clientId, tenantId, onSelect, onClose}) {
  const [rows,    setRows]    = useState([]);
  const [loading, setLoading] = useState(true);
  const [error,   setError]   = useState('');
  const [filters, setFilters] = useState({id:'',nome:'',produto:'',status:'',prob:'',frente:'',ciclo:''});

  useEffect(()=>{
    fetchMoskitCSV(clientId, tenantId)
      .then(text=>{
        const parsed = Papa.parse(text,{header:true,skipEmptyLines:true});
        setRows(parsed.data||[]);
      })
      .catch(e=>setError('Erro ao carregar CSV: '+e.message))
      .finally(()=>setLoading(false));
  },[]);

  // Unique sorted values for select columns
  const selectOpts = useMemo(()=>{
    const opts={};
    MOSKIT_COLS.filter(c=>c.type==='select').forEach(c=>{
      opts[c.fk] = [...new Set(rows.map(r=>(r[c.key]||'').trim()).filter(Boolean))].sort();
    });
    return opts;
  },[rows]);

  const filtered = rows.filter(r=>
    MOSKIT_COLS.every(c=>{
      if (!filters[c.fk]) return true;
      const val = (r[c.key]||'').trim();
      return c.type==='select' ? val===filters[c.fk] : val.toLowerCase().includes(filters[c.fk].toLowerCase());
    })
  );

  return (
    <div className="modal-overlay" style={{zIndex:60}} onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-6xl max-h-[90vh] flex flex-col mx-4"
        onClick={e=>e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <div>
            <h2 className="text-lg font-bold text-slate-800">Buscar no Moskit</h2>
            {!loading&&!error&&<p className="text-xs text-slate-400 mt-0.5">{filtered.length} de {rows.length} projetos · clique na linha para selecionar</p>}
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-red-500 text-xl w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100">✕</button>
        </div>
        <div className="flex-1 overflow-auto p-4">
          {loading&&<p className="text-center text-slate-400 py-12">⏳ Carregando lista do Moskit...</p>}
          {error&&<p className="text-center text-red-500 py-8">{error}</p>}
          {!loading&&!error&&(
            <table className="w-full text-xs border-collapse">
              <thead className="bg-slate-50 sticky top-0 z-10">
                <tr>
                  {MOSKIT_COLS.map(c=>(
                    <th key={c.fk} className="px-2 py-2 text-left font-semibold text-slate-500 border-b border-slate-200 whitespace-nowrap">
                      <div className="mb-1">{c.label}</div>
                      {c.type==='select' ? (
                        <select value={filters[c.fk]} onChange={e=>setFilters(f=>({...f,[c.fk]:e.target.value}))}
                          onClick={e=>e.stopPropagation()}
                          className="w-full border border-slate-200 rounded px-1 py-1 font-normal focus:ring-1 focus:ring-indigo-300 bg-white">
                          <option value="">Todos</option>
                          {(selectOpts[c.fk]||[]).map(v=><option key={v} value={v}>{v}</option>)}
                        </select>
                      ) : (
                        <input value={filters[c.fk]} onChange={e=>setFilters(f=>({...f,[c.fk]:e.target.value}))}
                          placeholder="Buscar..." onClick={e=>e.stopPropagation()}
                          className="w-full border border-slate-200 rounded px-2 py-1 font-normal focus:ring-1 focus:ring-indigo-300"/>
                      )}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.slice(0,300).map((row,i)=>(
                  <tr key={i} onClick={()=>onSelect(row)}
                    className="border-b border-slate-100 hover:bg-indigo-50 cursor-pointer transition">
                    {MOSKIT_COLS.map(c=>(
                      <td key={c.fk} className="px-2 py-1.5 text-slate-700">{row[c.key]||'—'}</td>
                    ))}
                  </tr>
                ))}
                {filtered.length>300&&(
                  <tr><td colSpan={MOSKIT_COLS.length} className="text-center text-slate-400 py-2">
                    Exibindo 300 de {filtered.length} — refine os filtros
                  </td></tr>
                )}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Project Modal (redesigned — per-analyst % per phase) ─────────────────────
function ProjectModal({project, allAnalysts, allHeads, allKAs, onSave, onClose, saving, isSpConnected, clientId, tenantId, spChoices, moduleConfig}) {
  const isExistingSP = !!(project?.spId);
  const isExistingLocal = project && !project?.spId;
  const [syncToSP, setSyncToSP] = useState(isExistingSP ? true : (isSpConnected && !isExistingLocal));

  const [showMoskit,  setShowMoskit]  = useState(false);
  const [title,       setTitle]       = useState(project?.title||'');
  const [client,      setClient]      = useState(project?.client||'');
  const [status,      setStatus]      = useState(project?.status||'');
  const [ciclo,       setCiclo]       = useState(project?.ciclo||'');
  // Campos adicionais do SP
  const [ka,          setKa]          = useState(project?.ka||'');
  const [trimestre,   setTrimestre]   = useState(project?.trimestre||'');
  const [semestre,    setSemestre]    = useState(project?.semestre||'');
  const [codigoProposta, setCodigoProposta] = useState(project?.codigoProposta||'');
  const [publico,     setPublico]     = useState(project?.publico||'');
  const [pedra,       setPedra]       = useState(project?.pedra||'');
  const [respPedra,   setRespPedra]   = useState(project?.respPedra||'');
  const [tipoProg,    setTipoProg]    = useState(project?.tipoProg||'');
  const [qtdVagas,    setQtdVagas]    = useState(project?.qtdVagas||'');
  const [solucao,     setSolucao]     = useState(project?.solucao||moduleConfig?.frente||'');
  const [produto,     setProduto]     = useState(project?.produto||'');
  // Moskit clients + frentes (lazy-loaded)
  const [moskitClients, setMoskitClients] = useState([]);
  const [moskitFrentes, setMoskitFrentes] = useState([]);
  useEffect(()=>{
    if (!clientId||!tenantId) return;
    fetchMoskitCSV(clientId, tenantId).then(text=>{
      const parsed = window.Papa?.parse(text,{header:true,skipEmptyLines:true});
      if (!parsed?.data||!parsed.data.length) return;
      const keys = Object.keys(parsed.data[0]||{});
      // Empresas (clientes)
      const empCol = keys.find(k=>k.toLowerCase().includes('empresa'));
      if (empCol) setMoskitClients([...new Set(parsed.data.map(r=>(r[empCol]||'').trim()).filter(Boolean))].sort());
      // Frentes de Negócio (excluindo [NÃO USAR])
      const frenteCol = keys.find(k=>k.toLowerCase().includes('frente'));
      if (frenteCol) {
        const frentes = [...new Set(parsed.data.map(r=>(r[frenteCol]||'').trim()).filter(v=>v&&!v.includes('[NÃO USAR]')))].sort();
        setMoskitFrentes(frentes);
      }
    }).catch(()=>{});
  },[clientId, tenantId]);

  // ── Analysts state ──
  const [analysts, setAnalysts] = useState(project?.analysts ? [...project.analysts] : []);
  const [phases,   setPhases]   = useState(()=>{
    const p={};
    PHASES.forEach(ph=>{
      const ex = project?.phases?.[ph.key];
      p[ph.key] = { start:fmtDateForInput(ex?.start)||'', end:fmtDateForInput(ex?.end)||'', pcts:ex?.pcts?[...ex.pcts]:[] };
    });
    return p;
  });

  function syncPctsLength(newList, prevPhases) {
    const updated={};
    PHASES.forEach(ph=>{
      const cur=prevPhases[ph.key].pcts||[];
      updated[ph.key]={...prevPhases[ph.key], pcts:newList.map((_,i)=>cur[i]||0)};
    });
    return updated;
  }
  function addAnalyst() { const n=[...analysts,'']; setAnalysts(n); setPhases(p=>syncPctsLength(n,p)); }
  function removeAnalyst(idx) {
    const n=analysts.filter((_,i)=>i!==idx); setAnalysts(n);
    setPhases(prev=>{ const u={}; PHASES.forEach(ph=>{ const pc=[...prev[ph.key].pcts]; pc.splice(idx,1); u[ph.key]={...prev[ph.key],pcts:pc}; }); return u; });
  }
  function updateAnalystName(idx,name) { setAnalysts(prev=>prev.map((a,i)=>i===idx?name:a)); }
  function updatePhaseField(phKey,field,val) { setPhases(prev=>({...prev,[phKey]:{...prev[phKey],[field]:val}})); }
  function updatePct(phKey,idx,val) {
    setPhases(prev=>{ const pc=[...prev[phKey].pcts]; pc[idx]=Math.max(0,parseFloat(val)||0); return {...prev,[phKey]:{...prev[phKey],pcts:pc}}; });
  }

  // ── Heads state (identical pattern, max 3) ──
  const [heads,      setHeads]      = useState(()=>{
    const h=[];
    if (project?.head1?.trim()) h.push(project.head1.trim());
    if (project?.head2?.trim()) h.push(project.head2.trim());
    if (project?.head3?.trim()) h.push(project.head3.trim());
    return h;
  });
  const [headPhases, setHeadPhases] = useState(()=>{
    const p={};
    PHASES.forEach(ph=>{
      const ex=project?.headPhases?.[ph.key];
      p[ph.key]={ pcts: ex?.pcts ? [...ex.pcts] : [] };
    });
    return p;
  });

  function syncHeadPctsLength(newList, prevHP) {
    const u={};
    PHASES.forEach(ph=>{ const cur=prevHP[ph.key].pcts||[]; u[ph.key]={ pcts:newList.map((_,i)=>cur[i]||0) }; });
    return u;
  }
  function addHead() {
    if (heads.length>=3) return;
    const n=[...heads,'']; setHeads(n); setHeadPhases(p=>syncHeadPctsLength(n,p));
  }
  function removeHead(idx) {
    const n=heads.filter((_,i)=>i!==idx); setHeads(n);
    setHeadPhases(prev=>{ const u={}; PHASES.forEach(ph=>{ const pc=[...prev[ph.key].pcts]; pc.splice(idx,1); u[ph.key]={pcts:pc}; }); return u; });
  }
  function updateHeadName(idx,name) { setHeads(prev=>prev.map((h,i)=>i===idx?name:h)); }
  function updateHeadPct(phKey,idx,val) {
    setHeadPhases(prev=>{ const pc=[...prev[phKey].pcts]; pc[idx]=Math.max(0,parseFloat(val)||0); return {...prev,[phKey]:{pcts:pc}}; });
  }

  function handleSave() {
    if (!title.trim()) return;
    const filteredA = analysts.filter(a=>a.trim());
    const filteredH = heads.filter(h=>h.trim());
    const filteredPhases={};
    PHASES.forEach(ph=>{
      const pcts=analysts.map((a,i)=>a.trim()?phases[ph.key].pcts[i]||0:null).filter(p=>p!==null);
      filteredPhases[ph.key]={...phases[ph.key], pcts};
    });
    const filteredHeadPhases={};
    PHASES.forEach(ph=>{
      const pcts=heads.map((h,i)=>h.trim()?headPhases[ph.key].pcts[i]||0:null).filter(p=>p!==null);
      filteredHeadPhases[ph.key]={ start:phases[ph.key].start, end:phases[ph.key].end, pcts };
    });
    const source = isExistingSP ? 'sharepoint' : (syncToSP&&isSpConnected ? 'sharepoint' : 'local');
    onSave({
      id:             project?.id||'proj_'+Date.now(),
      spId:           project?.spId||null,
      title:          title.trim(),
      client:         client.trim(),
      status,
      ciclo:          ciclo.trim(),
      ka:             ka.trim(),
      trimestre,
      semestre,
      codigoProposta: codigoProposta.trim(),
      publico,
      pedra,
      respPedra,
      tipoProg,
      qtdVagas:       Number(qtdVagas)||0,
      solucao:        normFrente(solucao),
      produto,
      source,
      analysts:       filteredA,
      phases:         filteredPhases,
      head1:          filteredH[0]||null,
      head2:          filteredH[1]||null,
      head3:          filteredH[2]||null,
      headPhases:     filteredHeadPhases,
    });
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[92vh] flex flex-col mx-4"
        onClick={e=>e.stopPropagation()}>

        {/* Sticky header */}
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0 rounded-t-2xl">
          <div>
            <h2 className="text-lg font-bold text-slate-800">{project?'Editar Projeto':'Novo Projeto'}</h2>
            <p className="text-xs text-slate-400 mt-0.5">
              {isExistingSP ? '📋 Projeto do SharePoint — alterações sincronizam automaticamente'
               : isExistingLocal ? '🗂️ Projeto da ferramenta — salvo no arquivo compartilhado'
               : isSpConnected ? 'Novo projeto' : '⚠️ Sem conexão — salvo apenas nesta sessão'}
            </p>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-red-500 text-xl w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100">✕</button>
        </div>

        {/* Scrollable body */}
        <div className="flex-1 overflow-y-auto px-6 py-5 space-y-6">

          {/* ── Informações Gerais ── */}
          <section>
            <div className="flex items-center justify-between mb-3">
              <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest">Informações Gerais</h3>
              {!project&&(

                  className="text-xs text-indigo-600 hover:text-indigo-800 font-semibold border border-indigo-200 px-2.5 py-1 rounded-lg hover:bg-indigo-50 transition flex items-center gap-1">

                </button>
              )}
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div className="sm:col-span-2">
                <label className="block text-xs font-medium text-slate-600 mb-1">Nome do Programa *</label>
                <input value={title} onChange={e=>setTitle(e.target.value)}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-200"
                  placeholder="Ex: BASF — Trainee 2026"/>
              </div>
              {/* Cliente com datalist do Moskit */}
              <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">Cliente</label>
                <input value={client} onChange={e=>setClient(e.target.value)}
                  list="clientDatalist"
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-200"
                  placeholder="Empresa do Moskit"/>
                <datalist id="clientDatalist">
                  {moskitClients.map(c=><option key={c} value={c}/>)}
                </datalist>
              </div>
              {/* Status */}
              <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">Status</label>
                <select value={status} onChange={e=>setStatus(e.target.value)}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-200">
                  <option value="">—</option>
                  {(spChoices?.Status_Programa||['Em andamento','Concluído','Cancelado','Planejamento']).map(o=>(
                    <option key={o} value={o}>{o}</option>
                  ))}

              </div>
              {/* Ciclo → select com opções do SP */}
              <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">Ciclo Orçamentário</label>
                <select value={ciclo} onChange={e=>setCiclo(e.target.value)}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-200">
                  <option value="">—</option>
                  {(spChoices?.Ciclo_Orcamentario||[]).map(o=><option key={o} value={o}>{o}</option>)}

              </div>
              {/* Trimestre */}
              <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">Trimestre Orç.</label>
                <select value={trimestre} onChange={e=>setTrimestre(e.target.value)}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-200">
                  <option value="">—</option>
                  {(spChoices?.Trimestre_Orcamentario||['Q1','Q2','Q3','Q4']).map(o=><option key={o} value={o}>{o}</option>)}
                </select>
              </div>
              {/* Semestre */}
              <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">Semestre Orç.</label>
                <select value={semestre} onChange={e=>setSemestre(e.target.value)}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-200">
                  <option value="">—</option>
                  {(spChoices?.Periodo||['1S','2S']).map(o=><option key={o} value={o}>{o}</option>)}

              </div>
              {/* Código Proposta */}
              <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">Código Proposta</label>
                <input value={codigoProposta} onChange={e=>setCodigoProposta(e.target.value)}

              </div>
              {/* Público */}
              <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">Público</label>
                <select value={publico} onChange={e=>setPublico(e.target.value)}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-200">
                  <option value="">—</option>
                  {(spChoices?.Publico||_publico).map(o=><option key={o} value={o}>{o}</option>)}

              {/* Pedra */}
              <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">Pedra</label>
                <select value={pedra} onChange={e=>setPedra(e.target.value)}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-200">
                  <option value="">—</option>
                  {(spChoices?.Pedra||_pedra).map(o=><option key={o} value={o}>{o}</option>)}

              {/* Responsável Pedra — multi-seleção */}
              <div className="sm:col-span-2">
                <label className="block text-xs font-medium text-slate-600 mb-1">Responsável Pedra</label>
                <div className="flex flex-wrap gap-2 pt-1">
                  {_respPedra.map(opt=>{
                    const sel=(respPedra||'').split(',').map(x=>x.trim()).filter(Boolean);
                    const checked=sel.includes(opt);
                    return (
                      <label key={opt} className={`flex items-center gap-1.5 cursor-pointer px-2.5 py-1 rounded-lg border text-xs transition ${checked?'bg-indigo-50 border-indigo-300 text-indigo-700':'border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
                        <input type="checkbox" checked={checked} onChange={e=>{

                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-200">
                  <option value="">—</option>
                  {(spChoices?.Tipo_Programa||_tipoProg).map(o=><option key={o} value={o}>{o}</option>)}

                  {moskitFrentes.map(f=><option key={f} value={f}/>)}

              </button>
            </div>
            {analysts.length===0?(
              <p className="text-slate-400 text-sm italic py-2">Nenhum analista adicionado. Use o botão acima.</p>

                {analysts.map((a,idx)=>(
                  <div key={idx} className="flex items-center gap-2">

                    </button>
                  </div>

              {allAnalysts.map(a=><option key={a} value={a}/>)}

          </section>

          {/* ── Heads ── */}
          <section>
            <div className="flex items-center justify-between mb-3">
              <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest">Heads Alocados</h3>
              <button onClick={addHead} disabled={heads.length>=3}
                className="text-xs text-violet-600 hover:text-violet-800 font-semibold border border-violet-200 px-2.5 py-1 rounded-lg hover:bg-violet-50 transition disabled:opacity-40">
                + Adicionar Head
              </button>
            </div>
            {heads.length===0?(
              <p className="text-slate-400 text-sm italic py-2">Nenhum head adicionado. Use o botão acima (máx. 3).</p>
            ):(
              <div className="space-y-2">
                {heads.map((h,idx)=>(
                  <div key={idx} className="flex items-center gap-2">
                    <span className="text-xs text-slate-400 w-24 shrink-0">Head {idx+1}</span>
                    <input value={h} onChange={e=>updateHeadName(idx,e.target.value)}
                      list="headDatalist"
                      className="flex-1 border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-violet-200"
                      placeholder="Nome do head"/>
                    <button onClick={()=>removeHead(idx)}
                      className="w-7 h-7 flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-full transition text-lg leading-none shrink-0">
                      ×
                    </button>
                  </div>
                ))}
              </div>
            )}
            <datalist id="headDatalist">
              {(allHeads||[]).map(h=><option key={h} value={h}/>)}
            </datalist>
          </section>

          {/* ── Fases e Alocação (Analistas + Heads) ── */}
          <section>
            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Fases e Percentuais</h3>
            <div className="space-y-2">
              {PHASES.map(ph=>{
                const phase    = phases[ph.key];
                const totalA   = totalPhasePct(phase);
                const totalH   = totalPhasePct({pcts: headPhases[ph.key].pcts});
                return (
                  <div key={ph.key} className="border border-slate-200 rounded-xl overflow-hidden">
                    {/* Phase header row */}
                    <div className="bg-slate-50 px-4 py-2.5 flex items-center gap-2 flex-wrap">
                      <span className="text-sm font-semibold text-slate-700 w-36 shrink-0">{ph.label}</span>
                      <div className="flex items-center gap-1.5">
                        <input type="date" value={phase.start} onChange={e=>updatePhaseField(ph.key,'start',e.target.value)}
                          className="border border-slate-200 rounded-lg px-2 py-1 text-xs focus:ring-1 focus:ring-indigo-300"/>
                        <span className="text-slate-300 text-xs">→</span>
                        <input type="date" value={phase.end} onChange={e=>updatePhaseField(ph.key,'end',e.target.value)}
                          className="border border-slate-200 rounded-lg px-2 py-1 text-xs focus:ring-1 focus:ring-indigo-300"/>
                      </div>
                      <div className="ml-auto flex items-center gap-2">
                        {totalA>0&&(
                          <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${totalA>100?'bg-red-100 text-red-700':totalA>90?'bg-yellow-100 text-yellow-700':'bg-green-100 text-green-700'}`}>
                            Analistas: {Math.round(totalA)}%
                          </span>
                        )}
                        {totalH>0&&(
                          <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${totalH>100?'bg-red-100 text-red-700':totalH>90?'bg-yellow-100 text-yellow-700':'bg-violet-100 text-violet-700'}`}>
                            Heads: {Math.round(totalH)}%
                          </span>
                        )}
                      </div>
                    </div>

                    {/* Per-analyst pct rows */}
                    {analysts.length>0&&(
                      <div className="divide-y divide-slate-50">
                        {analysts.map((a,idx)=>(
                          <div key={idx} className="flex items-center gap-3 px-4 py-2">
                            <span className="text-xs text-slate-500 flex-1 truncate">{a||`Analista ${idx+1}`}</span>
                            <div className="flex items-center gap-1.5 shrink-0">
                              <input type="number" min={0} max={200} step={5}
                                value={phase.pcts[idx]!==undefined?phase.pcts[idx]:''}
                                onChange={e=>updatePct(ph.key,idx,e.target.value)}
                                className="border border-slate-200 rounded-lg px-2 py-1 text-xs w-20 text-right focus:ring-1 focus:ring-indigo-300"
                                placeholder="0"/>
                              <span className="text-xs text-slate-400 w-4">%</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                    {/* Per-head pct rows */}
                    {heads.length>0&&(
                      <>
                        {analysts.length>0&&<div className="border-t border-slate-100 mx-4"/>}
                        <div className="divide-y divide-slate-50">
                          {heads.map((h,idx)=>(
                            <div key={idx} className="flex items-center gap-3 px-4 py-2 bg-violet-50/30">
                              <span className="text-xs text-violet-600 font-medium w-4 shrink-0">H</span>
                              <span className="text-xs text-slate-500 flex-1 truncate">{h||`Head ${idx+1}`}</span>
                              <div className="flex items-center gap-1.5 shrink-0">
                                <input type="number" min={0} max={200} step={5}
                                  value={headPhases[ph.key].pcts[idx]!==undefined?headPhases[ph.key].pcts[idx]:''}
                                  onChange={e=>updateHeadPct(ph.key,idx,e.target.value)}
                                  className="border border-violet-200 rounded-lg px-2 py-1 text-xs w-20 text-right focus:ring-1 focus:ring-violet-300"
                                  placeholder="0"/>
                                <span className="text-xs text-slate-400 w-4">%</span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </>
                    )}

                    {analysts.length===0&&heads.length===0&&(
                      <p className="px-4 py-2 text-xs text-slate-400 italic">Adicione analistas ou heads acima para definir %.</p>
                    )}
                  </div>
                );
              })}
            </div>
          </section>
        </div>

        {/* Sticky footer */}
        <div className="px-6 py-4 border-t border-slate-200 flex items-center justify-between gap-3 shrink-0 rounded-b-2xl bg-white flex-wrap">
          {/* SP sync toggle — only for NEW projects when SP connected */}
          {!isExistingSP && !isExistingLocal && isSpConnected ? (
            <label className="flex items-center gap-2 cursor-pointer select-none">
              <div onClick={()=>setSyncToSP(v=>!v)}
                className={`relative w-9 h-5 rounded-full transition ${syncToSP?'bg-indigo-600':'bg-slate-300'}`}>
                <div className={`absolute top-0.5 w-4 h-4 rounded-full bg-white shadow transition-transform ${syncToSP?'translate-x-4':'translate-x-0.5'}`}/>
              </div>
              <span className="text-xs text-slate-600">
                {syncToSP ? '📋 Adicionar ao SharePoint (List_Pulse)' : '🗂️ Salvar apenas na ferramenta'}
              </span>
            </label>
          ) : (
            <p className="text-xs text-slate-400">
              {isExistingSP ? '💾 Salva no SharePoint + distribução no arquivo'
               : isExistingLocal ? '🗂️ Salva no arquivo compartilhado (alocacao_dist.json)'
               : '⚠️ Sem conexão — visível só nesta sessão'}
            </p>
          )}
          <div className="flex gap-2 ml-auto">
            <button onClick={onClose} className="border border-slate-300 text-slate-600 px-4 py-2 rounded-lg text-sm hover:bg-slate-50 transition">
              Cancelar
            </button>
            <button onClick={handleSave} disabled={!title.trim()||saving}
              className="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white px-5 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
              {saving?'⏳ Salvando...':(project?'💾 Salvar':'➕ Criar Projeto')}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Analyst Detail Modal ─────────────────────────────────────────────────────
function AnalystDetailModal({analyst,allProjects,onClose,extraAllocations,onSaveExtras,vacations,onSaveVacations,entityType}) {
  const isHead = entityType==='head';

  // Analyst mode: projects where this person is an analyst, with their pct per phase
  // Head mode: projects where this person is Head_1/2/3, showing phase dates
  const grouped = isHead
    ? allProjects
        .filter(p=>_projHeads(p).includes(analyst))
        .map(proj=>{
          const hidx=_projHeads(proj).indexOf(analyst);
          return {
            proj,
            phases: PHASES.map(ph=>{
              const hp=proj.headPhases?.[ph.key];
              return {...ph, phase:hp, pct:hp?.pcts?.[hidx]||0};
            }).filter(ph=>ph.phase?.start&&ph.phase?.end),
          };
        })
        .filter(g=>g.phases.length>0)
    : allProjects.filter(p=>p.analysts.includes(analyst)).map(proj=>{
        const idx=proj.analysts.indexOf(analyst);
        const phases=PHASES.map(ph=>({
          ...ph, phase:proj.phases[ph.key], pct:proj.phases[ph.key]?.pcts?.[idx]||0,
        })).filter(ph=>ph.phase?.start&&ph.phase?.end&&ph.pct>0);
        return {proj,phases};
      }).filter(g=>g.phases.length>0);

  const myExtras = (extraAllocations||[]).filter(e=>e.analyst===analyst);

  const [addMode,    setAddMode]    = useState(false);
  const [form,       setForm]       = useState({projId:'',projTitle:'',client:'',start:'',end:'',pct:''});
  const [formErr,    setFormErr]    = useState('');
  const [extraSaving,setExtraSaving]= useState(false);
  const [extraSaved, setExtraSaved] = useState(false);
  const [extraErr,   setExtraErr]   = useState('');

  // Vacation state
  const myVacations = (vacations||[]).filter(v=>v.analyst===analyst);
  const [vacMode,    setVacMode]    = useState(false);
  const [vacForm,    setVacForm]    = useState({start:'',end:''});
  const [vacFormErr, setVacFormErr] = useState('');
  const [vacSaving,  setVacSaving]  = useState(false);
  const [vacSaved,   setVacSaved]   = useState(false);
  const [vacErr,     setVacErr]     = useState('');

  async function handleVacAdd() {
    if (!vacForm.start||!vacForm.end)       { setVacFormErr('Informe início e fim.'); return; }
    const s=parseSPDate(vacForm.start), e=parseSPDate(vacForm.end);
    if (!s||!e||s>e)                        { setVacFormErr('Período inválido — início deve ser antes do fim.'); return; }
    const entry = {
      id:`vac-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,
      analyst, start:vacForm.start, end:vacForm.end,
    };
    const newList=[...(vacations||[]),entry];
    setVacSaving(true); setVacErr('');
    try {
      await onSaveVacations(newList);
      setVacForm({start:'',end:''}); setVacFormErr(''); setVacMode(false);
      setVacSaved(true); setTimeout(()=>setVacSaved(false),3000);
    } catch(e) { setVacErr('Erro ao salvar: '+e.message); }
    finally { setVacSaving(false); }
  }

  async function handleVacDelete(id) {
    const newList=(vacations||[]).filter(v=>v.id!==id);
    setVacSaving(true); setVacErr('');
    try {
      await onSaveVacations(newList);
      setVacSaved(true); setTimeout(()=>setVacSaved(false),3000);
    } catch(e) { setVacErr('Erro ao remover: '+e.message); }
    finally { setVacSaving(false); }
  }

  function handleFormChange(field,val) {
    if (field==='projId') {
      const proj=allProjects.find(p=>p.id===val);
      setForm(f=>({...f,projId:val,projTitle:proj?.title||'',client:proj?.client||''}));
    } else {
      setForm(f=>({...f,[field]:val}));
    }
  }

  async function handleAdd() {
    if (!form.projId)                               { setFormErr('Selecione um projeto.'); return; }
    if (!form.start||!form.end)                     { setFormErr('Informe início e fim.'); return; }
    const pctN=Number(form.pct);
    if (!form.pct||isNaN(pctN)||pctN<=0||pctN>200) { setFormErr('Percentual inválido (1–200).'); return; }
    const s=parseSPDate(form.start), e=parseSPDate(form.end);
    if (!s||!e||s>e)                                { setFormErr('Período inválido — início deve ser antes do fim.'); return; }
    const newEntry = {
      id:`ea-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,
      analyst, projId:form.projId, projTitle:form.projTitle, client:form.client,
      start:form.start, end:form.end, pct:Math.round(pctN),
    };
    const newList = [...(extraAllocations||[]), newEntry];
    setExtraSaving(true); setExtraErr('');

// ─── Criar coluna Frente de Negócio no SP ─────────────────────────────────────
// Cria campo Choice 'FrenteNegocio' e renomeia o título para display correto
async function createFrenteNegocioField(token, siteUrl, listName) {
  const base = _spListBase(siteUrl, listName);
  const hdrs = {'Authorization':`Bearer ${token}`,'Content-Type':'application/json;odata=nometadata','Accept':'application/json;odata=nometadata'};

  // Verifica se o campo já existe
  const checkRes = await fetch(`${base}/fields?$filter=InternalName eq 'FrenteNegocio'&$select=InternalName&$top=1`, {headers:{'Authorization':`Bearer ${token}`,'Accept':'application/json;odata=nometadata'}});
  if (checkRes.ok) {
    const checkJson = await checkRes.json();
    if ((checkJson.value||[]).length > 0) return true; // já existe
  }

  // Cria como Text (tipo 2) — mais simples, sem validação de choices
  const createRes = await fetch(`${base}/fields`, {
    method:'POST', headers:hdrs,
    body: JSON.stringify({Title:'FrenteNegocio', FieldTypeKind:2, Required:false}),
  });
  if (!createRes.ok) {
    const t = await createRes.text();
    if (!t.toLowerCase().includes('exist') && !t.includes('duplicate')) {
      throw new Error(`Criar campo: ${createRes.status} ${t.slice(0,150)}`);
    }
  }
  return true;
}

// ─── Field Inspector (diagnóstico completo da List_Pulse) ─────────────────────
async function fetchFieldInspection(token, siteUrl, listName) {
  const base = _spListBase(siteUrl, listName);
  const json = await spFetch(token,
    `${base}/fields?$select=InternalName,StaticName,Title,FieldTypeKind,Required,ReadOnlyField,Choices,MaxLength,SchemaXml&$top=500`
  );
  const TYPE_NAMES = {
    1:'Integer',2:'Text',3:'Note',4:'DateTime',5:'Counter',6:'Choice',
    7:'Lookup',8:'Boolean',9:'Number',10:'Currency',11:'URL',12:'Computed',
    14:'GUID',15:'MultiChoice',17:'GridChoice',19:'Attachments',20:'User',
    21:'Recurrence',22:'CrossProjectLink',23:'ModStat',25:'ContentTypeId',
    101:'File',
  };
  const PULSE_KEYS = new Set(PULSE_FIELDS.map(f=>f.k));
  const PULSE_MAP  = {};
  PULSE_FIELDS.forEach(f=>{ PULSE_MAP[f.k]=f; });

  // Campos relevantes: todos os graváveis não-sistema
  const skip = new Set(['ContentTypeId','_ModerationComments','File_x0020_Type','_ColorHex',
    '_ColorTag','_Emoji','ComplianceAssetId','LinkTitle','LinkTitle2','SelectTitle',
    'InstanceID','GUID','WorkflowInstanceID','_Level','_IsCurrentVersion','MetaInfo',
    'ItemChildCount','FolderChildCount','_CommentCount','_CommentFlags','owshiddenversion',
    'WorkflowVersion','_UIVersion','_UIVersionString']);

  const rows = (json.value||[])
    .filter(f=>!f.ReadOnlyField && !skip.has(f.InternalName) && f.FieldTypeKind!==25)
    .map(f=>{
      const typeName = TYPE_NAMES[f.FieldTypeKind]||`T${f.FieldTypeKind}`;
      const choices  = (f.Choices?.results||f.Choices||[]).filter(c=>c&&c.trim());
      const ourField = PULSE_MAP[f.InternalName] || PULSE_MAP[f.StaticName]
        || Object.values(PULSE_MAP).find(p=>_spFieldMap[p.k]===f.StaticName||_spFieldMap[p.k]===f.InternalName);
      const ourType  = ourField?.t||'—';
      const typeMismatch = ourField && (
        (f.FieldTypeKind===4 && ourField.t!=='date') ||
        (f.FieldTypeKind===9 && ourField.t!=='number') ||
        (f.FieldTypeKind===6 && ourField.t!=='select') ||
        (f.FieldTypeKind===15 && ourField.t!=='select') ||
        (f.FieldTypeKind===8 && ourField.t!=='select')
      );
      return {
        internalName: f.InternalName,
        staticName:   f.StaticName,
        title:        f.Title,
        spType:       typeName,
        spTypeKind:   f.FieldTypeKind,
        required:     f.Required,
        choices,
        ourKey:       ourField?.k||'',
        ourLabel:     ourField?.l||'',
        ourType,
        typeMismatch,
        notMapped:    !ourField,
      };
    });
  return rows;
}

// ─── Pulse View ───────────────────────────────────────────────────────────────
function PulseView({projects, ciclos, allAnalysts, allKAs, onSave, saving, token, spChoices}) {
  const [filters,     setFilters]     = useState({ciclo:'', analista:'', head:'', ka:'', client:'', nome:'', frente:''});
  const [editProject,   setEditProject]   = useState(null);
  const [editLoading,   setEditLoading]   = useState(false);
  const [editError,     setEditError]     = useState('');
  const [inspecting,    setInspecting]    = useState(false);
  const [inspection,    setInspection]    = useState(null);
  const [inspectError,  setInspectError]  = useState('');

  async function handleInspect() {
    setInspecting(true); setInspectError('');
    try {
      const rows = await fetchFieldInspection(token, SP_SITE_URL, SP_LIST_NAME);
      setInspection(rows);
    } catch(e) { setInspectError('Erro: '+e.message); }
    finally { setInspecting(false); }
  }

  // Only SP projects are editable via Pulse
  const spProjects = projects.filter(p=>p.source==='sharepoint');

  // Frentes únicas dos projetos — usa p.solucao (lido de Frente_Negocio no SP)
  const frenteOptions = useMemo(()=>[
    ...new Set(spProjects.map(p=>(p.solucao||'').trim()).filter(v=>v&&!v.includes('[NÃO USAR]')))
  ].sort(),[spProjects]);

  const filtered = useMemo(()=>spProjects.filter(p=>{
    if (filters.ciclo   && p.ciclo!==filters.ciclo) return false;
    if (filters.frente && normFrente(p.solucao)!==normFrente(filters.frente)) return false;
    if (filters.client  && !(p.client||'').toLowerCase().includes(filters.client.toLowerCase())) return false;
    if (filters.nome    && !(p.title||'').toLowerCase().includes(filters.nome.toLowerCase())) return false;
    if (filters.ka      && !(p.ka||'').toLowerCase().includes(filters.ka.toLowerCase())) return false;
    if (filters.analista && !p.analysts.some(a=>(a||'').toLowerCase().includes(filters.analista.toLowerCase()))) return false;
    if (filters.head    && ![p.head1,p.head2,p.head3].some(h=>(h||'').toLowerCase().includes(filters.head.toLowerCase()))) return false;
    return true;
  }), [spProjects, filters]);

  const hasFilters = Object.values(filters).some(Boolean);

  // Lazy-load: busca o item completo (sem $select) somente ao abrir o modal de edição
  async function handleEditClick(proj) {
    setEditError('');
    setEditLoading(true);
    try {
      const raw = await fetchSPItemFull(token, SP_SITE_URL, SP_LIST_NAME, proj.spId);
      // Extrai campos Pulse usando o StaticName real do SP (via _spFieldMap),
      // com fallback para f.k — igual ao que parseSPItem faz
      const pulseData = {};
      PULSE_FIELDS.forEach(f=>{
        const spKey = _spFieldMap[f.k] && _spFieldMap[f.k]!=='__nonexistent__' ? _spFieldMap[f.k] : f.k;
        const v = raw[spKey]!==undefined ? raw[spKey] : raw[f.k];
        if (f.t==='multicheck') {
          // MultiChoice returns {results:[...]} or a string
          if (v && typeof v==='object' && v.results) pulseData[f.k]=v.results.join(',');
          else if (Array.isArray(v)) pulseData[f.k]=v.join(',');
          else pulseData[f.k]=v?String(v):'';
        } else {
          pulseData[f.k] = (f.t==='date') ? (fmtDateForInput(v)||'') : (v!==undefined&&v!==null ? String(v) : '');
        }
      });
      setEditProject({...proj, pulseData});
    } catch(e) {
      setEditError('Erro ao carregar campos: '+e.message);
    } finally {
      setEditLoading(false);
    }
  }

  async function handleSave(updated) {
    await onSave(updated);
    setEditProject(null);
  }

  if (spProjects.length===0) return (
    <div className="mt-16 text-center text-slate-400">
      <p className="text-4xl mb-3">📋</p>
      <p className="text-lg font-medium">Nenhum registro da List_Pulse carregado.</p>
    </div>
  );

  return (
    <div className="fade-in max-w-screen-2xl mx-auto px-4 pb-10 mt-4 space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <h2 className="text-lg font-bold text-slate-800">List_Pulse</h2>
        <div className="flex items-center gap-2">
          <span className="text-xs text-slate-500">{filtered.length} de {spProjects.length} registros</span>
          <button onClick={handleInspect} disabled={inspecting}
            title="Inspeciona todos os campos da List_Pulse: tipo, obrigatoriedade, opções de escolha, mapeamento"
            className="text-xs border border-amber-200 bg-amber-50 hover:bg-amber-100 text-amber-700 px-2.5 py-1.5 rounded-lg transition disabled:opacity-50 flex items-center gap-1">
            {inspecting?'⏳':'🔍'} Inspecionar Campos
          </button>
        </div>
      </div>

      {/* ── Inspection Panel ── */}
      {inspectError&&<p className="text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg px-4 py-3">{inspectError}</p>}
      {inspection&&(
        <div className="bg-white rounded-xl border border-amber-200 overflow-hidden">
          <div className="bg-amber-50 px-4 py-3 flex items-center justify-between border-b border-amber-200">
            <div>
              <h3 className="text-sm font-bold text-amber-800">🔍 Inspeção de Campos — List_Pulse</h3>
              <p className="text-xs text-amber-600 mt-0.5">
                {inspection.filter(r=>r.typeMismatch).length} tipo(s) errado(s) · {inspection.filter(r=>r.notMapped).length} não mapeado(s) · {inspection.length} campos graváveis total
              </p>
            </div>
            <button onClick={()=>setInspection(null)} className="text-amber-400 hover:text-amber-700 text-lg">✕</button>
          </div>
          <div className="overflow-auto max-h-[60vh]">
            <table className="min-w-full text-xs border-collapse">
              <thead className="sticky top-0 bg-amber-50">
                <tr>
                  {['InternalName (SP)','Title (SP)','Tipo SP','Obrig.','Opções SP (Choice)','Chave Código','Label Código','Tipo Código','Status'].map(h=>(
                    <th key={h} className="px-3 py-2 text-left text-amber-700 font-semibold whitespace-nowrap border-b border-amber-100">{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-50">
                {inspection.map((r,i)=>{
                  const bg = r.typeMismatch?'bg-red-50':r.notMapped?'bg-slate-50':'';
                  const status = r.typeMismatch?'⚠️ Tipo errado':r.notMapped?'— Não mapeado':'✓';
                  const statusColor = r.typeMismatch?'text-red-600 font-semibold':r.notMapped?'text-slate-400':'text-green-600';
                  return (
                    <tr key={i} className={`${bg} hover:bg-amber-50/40 transition`}>
                      <td className="px-3 py-1.5 font-mono text-slate-600 whitespace-nowrap">{r.internalName}</td>
                      <td className="px-3 py-1.5 text-slate-700">{r.title}</td>
                      <td className="px-3 py-1.5 text-slate-500 whitespace-nowrap">{r.spType} ({r.spTypeKind})</td>
                      <td className="px-3 py-1.5 text-center">{r.required?'✓':''}</td>
                      <td className="px-3 py-1.5 text-slate-500 max-w-xs truncate" title={r.choices.join(', ')}>{r.choices.join(', ')||'—'}</td>
                      <td className="px-3 py-1.5 font-mono text-indigo-600 whitespace-nowrap">{r.ourKey||'—'}</td>
                      <td className="px-3 py-1.5 text-slate-600">{r.ourLabel||'—'}</td>
                      <td className="px-3 py-1.5 text-slate-500">{r.ourType}</td>
                      <td className={`px-3 py-1.5 whitespace-nowrap ${statusColor}`}>{status}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* Filter bar */}
      <div className="bg-white rounded-xl border border-slate-200 p-4">
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-3">
          <div>
            <label className="block text-xs font-medium text-slate-500 mb-1">Ciclo Orç.</label>
            <select value={filters.ciclo} onChange={e=>setFilters(f=>({...f,ciclo:e.target.value}))}
              className="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:ring-2 focus:ring-indigo-200 bg-white">
              <option value="">Todos</option>
              {ciclos.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          {/* Frente de Negócio */}
          <div>
            <label className="block text-xs font-medium text-slate-500 mb-1">Frente de Negócio</label>
            <select value={filters.frente} onChange={e=>setFilters(f=>({...f,frente:e.target.value}))}
              className="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:ring-2 focus:ring-indigo-200 bg-white">
              <option value="">Todas</option>
              {frenteOptions.map(v=><option key={v} value={v}>{v}</option>)}
            </select>
          </div>
          {[
            {key:'nome',     label:'Nome do Processo'},
            {key:'client',   label:'Cliente'},
            {key:'ka',       label:'GSC'},
            {key:'head',     label:'Head (1/2/3)'},
            {key:'analista', label:'Analista'},
          ].map(f=>(
            <div key={f.key}>
              <label className="block text-xs font-medium text-slate-500 mb-1">{f.label}</label>
              <input value={filters[f.key]} onChange={e=>setFilters(ff=>({...ff,[f.key]:e.target.value}))}
                placeholder="Buscar..."
                className="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:ring-2 focus:ring-indigo-200"/>
            </div>
          ))}
        </div>
        {hasFilters&&(
          <button onClick={()=>setFilters({ciclo:'',analista:'',head:'',ka:'',client:'',nome:'',frente:''})}
            className="mt-3 text-xs text-indigo-600 hover:text-indigo-800 font-medium">
            ✕ Limpar filtros
          </button>
        )}
      </div>

      {/* Results table */}
      <div className="scroll-table bg-white rounded-xl border border-slate-200 overflow-hidden">
        <table className="min-w-full text-xs border-collapse">
          <thead>
            <tr className="bg-slate-50 border-b border-slate-200">
              <th className="px-3 py-2.5 text-left font-semibold text-slate-500 whitespace-nowrap">#</th>
              <th className="px-3 py-2.5 text-left font-semibold text-slate-500 min-w-52">Nome do Processo</th>
              <th className="px-3 py-2.5 text-left font-semibold text-slate-500 whitespace-nowrap">Cliente</th>
              <th className="px-3 py-2.5 text-left font-semibold text-slate-500 whitespace-nowrap">Status</th>
              <th className="px-3 py-2.5 text-left font-semibold text-slate-500 whitespace-nowrap">Ciclo</th>
              <th className="px-3 py-2.5 text-left font-semibold text-slate-500 whitespace-nowrap">GSC</th>
              <th className="px-3 py-2.5 text-left font-semibold text-slate-500 whitespace-nowrap">Head 1</th>
              <th className="px-3 py-2.5 text-left font-semibold text-slate-500 whitespace-nowrap">Head 2</th>
              <th className="px-3 py-2.5 text-left font-semibold text-slate-500 whitespace-nowrap">Head 3</th>
              <th className="px-3 py-2.5 text-left font-semibold text-slate-500 min-w-40">Analistas</th>
              <th className="px-3 py-2.5 text-center font-semibold text-slate-500 sticky right-0 bg-slate-50"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {filtered.length===0&&(
              <tr><td colSpan={11} className="text-center text-slate-400 py-10">Nenhum registro encontrado.</td></tr>
            )}
            {filtered.map(proj=>(
              <tr key={proj.id} className="hover:bg-slate-50 transition">
                <td className="px-3 py-2 text-slate-400 whitespace-nowrap">{proj.indice}</td>
                <td className="px-3 py-2 font-medium text-slate-800">{proj.title}</td>
                <td className="px-3 py-2 text-slate-600 whitespace-nowrap">{proj.client||'—'}</td>
                <td className="px-3 py-2 whitespace-nowrap"><StatusBadge status={proj.status}/></td>
                <td className="px-3 py-2 text-slate-600 whitespace-nowrap">{proj.ciclo||'—'}</td>
                <td className="px-3 py-2 text-slate-600 whitespace-nowrap">{proj.ka||'—'}</td>
                <td className="px-3 py-2 text-slate-600 whitespace-nowrap">{proj.head1||'—'}</td>
                <td className="px-3 py-2 text-slate-600 whitespace-nowrap">{proj.head2||'—'}</td>
                <td className="px-3 py-2 text-slate-600 whitespace-nowrap">{proj.head3||'—'}</td>
                <td className="px-3 py-2 text-slate-500 max-w-xs truncate">
                  {proj.analysts.filter(Boolean).join(', ')||'—'}
                </td>
                <td className="px-3 py-2 text-center sticky right-0 bg-white border-l border-slate-100">
                  <button onClick={()=>handleEditClick(proj)} disabled={editLoading}
                    className="text-xs text-indigo-600 hover:text-indigo-800 border border-indigo-200 px-2.5 py-1 rounded-lg hover:bg-indigo-50 transition whitespace-nowrap disabled:opacity-50">
                    {editLoading?'⏳':'Editar'}
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Error ao buscar campos do item */}
      {editError&&(
        <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-sm text-red-700 flex items-center justify-between">
          <span>{editError}</span>
          <button onClick={()=>setEditError('')} className="ml-3 text-red-400 hover:text-red-600">✕</button>
        </div>
      )}

      {editProject&&(
        <PulseEditModal
          project={editProject}
          allAnalysts={allAnalysts}
          allKAs={allKAs}
          onSave={handleSave}
          onClose={()=>setEditProject(null)}
          saving={saving}
          spChoices={spChoices}
        />
      )}
    </div>
  );
}

// ─── Pulse Edit Modal (all List_Pulse fields, collapsible sections) ───────────
function PulseEditModal({project, allAnalysts, allKAs, onSave, onClose, saving, spChoices}) {
  // Core fields
  const [title,    setTitle]    = useState(project?.title||'');
  const [client,   setClient]   = useState(project?.client||'');
  const [status,   setStatus]   = useState(project?.status||'');
  const [ciclo,    setCiclo]    = useState(project?.ciclo||'');
  const [ka,       setKa]       = useState(project?.ka||'');
  const [solucao,  setSolucao]  = useState(project?.solucao||'');
  const [head1,    setHead1]    = useState(project?.head1||'');
  const [head2,    setHead2]    = useState(project?.head2||'');
  const [head3,    setHead3]    = useState(project?.head3||'');
  // Analysts & phases
  const [analysts, setAnalysts] = useState(project?.analysts ? [...project.analysts] : []);
  const [phases,   setPhases]   = useState(()=>{
    const p={}; PHASES.forEach(ph=>{
      const ex=project?.phases?.[ph.key];
      p[ph.key]={start:fmtDateForInput(ex?.start)||'',end:fmtDateForInput(ex?.end)||'',pcts:ex?.pcts?[...ex.pcts]:[]};
    }); return p;
  });
  // Pulse extra fields
  const [pulseData, setPulseData] = useState(()=>{
    const d={}; PULSE_FIELDS.forEach(f=>{d[f.k]=project?.pulseData?.[f.k]||'';}); return d;
  });
  // Section collapse state — start all collapsed except first two
  const [collapsed, setCollapsed] = useState(()=>{
    const c={};
    PULSE_SECTIONS.forEach((s,i)=>{ c[s]=i>=2; }); // first 2 sections open, rest collapsed
    c['_identificacao_basica'] = false;
    c['Analistas e Fases'] = false;
    return c;
  });

  function toggleSec(s) { setCollapsed(c=>({...c,[s]:!c[s]})); }
  function updatePulse(k,v) { setPulseData(p=>({...p,[k]:v})); }

  function syncPctsLength(newA,prevPh){
    const u={}; PHASES.forEach(ph=>{ const c=prevPh[ph.key].pcts||[]; u[ph.key]={...prevPh[ph.key],pcts:newA.map((_,i)=>c[i]||0)}; }); return u;
  }
  function addAnalyst(){ const a=[...analysts,'']; setAnalysts(a); setPhases(p=>syncPctsLength(a,p)); }
  function removeAnalyst(idx){
    const a=analysts.filter((_,i)=>i!==idx); setAnalysts(a);
    setPhases(p=>{ const u={}; PHASES.forEach(ph=>{ const pc=[...p[ph.key].pcts]; pc.splice(idx,1); u[ph.key]={...p[ph.key],pcts:pc}; }); return u; });
  }
  function updAnalystName(idx,v){ setAnalysts(p=>p.map((a,i)=>i===idx?v:a)); }
  function updPhaseField(ph,f,v){ setPhases(p=>({...p,[ph]:{...p[ph],[f]:v}})); }
  function updPct(ph,idx,v){ setPhases(p=>{ const pc=[...p[ph].pcts]; pc[idx]=Math.max(0,parseFloat(v)||0); return {...p,[ph]:{...p[ph],pcts:pc}}; }); }

  function handleSave(){
    if (!title.trim()) return;
    const fA=analysts.filter(a=>a.trim());
    const fPh={}; PHASES.forEach(ph=>{ const pc=analysts.map((a,i)=>a.trim()?phases[ph.key].pcts[i]||0:null).filter(p=>p!==null); fPh[ph.key]={...phases[ph.key],pcts:pc}; });
    onSave({...project, title:title.trim(), client:client.trim(), status, ciclo:ciclo.trim(),
      ka:ka.trim(), solucao:normFrente(solucao),
      head1:head1.trim(), head2:head2.trim(), head3:head3.trim(),
      analysts:fA, phases:fPh, pulseData});
  }

  // Shared input classes
  const cls = 'w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-200';

  // Render a single PULSE_FIELDS entry
  function renderPulseField(f){
    const v=pulseData[f.k]||'';
    if (f.t==='select') return (
      <select value={v} onChange={e=>updatePulse(f.k,e.target.value)} className={cls}>
        <option value="">—</option>
        {(f.o||[]).map(op=><option key={op} value={op}>{op}</option>)}
      </select>
    );
    if (f.t==='multicheck') {
      const selected=v.split(',').map(x=>x.trim()).filter(Boolean);
      return (
        <div className="flex flex-wrap gap-2 pt-1">
          {(f.o||[]).map(opt=>{
            const checked=selected.includes(opt);
            return (
              <label key={opt} className={`flex items-center gap-1.5 cursor-pointer px-2.5 py-1 rounded-lg border text-xs transition ${checked?'bg-indigo-50 border-indigo-300 text-indigo-700':'border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
                <input type="checkbox" checked={checked} onChange={e=>{
                  const next=e.target.checked?[...selected,opt]:selected.filter(s=>s!==opt);
                  updatePulse(f.k,next.join(','));
                }} className="accent-indigo-600"/>
                {opt}
              </label>
            );
          })}
        </div>
      );
    }
    if (f.t==='textarea') return <textarea value={v} onChange={e=>updatePulse(f.k,e.target.value)} rows={3} className={cls+' resize-none'}/>;
    if (f.t==='date') return <input type="date" value={v} onChange={e=>updatePulse(f.k,e.target.value)} className={cls}/>;
    if (f.t==='number') return <input type="number" value={v} onChange={e=>updatePulse(f.k,e.target.value)} className={cls}/>;
    return <input type="text" value={v} onChange={e=>updatePulse(f.k,e.target.value)} className={cls}/>;
  }

  // Section header button
  function SecHeader({id,label,icon,count}){
    const open=!collapsed[id];
    return (
      <button onClick={()=>toggleSec(id)} className="w-full flex items-center gap-2 text-left py-1">
        <span className="text-sm">{icon}</span>
        <span className="text-xs font-bold text-slate-500 uppercase tracking-widest flex-1">{label}</span>
        {count&&<span className="text-xs text-slate-400">{count} campos</span>}
        <span className={`text-slate-400 text-xs transition-transform ${open?'rotate-180':''}`}>▾</span>
      </button>
    );
  }

  // Render a section from PULSE_FIELDS (excluding Etapas)
  function renderSection(sLabel){
    const fields=PULSE_FIELDS.filter(f=>f.s===sLabel&&!f.etapa);
    if (!fields.length) return null;
    return (
      <section key={sLabel} className="border border-slate-200 rounded-xl overflow-hidden">
        <div className="bg-slate-50 px-4 py-2.5 border-b border-slate-200">
          <SecHeader id={sLabel} label={sLabel} count={fields.length}/>
        </div>
        {!collapsed[sLabel]&&(
          <div className="px-4 py-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
            {fields.map(f=>(
              <div key={f.k} className={f.w?'sm:col-span-2':''}>
                <label className="block text-xs font-medium text-slate-600 mb-1">{f.l}</label>
                {renderPulseField(f)}
              </div>
            ))}
          </div>
        )}
      </section>
    );
  }

  const normalSections = PULSE_SECTIONS.filter(s=>s!=='Etapas de Avaliação');

  // ── Detecção: projeto pertence a um dos novos módulos? ──
  const ALL_MOD_FRENTES = Object.values(MODULE_CONFIGS).flatMap(c=>c.frentes).map(f=>f.toLowerCase());
  const FI_FRENTES      = new Set(MODULE_CONFIGS.fi.frentes.map(f=>f.toLowerCase()));
  const projFrente      = (project?.solucao||project?.pulseData?.Solucao||'').trim().toLowerCase();
  const isModuleProj    = ALL_MOD_FRENTES.includes(projFrente);
  const isFIProj        = FI_FRENTES.has(projFrente);

  // ── Vista simplificada para projetos dos novos módulos ──
  if (isModuleProj) {
    const cls2 = 'w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-200';
    const modLabel = Object.values(MODULE_CONFIGS).find(c=>c.frentes.map(f=>f.toLowerCase()).includes(projFrente))?.label||'';
    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[95vh] flex flex-col mx-4" onClick={e=>e.stopPropagation()}>
          {/* Header */}
          <div className="sticky top-0 bg-white border-b border-slate-100 px-6 py-4 flex items-center justify-between rounded-t-2xl z-10">
            <div>
              <h2 className="text-lg font-bold text-slate-800">Editar — {modLabel}</h2>
              <p className="text-xs text-slate-400 mt-0.5">#{project?.indice} · {project?.title}</p>
            </div>
            <button onClick={onClose} className="text-slate-400 hover:text-red-500 text-xl w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100">✕</button>
          </div>
          <div className="flex-1 overflow-y-auto px-6 py-4 space-y-4">

            {/* Campos do cadastro */}
            <section className="border border-slate-200 rounded-xl p-4">
              <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Dados do Projeto</p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="sm:col-span-2">
                  <label className="block text-xs font-medium text-slate-600 mb-1">Nome do Projeto</label>
                  <input value={title} onChange={e=>setTitle(e.target.value)} className={cls2}/>
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-600 mb-1">Cliente</label>
                  <input value={client} onChange={e=>setClient(e.target.value)} className={cls2}/>
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-600 mb-1">Status</label>
                  <select value={status} onChange={e=>setStatus(e.target.value)} className={cls2}>
                    <option value="">—</option>
                    {(spChoices?.Status_Programa||[]).map(o=><option key={o} value={o}>{o}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-600 mb-1">Frente de Negócio</label>
                  <input value={solucao} onChange={e=>setSolucao(e.target.value)} className={cls2}/>
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-600 mb-1">Produto Principal</label>
                  <input value={pulseData['Produto_Principal']||''} onChange={e=>updatePulse('Produto_Principal',e.target.value)} className={cls2}/>
                </div>
                {[
                  {l:'Ciclo Orçamentário', v:ciclo,                  s:setCiclo,    t:'sel', opts:spChoices?.Ciclo_Orcamentario},
                  {l:'Trimestre Orç.',     v:pulseData['Trimestre_Orcamentario']||'', s:v=>updatePulse('Trimestre_Orcamentario',v), t:'sel', opts:spChoices?.Trimestre_Orcamentario||['Q1','Q2','Q3','Q4']},
                  {l:'Semestre Orç.',      v:pulseData['Semestre_Orcamentario']||'', s:v=>updatePulse('Semestre_Orcamentario',v),  t:'sel', opts:spChoices?.Periodo||['1S','2S']},
                  {l:'Código Proposta',    v:pulseData['Codigo_Proposta']||'',       s:v=>updatePulse('Codigo_Proposta',v),         t:'txt'},
                  {l:'Pedra',              v:pulseData['Pedra']||'',                 s:v=>updatePulse('Pedra',v),                   t:'sel', opts:spChoices?.Pedra||_pedra},
                ].map(({l,v,s,t,opts})=>(
                  <div key={l}>
                    <label className="block text-xs font-medium text-slate-600 mb-1">{l}</label>
                    {t==='sel'
                      ? <select value={v} onChange={e=>s(e.target.value)} className={cls2}>
                          <option value="">—</option>
                          {(opts||[]).map(o=><option key={o} value={o}>{o}</option>)}
                        </select>
                      : <input value={v} onChange={e=>s(e.target.value)} className={cls2}/>}
                  </div>
                ))}
                {/* Responsável Pedra — multi-seleção separada */}
                <div className="sm:col-span-2">
                  <label className="block text-xs font-medium text-slate-600 mb-1">Responsável Pedra</label>
                  <div className="flex flex-wrap gap-2 pt-1">
                    {_respPedra.map(opt=>{
                      const cur=pulseData['Responsavel_Pedra']||'';
                      const sel=cur.split(',').map(x=>x.trim()).filter(Boolean);
                      const checked=sel.includes(opt);
                      return (
                        <label key={opt} className={`flex items-center gap-1.5 cursor-pointer px-2.5 py-1 rounded-lg border text-xs transition ${checked?'bg-indigo-50 border-indigo-300 text-indigo-700':'border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
                          <input type="checkbox" checked={checked} onChange={e=>{
                            const next=e.target.checked?[...sel,opt]:sel.filter(s=>s!==opt);
                            updatePulse('Responsavel_Pedra',next.join(','));
                          }} className="accent-indigo-600"/>
                          {opt}
                        </label>
                      );
                    })}
                  </div>
                </div>
              </div>
            </section>

            {/* Acompanhamento */}
            <section className="border border-slate-200 rounded-xl overflow-hidden">
              <div className="bg-slate-50 px-4 py-2.5 border-b border-slate-200">
                <SecHeader id="Acompanhamento" label="Acompanhamento" icon="📋"/>
              </div>
              {!collapsed['Acompanhamento']&&(
                <div className="px-4 py-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {PULSE_FIELDS.filter(f=>f.s==='Acompanhamento').map(f=>(
                    <div key={f.k} className={f.w?'sm:col-span-2':''}>
                      <label className="block text-xs font-medium text-slate-600 mb-1">{f.l}</label>
                      {renderPulseField(f)}
                    </div>
                  ))}
                </div>
              )}
            </section>

            {/* Pesquisas */}
            <section className="border border-slate-200 rounded-xl overflow-hidden">
              <div className="bg-slate-50 px-4 py-2.5 border-b border-slate-200">

// ── Overview Panel (status cards + phase distribution + active phases tree) ──
function CalOverview({ events, today }) {
  const [expanded, setExpanded] = useState(true);

  const classified = useMemo(() =>
    events.map(e => ({ ...e, status: calPhaseStatus(e.start, e.end, today) }))
  , [events, today]);

  // Status counts
  const statusCounts = useMemo(() => {
    const c = { planned:0, active:0, warning:0, critical:0, done:0 };
    classified.forEach(e => { if (c[e.status]!==undefined) c[e.status]++; });
    return c;
  }, [classified]);

  // Phase distribution (unique project-phase pairs, count per phase)
  const phaseCounts = useMemo(() => {
    const c = {};
    classified.forEach(e => { c[e.phaseKey]=(c[e.phaseKey]||0)+1; });
    return c;
  }, [classified]);

  // Active phases (non-done) grouped by client, sorted by status priority
  const activeByClient = useMemo(() => {
    const active = classified.filter(e => e.status !== 'done');
    const map = {};
    active.forEach(e => {
      const c = e.client||'(sem cliente)';
      if (!map[c]) map[c] = [];
      map[c].push(e);
    });
    // Sort each client's events by status priority then start date
    Object.values(map).forEach(arr => arr.sort((a,b) => {
      const si = CAL_STATUS_ORDER.indexOf(a.status);
      const sj = CAL_STATUS_ORDER.indexOf(b.status);
      return si!==sj ? si-sj : a.start-b.start;
    }));
    return Object.entries(map).sort(([a],[b]) => a.localeCompare(b));
  }, [classified]);

  return (
    <div className="mb-8">

      {/* ── Status summary cards ── */}
      <div className="grid grid-cols-2 sm:grid-cols-5 gap-4 mb-6">
        {CAL_STATUS_ORDER.map(s => {
          const st = CAL_STATUS[s];
          const count = statusCounts[s] || 0;
          return (
            <div key={s} className="bg-white rounded-2xl border border-slate-200 p-5 flex items-center gap-4 hover:shadow-md transition-shadow">
              <span className="text-3xl leading-none">{st.emoji}</span>
              <div>
                <div className="text-2xl font-bold text-slate-900 leading-tight">{count}</div>
                <div className="text-xs text-slate-500 mt-0.5">{st.label}</div>
              </div>
            </div>
          );
        })}
      </div>

      {/* ── Phase distribution ── */}
      {Object.keys(phaseCounts).length > 0 && (
        <div className="bg-white rounded-2xl border border-slate-200 p-5 mb-5">
          <div className="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-4">
            Projetos por fase — período filtrado
          </div>
          <div className="flex flex-wrap gap-3">
            {PHASES.filter(ph => phaseCounts[ph.key]).map(ph => (
              <div key={ph.key}
                className="flex items-center gap-2.5 px-4 py-2 rounded-xl border text-sm font-semibold"
                style={{borderColor:CAL_COLORS[ph.key], color:CAL_COLORS[ph.key], background:CAL_COLORS[ph.key]+'18'}}>
                <span>{ph.label}</span>
                <span className="text-base font-bold leading-none">{phaseCounts[ph.key]}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── Fases em andamento (client tree) ── */}
      {activeByClient.length > 0 && (
        <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
          <button
            onClick={() => setExpanded(x => !x)}
            className="w-full flex items-center justify-between px-6 py-4 hover:bg-slate-50 transition-colors">
            <div className="flex items-center gap-3">
              <span className="text-xs font-semibold text-slate-400 uppercase tracking-widest">Fases em andamento</span>
              <span className="text-xs bg-emerald-100 text-emerald-700 font-semibold px-2 py-0.5 rounded-full">
                {activeByClient.reduce((s,[,evts])=>s+evts.length,0)} fases
              </span>
            </div>
            <span className="text-slate-400 text-sm">{expanded ? '▲' : '▼'}</span>
          </button>

          {expanded && (
            <div className="border-t border-slate-100 divide-y divide-slate-50">
              {activeByClient.map(([client, evts]) => (
                <div key={client} className="px-6 py-5">
                  {/* Client row */}
                  <div className="flex items-center gap-2.5 mb-4">
                    <div className="w-7 h-7 rounded-lg bg-slate-100 flex items-center justify-center text-sm shrink-0">🏢</div>
                    <span className="text-sm font-bold text-slate-800">{client}</span>
                    <span className="text-xs text-slate-400">({evts.length} fase{evts.length!==1?'s':''})</span>
                  </div>
                  {/* Project rows */}
                  <div className="space-y-3 ml-2">
                    {evts.map((e, ei) => {
                      const st = CAL_STATUS[e.status];
                      const isLast = ei === evts.length - 1;
                      const daysLeft = e.status !== 'planned'
                        ? Math.round((e.end - today) / 864e5)
                        : Math.round((e.start - today) / 864e5);
                      return (
                        <div key={e.id} className="flex items-start gap-3">
                          {/* Tree line */}
                          <span className="text-slate-200 text-sm mt-0.5 shrink-0 font-mono select-none">
                            {isLast ? '└' : '├'}
                          </span>
                          {/* Status dot */}
                          <div className="w-2 h-2 rounded-full mt-2 shrink-0" style={{background:st.color}}/>
                          {/* Content */}
                          <div className="flex-1 min-w-0 pb-1">
                            <div className="flex flex-wrap items-center gap-2">
                              <span className="text-sm font-semibold text-slate-800">{e.projTitle}</span>
                              <span className="text-xs px-2 py-0.5 rounded-full font-medium"
                                style={{background:CAL_COLORS[e.phaseKey]+'22',color:CAL_COLORS[e.phaseKey]}}>
                                {e.phaseLabel}
                              </span>
                              <span className="text-xs font-medium" style={{color:st.color}}>
                                {e.status==='planned'
                                  ? `começa em ${daysLeft}d`
                                  : e.status==='done'
                                  ? 'finalizado'
                                  : daysLeft<=0
                                  ? `atrasado ${Math.abs(daysLeft)}d`
                                  : `${daysLeft}d restante${daysLeft!==1?'s':''}`}
                              </span>
                            </div>
                            <div className="text-xs text-slate-400 mt-1.5">
                              {calFmt(e.start)} <span className="text-slate-200 mx-1">→</span> {calFmt(e.end)}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {activeByClient.length === 0 && events.length === 0 && (
        <div className="bg-white rounded-2xl border border-slate-200 p-10 text-center text-slate-400 text-sm">
          Nenhuma fase encontrada. Ajuste os filtros para ver o cronograma.
        </div>
      )}
    </div>
  );
}

// ── CalendarView (main) ──
function CalendarView({ projects, ciclos }) {
  const today = calSoD(new Date());
  const [viewMode, setViewMode]             = useState('month');
  const [navDate, setNavDate]               = useState(calSoD(today));
  const [filterCiclo,   setFilterCiclo]   = useState('');
  const [filterFrente,  setFilterFrente]  = useState('');
  const [filterProjeto, setFilterProjeto] = useState('');
  const [filterCliente, setFilterCliente] = useState('');
  const [filterDateStart, setFilterDateStart] = useState('');
  const [filterDateEnd, setFilterDateEnd]   = useState('');
  const [selectedDay, setSelectedDay]       = useState(null);

  // Build events list from all project phases
  const allEvents = useMemo(() => {
    const evts = [];
    (projects||[]).forEach(proj => {
      PHASES.forEach(ph => {
        const phase = proj.phases?.[ph.key];
        if (!phase?.start || !phase?.end) return;
        const start = parseSPDate(phase.start);
        const end   = parseSPDate(phase.end);
        if (!start || !end || isNaN(start) || isNaN(end)) return;
        evts.push({
          id:         `${proj.id}-${ph.key}`,
          projId:     proj.id,
          projTitle:  proj.title,
          client:     proj.client||'',
          ciclo:      proj.ciclo||'',
          frente:     proj.solucao||'',
          phaseKey:   ph.key,
          phaseLabel: ph.label,
          start:      calSoD(start),
          end:        calSoD(end),
          color:      CAL_COLORS[ph.key]||'#64748b',
        });
      });
    });
    return evts;
  }, [projects]);

  // Apply filters
  const events = useMemo(() => {
    return allEvents.filter(e => {
      if (filterCiclo   && e.ciclo !== filterCiclo)                                          return false;
      if (filterFrente  && normFrente(e.frente) !== normFrente(filterFrente))                return false;
      if (filterProjeto && !e.projTitle.toLowerCase().includes(filterProjeto.toLowerCase())) return false;
      if (filterCliente && !e.client.toLowerCase().includes(filterCliente.toLowerCase()))    return false;
      if (filterDateStart) { const fs=parseSPDate(filterDateStart); if (fs&&e.end<fs)   return false; }
      if (filterDateEnd)   { const fe=parseSPDate(filterDateEnd);   if (fe&&e.start>fe) return false; }
      return true;
    });
  }, [allEvents, filterCiclo, filterFrente, filterProjeto, filterCliente, filterDateStart, filterDateEnd]);

  function navPrev() {
    const d=new Date(navDate);
    if (viewMode==='month') d.setMonth(d.getMonth()-1);
    else if (viewMode==='week') d.setDate(d.getDate()-7);
    else d.setDate(d.getDate()-1);
    setNavDate(d);
  }
  function navNext() {
    const d=new Date(navDate);
    if (viewMode==='month') d.setMonth(d.getMonth()+1);
    else if (viewMode==='week') d.setDate(d.getDate()+7);
    else d.setDate(d.getDate()+1);
    setNavDate(d);
  }

  let navTitle='';
  if (viewMode==='month') {
    navTitle=`${CAL_MONTH_NAMES[navDate.getMonth()]} ${navDate.getFullYear()}`;
  } else if (viewMode==='week') {
    const wk=calGetWeekDays(navDate);
    navTitle=`${calFmt(wk[0]).slice(0,5)} – ${calFmt(wk[6])}`;
  } else {
    navTitle=calFmt(navDate);
  }

  const dayModalEvents = selectedDay
    ? events.filter(e=>e.start<=selectedDay&&e.end>=selectedDay).sort((a,b)=>a.start-b.start)
    : [];

  const hasFilters = filterCiclo||filterFrente||filterProjeto||filterCliente||filterDateStart||filterDateEnd;
  // Frentes únicas dos projetos para o filtro do Calendário
  const calFrenteOptions = useMemo(()=>[...new Set((projects||[]).map(p=>(p.solucao||'').trim()).filter(Boolean))].sort(),[projects]);

  return (
    <div className="max-w-screen-xl mx-auto px-4 pb-12">

      {/* ── Filter bar ── */}
      <div className="bg-white rounded-2xl border border-slate-200 px-5 py-4 mb-6 mt-3 flex flex-wrap gap-4 items-end">
        <div>
          <label className="text-xs font-semibold text-slate-400 uppercase tracking-wide block mb-1.5">Ciclo</label>
          <select value={filterCiclo} onChange={e=>setFilterCiclo(e.target.value)}
            className="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white text-slate-700 min-w-[130px] focus:ring-2 focus:ring-emerald-300 focus:border-emerald-400">
            <option value="">Todos</option>
            {(ciclos||[]).map(c=><option key={c} value={c}>{c}</option>)}
          </select>
