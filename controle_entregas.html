// Busca todos os campos da lista SP e resolve os StaticNames reais das colunas Head PCT.
// Usa matching por palavras-chave para tolerar variações de nome (ex: encoding SP).
async function fetchHeadPctCols(token, siteUrl, listName) {
  try {
    const base = _spListBase(siteUrl, listName);
    const json = await spFetch(token, `${base}/fields?$select=StaticName,Title&$top=500`);
    const fields = json.value||[];
    PHASES.forEach(ph=>{
      const words = ph.key.toLowerCase().split('_');
      // Busca por contenção de 'consultor' e 'head' + todas as palavras da chave da fase
      // NÃO exige 'pct' no nome — evita falha para colunas com nome truncado (ex: _P)
      const match = fields.find(f=>{
        const s = f.StaticName.toLowerCase();
        return s.includes('consultor') && s.includes('head')
          && words.every(w=>s.includes(w));
      });
      // Só atualiza se encontrou — nunca sobrescreve com null (preserva o default correto)
      if (match) HEAD_PCT_COLS[ph.key] = match.StaticName;
    });
  } catch { /* mantém defaults */ }
}

function calSoD(d)       { return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function calAddDays(d,n) { const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function calSameDay(a,b) { return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function calGetWeekDays(date) { const d=calSoD(date); return Array.from({length:7},(_,i)=>calAddDays(d,i-d.getDay())); }
function calGetMonthGrid(yr,mo) { const f=new Date(yr,mo,1); const s=calAddDays(f,-f.getDay()); return Array.from({length:42},(_,i)=>calAddDays(s,i)); }
function calFmt(d) { return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }

  active:   { color:'#22c55e', bg:'#f0fdf4', label:'Em andamento',  emoji:'🟢' },
  warning:  { color:'#eab308', bg:'#fefce8', label:'Atenção',       emoji:'🟡' },
  critical: { color:'#ef4444', bg:'#fef2f2', label:'Crítico',       emoji:'🔴' },
  done:     { color:'#94a3b8', bg:'#f8fafc', label:'Finalizado',    emoji:'⚫' },
};
const CAL_STATUS_ORDER = ['critical','warning','active','planned','done'];
function calPhaseStatus(start, end, today) {
  const s=calSoD(start), e=calSoD(end), t=calSoD(today||new Date());
  if (e<t) return 'done';
  if (s>t) return 'planned';
  const daysLeft=Math.round((e-t)/864e5);
  if (daysLeft<=3) return 'critical';
  if (daysLeft<=7) return 'warning';
  return 'active';
}

// ─── Date Helpers (always LOCAL midnight — never UTC) ──────────────────────────
function parseSPDate(v) {
  if (!v) return null;
  const s = String(v).trim();
  if (!s) return null;
  if (s.includes('T')) {
    const [y,m,d] = s.split('T')[0].split('-').map(Number);
    return new Date(y, m-1, d);
  }
  if (s.includes('/')) {
    const [d,m,y] = s.split(' ')[0].split('/').map(Number);
    if (y&&m&&d) return new Date(y, m-1, d);
  }
  if (s.includes('-')) {
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  return null;
}
function fmtDateForInput(raw) {          // → YYYY-MM-DD for <input type="date">
  const d = parseSPDate(raw);
  if (!d||isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDateForSP(raw) {             // → "YYYY-MM-DDTHH:mm:ssZ" (avoids UTC shift)
  const d = parseSPDate(raw);
  if (!d||isNaN(d)) return null;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T00:00:00Z`;
}
function fmtDateDisplay(raw) {
  const d = parseSPDate(raw);
  if (!d||isNaN(d)) return '—';
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function monthKey(date) {
  const d = typeof date==='string' ? parseSPDate(date) : date;
  if (!d||isNaN(d)) return null;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function monthLabel(mk) {
  if (!mk) return '';
  const [y,m] = mk.split('-');
  return ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][parseInt(m)-1]+'/'+y;
}
function rangeMonths(start, end) {
  if (!start||!end) return [];
  const [sy,sm] = start.split('-').map(Number);
  const [ey,em] = end.split('-').map(Number);
  if (!sy||!sm||!ey||!em) return [];
  const s = new Date(sy, sm-1, 1);
  const e = new Date(ey, em-1, 1);
  const out = []; let cur = new Date(s);
  while (cur<=e && out.length<36) {
    out.push(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`);
    cur.setMonth(cur.getMonth()+1);
  }
  return out;
}
function daysOverlapInMonth(startRaw, endRaw, mk) {
  if (!startRaw||!endRaw||!mk) return 0;
  const [y,m] = mk.split('-').map(Number);
  const mS = new Date(y,m-1,1), mE = new Date(y,m,0);
  const phS = parseSPDate(startRaw), phE = parseSPDate(endRaw);
  if (!phS||!phE) return 0;
  const oS = phS>mS?phS:mS, oE = phE<mE?phE:mE;
  return Math.max(0, Math.round((oE-oS)/(864e5))+1);
}

// ─── PCT Helpers ──────────────────────────────────────────────────────────────
function parsePct(v) {
  if (!v&&v!==0) return 0;
  const s = String(v).trim();
  if (!s||s==='0') return 0;
  if (s.includes('%')) return parseFloat(s.replace('%','').replace(',','.')) || 0;
  return (parseFloat(s.replace(',','.')) || 0) * 100;
}
function pctToSP(pct) { return pct/100; }
function totalPhasePct(phase) { return (phase?.pcts||[]).reduce((a,b)=>a+(b||0), 0); }

// ─── Parse SharePoint Item → internal model ───────────────────────────────────
// phases[key].pcts     = number[] (one per analyst, same order as analysts[])
// headPhases[key].pcts = number[] (one per head,    same order as head1/2/3)
function parseSPItem(item) {
  const analysts = ANALYST_KEYS
    .map(k=>(item[k]||'').trim())
    .filter(a=>a&&a!==PLACEHOLDER);
  const n = Math.max(analysts.length, 1);
  const phases = {};
  PHASES.forEach(ph=>{
    const tot     = PHASE_NO_PCT.has(ph.key) ? 0 : parsePct(item[`Analista_${ph.key}_PCT`]);
    const perEach = tot>0 ? Math.round(tot/n) : 0;
    phases[ph.key] = {
      start: item[`Inicio_${ph.key}`]||null,
      end:   item[PHASE_END_COLS[ph.key]||`Fim_${ph.key}`]||null,
      pcts:  analysts.map(()=>perEach),
    };
  });
  // Head phases — total lido do SP; distribuição per-head restaurada pelo mergeProjectsWithDist
  const projHeadNames = HEAD_KEYS.map(k=>(item[k]||'').trim()).filter(h=>h&&h!==PLACEHOLDER);
  const nh = Math.max(projHeadNames.length, 1);
  const headPhases = {};
  PHASES.forEach(ph=>{
    // Tenta o nome mapeado e o default como fallback para máxima robustez
    const colName = PHASE_NO_PCT.has(ph.key) ? null : (HEAD_PCT_COLS[ph.key] || HEAD_PCT_COLS_DEFAULT[ph.key]);
    const tot     = colName ? (parsePct(item[colName]) || parsePct(item[HEAD_PCT_COLS_DEFAULT[ph.key]])) : 0;
    const perEach = tot>0 ? Math.round(tot/nh) : 0;
    headPhases[ph.key] = {
      start: item[`Inicio_${ph.key}`]||null,
      end:   item[PHASE_END_COLS[ph.key]||`Fim_${ph.key}`]||null,
      pcts:  projHeadNames.map(()=>perEach),
    };
  });
  // Populate pulseData — lê pelo StaticName real do SP (override > f.k original)
  const pulseData = {};
  PULSE_FIELDS.forEach(f => {
    const spKey = _spFieldMap[f.k] && _spFieldMap[f.k]!=='__nonexistent__' ? _spFieldMap[f.k] : f.k;
    const raw = item[spKey]!==undefined ? item[spKey] : item[f.k];
    pulseData[f.k] = (f.t==='date') ? (fmtDateForInput(raw)||'') : (raw!==undefined&&raw!==null ? String(raw) : '');
  });
  return {
    id:           String(item.Id||item.indice||'r'+Math.random()),
    spId:         item.Id||item.id||null,
    indice:       Number(item.indice)||0,
    title:        item.Nome_Programa||item.Title||'Sem título',
    client:       item.Cliente||'',
    status:       item.Status_Programa||'',
    ciclo:        item.Ciclo_Orcamentario||'',
    ka:           item.KA||'',
    trimestre:    item.Trimestre_Orcamentario||'',
    semestre:     item.Periodo||'',
    codigoProposta: item.Codigo_Proposta||'',
    publico:      item.Publico||'',
    pedra:        item.Pedra||'',
    respPedra:    normRespPedra(item.Responsavel_Pedra||''),
    tipoProg:     item.Tipo_Programa||'',
    qtdVagas:     Number(item.Quantidade_Vagas_Prevista)||0,
    solucao:      normFrente(item.FrenteNegocio||''),  // nova coluna Frente de Negócio (SP: FrenteNegocio)
    produto:      item.Produto_Principal||'',
    farol:        item.Farol_Vermelho||'',
    vagasTrab:    Number(item[_spFieldMap['Vagas_Trabalhadas']||'Vagas_Trabalhadas'])||0,
    vagasFech:    Number(item[_spFieldMap['Vagas_Fechadas']   ||'Vagas_Fechadas'   ])||0,
    vagasExtra:   Number(item[_spFieldMap['Vagas_Extras']     ||'Vagas_Extras'     ])||0,
    vagasCanc:    Number(item[_spFieldMap['Vagas_Canceladas'] ||'Vagas_Canceladas' ])||0,
    vagasNaoFech: Number(item[_spFieldMap['Vagas_Nao_Fechadas']||'Vagas_Nao_Fechadas'])||0,
    motivosCelebrar: item[_spFieldMap['Motivos_Celebrar']||'Motivos_Celebrar']||'',
    devemosCuidar:   item[_spFieldMap['Devemos_Cuidar']  ||'Devemos_Cuidar'  ]||'',
    resumoSemanal:   item[_spFieldMap['Resumo_Semanal']  ||'Resumo_Semanal'  ]||'',
    head1:      item.Head_1||'',
    head2:      item.Head_2||'',
    head3:      item.Head_3||'',
    source:     'sharepoint',
    analysts,
    phases,
    headPhases,
    pulseData,
  };
}

// ─── Build SP PATCH/POST payload from internal project ────────────────────────
function buildSPPayload(project) {
  const payload = {};
  if (project.title         !== undefined) payload['Nome_Programa']            = project.title||null;
  if (project.title         !== undefined) payload['Title']                    = project.title||null;
  if (project.client        !== undefined) payload['Cliente']                  = project.client||null;
  if (project.status        !== undefined) payload['Status_Programa']          = project.status||null;
  if (project.ciclo         !== undefined) payload['Ciclo_Orcamentario']       = project.ciclo||null;
  if (project.ka            !== undefined) payload['KA']                       = project.ka||null;
  if (project.trimestre     !== undefined) payload['Trimestre_Orcamentario']   = project.trimestre||null;
  if (project.semestre      !== undefined) payload['Periodo']                  = project.semestre||null;
  if (project.codigoProposta!== undefined) payload['Codigo_Proposta']          = project.codigoProposta||null;
  if (project.publico       !== undefined) payload['Publico']                  = project.publico||null;
  if (project.pedra         !== undefined) payload['Pedra']                    = project.pedra||null;
  if (project.respPedra     !== undefined) payload['Responsavel_Pedra']        = project.respPedra||null;
  if (project.tipoProg      !== undefined) payload['Tipo_Programa']            = project.tipoProg||null;
  if (project.qtdVagas      !== undefined && project.qtdVagas>0) payload['Quantidade_Vagas_Prevista'] = project.qtdVagas;
  if (project.solucao       !== undefined) payload['FrenteNegocio']    = project.solucao||null;
  if (project.produto       !== undefined) payload['Produto_Principal'] = project.produto||null;
  if (project.head1         !== undefined) payload['Head_1']                   = project.head1||null;
  if (project.head2         !== undefined) payload['Head_2']                   = project.head2||null;
  if (project.head3         !== undefined) payload['Head_3']                   = project.head3||null;
  for (let i=0; i<MAX_ANALYSTS; i++) {
    payload[`Analista_${i+1}`] = project.analysts[i]||null;
  }
  PHASES.forEach(ph=>{
    const phase     = project.phases[ph.key]||{};
    const headPhase = project.headPhases?.[ph.key]||{};
    const total     = totalPhasePct(phase);
    const headTotal = totalPhasePct(headPhase);
    payload[`Inicio_${ph.key}`]                       = phase.start ? fmtDateForSP(phase.start) : null;
    payload[PHASE_END_COLS[ph.key]||`Fim_${ph.key}`] = phase.end   ? fmtDateForSP(phase.end)   : null;
    if (!PHASE_NO_PCT.has(ph.key)) {
      payload[`Analista_${ph.key}_PCT`] = pctToSP(total);
      const headCol = HEAD_PCT_COLS[ph.key];
      if (headCol) payload[headCol]     = pctToSP(headTotal);
    }
  });
  return payload;
}

// ─── Compute Allocations (day-weighted, per-analyst pct) ──────────────────────
function computeAllocations(projects) {
  const result = {};
  projects.forEach(proj=>{
    proj.analysts.forEach((analyst, idx)=>{
      if (!analyst) return;
      if (!result[analyst]) result[analyst]={};
      PHASES.forEach(ph=>{
        const phase = proj.phases[ph.key];
        const pct   = phase?.pcts?.[idx]||0;
        if (!phase?.start||!phase?.end||!pct) return;
        const sMk = monthKey(parseSPDate(phase.start));
        const eMk = monthKey(parseSPDate(phase.end));
        if (!sMk||!eMk) return;
        rangeMonths(sMk,eMk).forEach(mk=>{
          const [y,m] = mk.split('-').map(Number);
          const dim   = new Date(y,m,0).getDate();
          const ov    = daysOverlapInMonth(phase.start,phase.end,mk);
          result[analyst][mk] = (result[analyst][mk]||0) + pct*(ov/dim);
        });
      });
    });
  });
  Object.values(result).forEach(a=>Object.keys(a).forEach(mk=>{a[mk]=Math.round(a[mk]);}));
  return result;
}

// ─── Weekly / Daily Allocation Computation ────────────────────────────────────
function weekMonday(d) {
  const day = calSoD(d instanceof Date ? d : (parseSPDate(d)||new Date()));
  return calAddDays(day, -((day.getDay()||7)-1));
}
function weekKey(d) {
  const m=weekMonday(d instanceof Date ? d : (parseSPDate(d)||new Date()));
  return `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(m.getDate()).padStart(2,'0')}`;
}
function weekLabel(wk) {
  const d=parseSPDate(wk); if(!d) return wk;
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}
function rangeWeeks(startMk, endMk) {
  const [sy,sm]=startMk.split('-').map(Number);
  const [ey,em]=endMk.split('-').map(Number);
  const endDate=new Date(ey,em,0);
  let cur=weekMonday(new Date(sy,sm-1,1));
  const wks=[]; while(cur<=endDate&&wks.length<104){ wks.push(weekKey(cur)); cur=calAddDays(cur,7); }
  return wks;
}
function dayKey(d) {
  const day=calSoD(d instanceof Date ? d : (parseSPDate(d)||new Date()));
  return `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
}
function rangeDays(startMk, endMk, maxDays=45) {
  const [sy,sm]=startMk.split('-').map(Number);
  const [ey,em]=endMk.split('-').map(Number);
  const endDate=new Date(ey,em,0);
  let cur=calSoD(new Date(sy,sm-1,1));
  const result=[]; while(cur<=endDate&&result.length<maxDays){ result.push(dayKey(cur)); cur=calAddDays(cur,1); }
  return result;
}
function computeAllocationsWeekly(projects, weeks) {
  const result={};
  projects.forEach(proj=>{
    proj.analysts.forEach((analyst,idx)=>{
      if(!analyst) return;
      if(!result[analyst]) result[analyst]={};
      PHASES.forEach(ph=>{
        const phase=proj.phases[ph.key];
        const pct=phase?.pcts?.[idx]||0;
        if(!phase?.start||!phase?.end||!pct) return;
        weeks.forEach(wk=>{
          const wkS=parseSPDate(wk), wkE=calAddDays(wkS,6);
          const phS=parseSPDate(phase.start), phE=parseSPDate(phase.end);
          if(!phS||!phE) return;
          const oS=phS>wkS?phS:wkS, oE=phE<wkE?phE:wkE;
          const ov=Math.max(0,Math.round((oE-oS)/864e5)+1);
          if(ov>0) result[analyst][wk]=(result[analyst][wk]||0)+pct*(ov/7);
        });
      });
    });
  });
  Object.values(result).forEach(a=>Object.keys(a).forEach(k=>{a[k]=Math.round(a[k]);}));
  return result;
}
function computeAllocationsDaily(projects, days) {
  const result={};
  projects.forEach(proj=>{
    proj.analysts.forEach((analyst,idx)=>{
      if(!analyst) return;
      if(!result[analyst]) result[analyst]={};
      PHASES.forEach(ph=>{
        const phase=proj.phases[ph.key];
        const pct=phase?.pcts?.[idx]||0;
        if(!phase?.start||!phase?.end||!pct) return;
        const phS=parseSPDate(phase.start), phE=parseSPDate(phase.end);
        if(!phS||!phE) return;
        days.forEach(dk=>{
          const d=parseSPDate(dk);
          if(d>=phS&&d<=phE) result[analyst][dk]=(result[analyst][dk]||0)+pct;
        });
      });
    });
  });
  Object.values(result).forEach(a=>Object.keys(a).forEach(k=>{a[k]=Math.round(a[k]);}));
  return result;
}

// ─── Vacation Helpers ─────────────────────────────────────────────────────────
// Returns {analyst: {col: pct}} where pct is the proportional vacation % for
// that column period (100 × overlap_days / period_days).
// Day view: pct = 100 for vacation days (full day), 0 otherwise.
function buildVacationMap(vacations, cols, granularity) {
  const map={};
  (vacations||[]).forEach(v=>{
    if(!v.analyst||!v.start||!v.end) return;
    if(!map[v.analyst]) map[v.analyst]={};
    const vS=parseSPDate(v.start), vE=parseSPDate(v.end);
    if(!vS||!vE) return;
    cols.forEach(col=>{
      let pct=0;
      if (granularity==='month') {
        const [y,m]=col.split('-').map(Number);
        const dim=new Date(y,m,0).getDate();
        const ov=daysOverlapInMonth(v.start,v.end,col);
        if(ov>0) pct=Math.round(100*(ov/dim));
      } else if (granularity==='week') {
        const wS=parseSPDate(col), wE=calAddDays(wS,6);
        const oS=vS>wS?vS:wS, oE=vE<wE?vE:wE;
        const ov=Math.max(0,Math.round((oE-oS)/864e5)+1);
        if(ov>0) pct=Math.round(100*(ov/7));
      } else {
        const d=parseSPDate(col);
        if(d&&d>=vS&&d<=vE) pct=100;
      }
      if(pct>0) map[v.analyst][col]=(map[v.analyst][col]||0)+pct;
    });
  });
  // Cap at 100 per column

    throw new Error(`SP ${res.status}: ${t.slice(0,300)}`);
  }
  const buffer = await res.arrayBuffer();
  const workbook = XLSX.read(buffer, {type:'array'});
  const sheetToUse = workbook.SheetNames.find(s=>s===sheetName) || workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetToUse];

    });

function calcNpsMetrics(rows, scoreCol) {
  const valid = rows.filter(r => {
    const v = r[scoreCol];
    if (v==='' || v===null || v===undefined) return false;
    const n = Number(v);
    return !isNaN(n) && n >= 0 && n <= 10; // estrito 0-10: exclui notas 1-5 de classificação
  });
  const total = valid.length;
  if (!total) return {total:0, respondentes:rows.length, promotores:0, neutros:0, detratores:0, nps:null, pctProm:0, pctNeu:0, pctDet:0};
  const promotores = valid.filter(r => Number(r[scoreCol])>=9).length;
  const neutros    = valid.filter(r => Number(r[scoreCol])>=7 && Number(r[scoreCol])<=8).length;
  const detratores = valid.filter(r => Number(r[scoreCol])<=6).length;
  const nps = Math.round(((promotores - detratores) / total) * 100);
  return {
    total, respondentes:rows.length, promotores, neutros, detratores, nps,
    pctProm: Math.round((promotores/total)*100),
    pctNeu:  Math.round((neutros/total)*100),
    pctDet:  Math.round((detratores/total)*100),
  };
}

function npsZona(nps) {
  if (nps===null||nps===undefined) return {label:'—',        color:'#94a3b8', bg:'#f1f5f9'};
  if (nps>=75)  return {label:'Excelência',       color:'#16a34a', bg:'#dcfce7'};
  if (nps>=50)  return {label:'Qualidade',        color:'#2563eb', bg:'#dbeafe'};
  if (nps>=0)   return {label:'Aperfeiçoamento',  color:'#d97706', bg:'#fef3c7'};
  return              {label:'Crítica',           color:'#dc2626', bg:'#fee2e2'};
}

  if (!res.ok) throw new Error(`HTTP ${res.status}`);

// Busca o item marcador sem $filter (mais confiável — SP às vezes não retorna resultado
// com $filter em Title mesmo o item existindo, causando tentativa de criação duplicada).
async function _findDistItem(token, siteUrl) {
  const base = _spListBase(siteUrl, SP_LIST_NAME);
  const hdrs = {'Authorization':`Bearer ${token}`,'Accept':'application/json;odata=nometadata'};
  let url = `${base}/items?$select=Id,Title&$top=500`;
  while (url) {
    const res = await fetch(url, { headers: hdrs });
    if (!res.ok) return null;
    const json = await res.json();
    const found = (json.value||[]).find(i=>i.Title===DIST_MARKER);
    if (found) return found;
    url = json['@odata.nextLink']||null;
  }
  return null;
}
async function _getOrCreateDistItem(token, siteUrl) {
  const base = _spListBase(siteUrl, SP_LIST_NAME);
  const hdrs = {'Authorization':`Bearer ${token}`,'Accept':'application/json;odata=nometadata'};

  // 1. Busca sem $filter server-side (evita inconsistências do SP)
  const existing = await _findDistItem(token, siteUrl);
  if (existing) return existing.Id;

  // 2. Cria o item marcador
  const postRes = await fetch(`${base}/items`, {
    method:'POST',
    headers:{...hdrs,'Content-Type':'application/json;odata=nometadata'},
    body: JSON.stringify({ Title: DIST_MARKER }),
  });
  if (postRes.ok) return (await postRes.json()).Id;

  // 3. Se criação falhar (duplicate ou race condition), tenta achar de novo
  const retry = await _findDistItem(token, siteUrl);
  if (retry) return retry.Id;

  const t = await postRes.text().catch(()=>'');
  throw new Error(`Erro ao criar dist item: ${postRes.status} ${t.slice(0,150)}`);
}
async function fetchDistFile(token, siteUrl) {
  // "Arquivo não existe ainda" é diferente de "erro de rede/auth".
  // Somente retorna objeto vazio quando é 1º uso (sem item ou 404 no attachment).
  // Para qualquer outro erro, lança — assim loadAll pode bloquear saves e avisar o usuário.
  const item = await _findDistItem(token, siteUrl);
  if (!item) return {distributions:{},localProjects:[]};  // 1º uso, sem dados ainda
  const base = _spListBase(siteUrl, SP_LIST_NAME);
  const attRes = await fetch(`${base}/items(${item.Id})/AttachmentFiles('${DIST_ATT_NAME}')/$value`, {
    headers:{'Authorization':`Bearer ${token}`,'Accept':'text/plain'},
  });
  if (attRes.status === 404) return {distributions:{},localProjects:[]};  // attachment ainda não criado
  if (!attRes.ok) throw new Error(`Erro ao ler dist.json do SharePoint: ${attRes.status}`);
  const text = await attRes.text();
  try { return JSON.parse(text); }
  catch { throw new Error('dist.json está corrompido (JSON inválido). Contate o suporte antes de continuar.'); }
}
async function saveDistFile(token, siteUrl, data) {
  const base   = _spListBase(siteUrl, SP_LIST_NAME);
  const itemId = await _getOrCreateDistItem(token, siteUrl);
  const body   = new TextEncoder().encode(JSON.stringify(data));
  const hdrs   = {'Authorization':`Bearer ${token}`,'Content-Type':'application/octet-stream'};
  // Strategy: try PUT ($value update) first — works if attachment already exists.
  // If 404 (doesn't exist yet), fall back to add(). Avoids 409 from delete+create race.
  const putRes = await fetch(`${base}/items(${itemId})/AttachmentFiles('${DIST_ATT_NAME}')/$value`, {
    method:'PUT', headers:hdrs, body,
  });
  if (putRes.ok) return; // updated successfully
  if (putRes.status !== 404) {
    // Unexpected error on PUT — try DELETE then ADD as fallback
    await fetch(`${base}/items(${itemId})/AttachmentFiles('${DIST_ATT_NAME}')`, {
      method:'POST',
      headers:{'Authorization':`Bearer ${token}`,'X-HTTP-Method':'DELETE','If-Match':'*'},
    }).catch(()=>{});
  }
  // Add (create) the attachment
  const addRes = await fetch(`${base}/items(${itemId})/AttachmentFiles/add(FileName='${DIST_ATT_NAME}')`, {
    method:'POST', headers:hdrs, body,
  });
  if (!addRes.ok) { const t=await addRes.text().catch(()=>''); throw new Error(`Erro ao salvar dist: ${addRes.status} ${t.slice(0,150)}`); }
}

    PHASES.forEach(ph=>{
      const base       = proj.headPhases[ph.key];
      const storedPcts = savedHead?.[ph.key];
      // Usa dist.json se tiver dados; adapta o tamanho ao número atual de heads
      const bestPcts = (storedPcts && storedPcts.some(p=>p>0))
        ? storedPcts.slice(0, Math.max(projHeadNames.length, 1))
        : base.pcts;
      headPhases[ph.key] = { ...base, pcts: bestPcts };
    });

    return {...proj, phases, headPhases};
  });
  return [...spProjects, ...(dist.localProjects||[])];
}

// ─── SP Field Name Resolution ──────────────────────────────────────────────────
// Tipos SP graváveis via PATCH — baseado no SPFieldType enum real:
// 2=Text, 3=Note, 4=DateTime, 6=Choice, 8=Boolean, 9=Number, 10=Currency, 15=MultiChoice
const SP_WRITABLE_TYPES = new Set([2,3,4,6,8,9,10,15]);

// Mapeamento explícito: k do código → StaticName real no SP (obtido via console log).
// null = campo não existe no SP (será silenciosamente ignorado no save).
const PULSE_FIELD_SP_OVERRIDES = {
  // Nomes internos completamente diferentes no SP
  'Semestre_Orcamentario':             'Periodo',
  'ID_do_Programa_ATS':                'ID_do_Programa_Globe',
  'Nome_do_Programa_ATS':              'Nome_do_Programa_Globe',
  'Assessments_Utilizados':            'Assessments',
  'Qtdd_Sala_Dia_Etapa1':              'Qtdd_Sala_Dia',
  'Qtdd_Sala_Dia_Etapa2':              'Qtdd_Sala_Etapa2',
  'Qtdd_Sala_Dia_Etapa3':              'Qttd_Salas_Etapa3',
  'Qtdd_Sala_Dia_Etapa4':              'Qtdd_Sala_Etapa4',
  'Qtdd_Sala_Dia_Etapa5':              'Qtdd_Sala_Etapa5',
  'Ha_quanto_tempo_existe_o_programa': 'H_x00e1_quantotempoexisteoprogra',
  'Empresa_arcou_com_custos':          'Aempresaarcoucomoscustosdoscandi',
  'Politica_de_custos':                'Qualfoiapol_x00ed_ticadecustos_x',
  'Auxilio_mudanca':                   'Aux_x00ed_liomudan_x00e7_a_x003f',
  'Trilha_de_Desenvolvimento':         'TrilhadeDesenvolvimento_x0028_Jo',
  'Processo_para_nicho':               'Esteprocesso_x00e9_paraumnichoes',
  'Meta_etnico_racial':                'Tevemetaparap_x00fa_blico_x00e9_',  // Choice: Não teve/Atingida/Não atingida
  'Meta_feminino':                    'Tevemetaparap_x00fa_blicofeminin',   // Choice: Não teve/Atingida/Não atingida
  'Meta_PcD':                         'Metaparap_x00fa_blicoPcD',           // Choice: Não teve/Atingida/Não atingida
  'Meta_LGBTQIA':                     'Metaparap_x00fa_blicoLGBTQIA_x00',  // Choice: Não teve/Atingida/Não atingida
  'Acoes_para_metas':                  'A_x00e7__x00f5_esqueajudaramatra',
  'Parceiro_diversidade':              'Tevealgumparceiroparaatrairdiver',
  'Flexibilizacao_criterios_internos': 'Flexibiliza_x00e7__x00e3_odecrit',
  'Criterios_Flexibilizados_Internos': 'Crit_x00e9_rios_Flexibilizados_I',
  // Prospecção — nomes internos com encoding especial (1ª/2ª/3ª → _x0031__x00aa_ etc.)
  '_1a_Prospeccao': '_x0031__x00aa__Prospec_x00e7_ao',
  '_2a_Prospeccao': '_x0032__x00aa__Prospec_x00e7_ao',
  '_3a_Prospeccao': '_x0033__x00aa__Prospec_x00e7_ao',
  // Data_Inicio/Termino_Etapa removidos do PULSE_FIELDS — datas unificadas com alocação
};

const _spFieldMap      = {}; // { codigoKey → StaticName real no SP }
const _spValidFields   = new Set(); // StaticNames reais e graváveis
const _spRequiredFields= new Set(); // StaticNames de campos Required no SP
const _spFieldTypes    = {}; // { StaticName → FieldTypeKind } — para saber o tipo real no SP
const _spUnresolved    = []; // PULSE_FIELDS sem correspondência confirmada no SP

// Decodifica _xNNNN_ usado pelo SP nos nomes internos de colunas com acentos/especiais
// Ex: 'Semestre_Or_x00e7_ament_x00e1_rio' → 'Semestre_Orçamentário'
function _decodeSPName(s) {
  return (s||'').replace(/_x([0-9a-fA-F]{4})_/gi,(m,h)=>String.fromCharCode(parseInt(h,16)));
}
// Normaliza para comparação: decode SP → remove acentos → lowercase → só alfanumérico
function _normMatch(s) {
  return _decodeSPName(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]/g,'');
}

async function fetchSPChoices(token, siteUrl, listName) {
  _spUnresolved.length = 0; // reset
  try {
    const base = _spListBase(siteUrl, listName);
    const json = await spFetch(token,
      `${base}/fields?$select=InternalName,StaticName,Title,Choices,FieldTypeKind,ReadOnlyField,Required&$top=500`
    );
    const allFields = json.value||[];
    const choiceMap = {};

    // Separa campos graváveis
    const writable = allFields.filter(f=>!f.ReadOnlyField && SP_WRITABLE_TYPES.has(f.FieldTypeKind));
    writable.forEach(f=>{
      if (f.InternalName) _spValidFields.add(f.InternalName);
      if (f.StaticName)   _spValidFields.add(f.StaticName);
      // Registra o tipo real do campo — usado em savePulse para enviar número vs. string
      if (f.InternalName) _spFieldTypes[f.InternalName] = f.FieldTypeKind;
      if (f.StaticName)   _spFieldTypes[f.StaticName]   = f.FieldTypeKind;
      // Registra campos obrigatórios — null será omitido para esses
      if (f.Required) {
        if (f.InternalName) _spRequiredFields.add(f.InternalName);
        if (f.StaticName)   _spRequiredFields.add(f.StaticName);
      }
      if (f.FieldTypeKind===6||f.FieldTypeKind===15) {
        const choices=(f.Choices?.results||f.Choices||[]).filter(c=>c&&c.trim());
        if (choices.length) {
          if (f.InternalName) choiceMap[f.InternalName]=choices;
          if (f.StaticName&&f.StaticName!==f.InternalName) choiceMap[f.StaticName]=choices;
        }
      }
    });

    // Log diagnóstico completo — abre DevTools (F12 → Console)
    // Mostra TODOS os campos do SP com tipo e flag ReadOnly para achar os que faltam
    console.log('📋 TODOS os campos SP (Tipo | RO | InternalName | StaticName | Title):');
    allFields.forEach(f=>console.log(
      `  [${f.FieldTypeKind}${f.ReadOnlyField?'|RO':''}] ${f.InternalName} | ${f.StaticName} | ${f.Title}`
    ));

    // Passo 0: aplicar overrides explícitos primeiro (nomes confirmados via console log)
    Object.entries(PULSE_FIELD_SP_OVERRIDES).forEach(([k,spName])=>{
      if (spName===null) {
        _spFieldMap[k]='__nonexistent__'; // não existe no SP — skip silencioso
      } else {
        _spFieldMap[k]=spName;
        _spValidFields.add(spName);
      }
    });

    // Match em 3 passos para campos não cobertos pelos overrides
    const normK = f => _normMatch(f.k);
    PULSE_FIELDS.forEach(f=>{
      if (_spFieldMap[f.k]) return; // já resolvido pelo override
      const nk = normK(f);

      // 1. Exact string match (InternalName ou StaticName)
      let match = writable.find(sf=>sf.InternalName===f.k||sf.StaticName===f.k);

      // 2. Normalized exact match — resolve diferenças de codificação de acentos no SP
      //    Ex: código 'Semestre_Orcamentario' ↔ SP 'Semestre_Or_x00e7_ament_x00e1_rio'
      if (!match) match = writable.find(sf=>_normMatch(sf.InternalName)===nk||_normMatch(sf.StaticName)===nk);

      // 3. Normalized Title match — para casos onde o nome interno difere muito do label
      //    Só aceita match EXATO (normalizado) no Title para evitar ambiguidade
      if (!match) {
        const normL = _normMatch(f.l);
        match = writable.find(sf=>_normMatch(sf.Title)===normL);
      }

      if (match) {
        _spFieldMap[f.k] = match.StaticName||match.InternalName;
        _spValidFields.add(_spFieldMap[f.k]);
      } else if (_spFieldMap[f.k]!=='__nonexistent__') {
        _spUnresolved.push({k:f.k, l:f.l, s:f.s});
      }

      if ((f.t==='select'||f.t==='multicheck') && !f.fixedOptions) {
        const resolved=_spFieldMap[f.k]||f.k;
        const opts=choiceMap[resolved]||choiceMap[f.k];
        if (opts) f.o=opts.filter(o=>!/^Escolha\s*\d+$/i.test(o.trim()));
      }
    });

    if (_spUnresolved.length>0) {
      console.warn('⚠️ PULSE_FIELDS sem match no SP (código k → label):');
      _spUnresolved.forEach(u=>console.warn(`  k:"${u.k}" → l:"${u.l}"`));
    } else {
      console.log('✅ Todos os PULSE_FIELDS mapeados com sucesso no SP.');
    }

    return choiceMap;
  } catch { return {}; }
}

// Retorna o StaticName real para usar no PATCH — se não houver mapeamento, usa f.k original
function _resolveFieldName(k) { return _spFieldMap[k]||k; }

// Retorna true se o campo é seguro para incluir no PATCH
function _isSpWritable(k) {
  if (_spValidFields.size===0) return true; // fallback: inclui tudo se não carregou
  const resolved = _resolveFieldName(k);
  return _spValidFields.has(resolved) || _spValidFields.has(k);
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const local = loadLocal();
  const [projects,   setProjects]   = useState([]);
  const [authState,  setAuthState]  = useState({isAuth:false,user:'',token:''});
  const [clientId,   setClientId]   = useState(APP_CONFIG.clientId||local.clientId||'');
  const [tenantId,   setTenantId]   = useState(APP_CONFIG.tenantId||local.tenantId||'common');
  const [loading,    setLoading]    = useState(false);
  const [saving,     setSaving]     = useState(false);
  const [error,      setError]      = useState('');
  const [saveMsg,    setSaveMsg]    = useState(null);
  const [view,       setView]       = useState('dashboard');
  const [monthRange, setMonthRange] = useState(()=>{
    const n=new Date();
    const s=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;
    const e=new Date(n.getFullYear()+1,n.getMonth(),1);
    return {start:s, end:`${e.getFullYear()}-${String(e.getMonth()+1).padStart(2,'0')}`};
  });
  const [distData,         setDistData]         = useState({distributions:{},localProjects:[]});
  const [teamMembers,      setTeamMembers]      = useState([]);
  const [cicloFilter,      setCicloFilter]      = useState('');
  const [showEdit,         setShowEdit]         = useState(null);   // project obj or 'new'
  const [showAnalystDetail,setShowAnalystDetail] = useState(null);
  const [module,           setModule]           = useState(null);   // null=home | 'gestao' | 'pulse'
  const [accessLevel,      setAccessLevel]      = useState(null);   // 1|2=full 3+=pulse-only 99=não encontrado
  const [extraAllocations, setExtraAllocations] = useState([]);
  const [vacations,        setVacations]        = useState([]);
  const [headMembers,      setHeadMembers]      = useState([]);
  const [teamDescriptivos, setTeamDescriptivos] = useState({});
  const [headDescriptivos, setHeadDescriptivos] = useState({});
  const [kaMembers,        setKaMembers]        = useState([]);
  const [entityView,       setEntityView]       = useState('analyst'); // 'analyst' | 'head'
  const [spChoices,        setSpChoices]        = useState({});        // campos Choice do SP
  // Analytics — rastreia eventos da sessão para evitar duplicatas
  const sessionLoggedRef  = useRef(new Set()); // 'login', 'module:pulse', 'save:project', etc.

  // ── projectsRef: sempre aponta para o projects mais recente ─────────────────
  // Evita stale closure em saveProject: sem isso, maxIndice sempre seria 0
  // (o valor de projects no momento do login), gerando indice=1 sempre → duplicate.
  const projectsRef = useRef(projects);
  projectsRef.current = projects;

  // ── distDataRef: sempre aponta para o distData mais recente ──────────────────
  // Evita race conditions de stale closure: qualquer save que aconteça após outro
  // save (ex: salvar férias e depois salvar projeto) lê o estado mais atual do
  // dist.json em vez do valor capturado no momento em que o callback foi criado.
  const distDataRef = useRef(distData);
  distDataRef.current = distData; // atualiza a cada render, antes de qualquer callback

  // ── saveLockRef: impede saves concorrentes ao dist.json ──────────────────────
  // Dois saves ao mesmo arquivo em paralelo → o último sobrescreve o primeiro.
  // Qualquer função que escreva no dist.json deve adquirir este lock antes de
  // iniciar e liberá-lo no finally.
  const saveLockRef = useRef(false);

  // ── distFetchBlockedRef: bloqueia saves quando fetchDistFile falhou ───────────
  // Se o dist.json não pôde ser lido do SP (rede, auth), qualquer save subsequente
  // sobrescreveria todos os dados com um objeto vazio. Este flag bloqueia saves
  // até que um loadAll bem-sucedido confirme o estado real do SP.
  const distFetchBlockedRef = useRef(false);

  // Only persist config locally when it wasn't baked into APP_CONFIG
  useEffect(()=>{ if (!APP_CONFIG.clientId) saveLocal({clientId,tenantId}); },[clientId,tenantId]);

  // Se módulo 'gestao' for acessado sem permissão, redireciona para home
  useEffect(()=>{
    if (module==='gestao' && accessLevel!==null && accessLevel>=3) setModule(null);
  },[module, accessLevel]);

  const ciclos          = useMemo(()=>[...new Set(projects.map(p=>p.ciclo).filter(Boolean))].sort(),[projects]);
  const filteredProjects= useMemo(()=>cicloFilter ? projects.filter(p=>p.ciclo===cicloFilter) : projects,[projects,cicloFilter]);

  // Alocações de analistas — nomes não oficiais mesclados em "Alocação pendente"
  const allocations = useMemo(()=>{
    const raw = computeAllocations(filteredProjects);
    if (!teamMembers.length) return raw;
    const officialSet = new Set(teamMembers);
    const pending = {}, result = {};
    Object.entries(raw).forEach(([name, monthAlloc])=>{
      if (officialSet.has(name)) { result[name]=monthAlloc; }
      else { Object.entries(monthAlloc).forEach(([m,pct])=>{ pending[m]=Math.round((pending[m]||0)+pct); }); }
    });
    if (Object.keys(pending).length>0) result[PENDING_LABEL]=pending;
    return result;
  },[filteredProjects, teamMembers]);

  // Alocações de heads — nomes não oficiais mesclados em "Alocação pendente"
  const headAllocations = useMemo(()=>{
    const raw = computeHeadAllocations(filteredProjects);
    if (!headMembers.length) return raw;
    const officialSet = new Set(headMembers);
    const pending = {}, result = {};
    Object.entries(raw).forEach(([name, monthAlloc])=>{
      if (officialSet.has(name)) { result[name]=monthAlloc; }
      else { Object.entries(monthAlloc).forEach(([m,pct])=>{ pending[m]=Math.round((pending[m]||0)+pct); }); }
    });
    if (Object.keys(pending).length>0) result[PENDING_LABEL]=pending;
    return result;
  },[filteredProjects, headMembers]);

  // Analyst list: oficial + "Alocação pendente" se houver não-oficiais alocados
  const analysts = useMemo(()=>{
    if (!teamMembers.length) return Object.keys(allocations).sort();
    return PENDING_LABEL in allocations ? [...teamMembers, PENDING_LABEL] : teamMembers;
  },[teamMembers, allocations]);

  // Head list: oficial + "Alocação pendente" se houver não-oficiais alocados
  const heads = useMemo(()=>{
    if (!headMembers.length) {
      const set=new Set(); filteredProjects.forEach(p=>_projHeads(p).forEach(h=>set.add(h)));
      return [...set].sort();
    }
    return PENDING_LABEL in headAllocations ? [...headMembers, PENDING_LABEL] : headMembers;
  },[headMembers, headAllocations, filteredProjects]);
  const months          = useMemo(()=>rangeMonths(monthRange.start,monthRange.end),[monthRange]);
  // Alocações base + extras mescladas para o Dashboard (mensal)
  const activeAllocsWithExtras = useMemo(()=>{
    const base = entityView==='head' ? headAllocations : allocations;
    return mergeExtras(base, extraAllocations, months, 'month');
  },[entityView, headAllocations, allocations, extraAllocations, months]);

  // ── Load all data: SP items + dist file → merged projects ──
  const loadAll = useCallback(async(token)=>{
    setLoading(true); setError('');
    try {
      // Rodar primeiro para que _spValidFields e HEAD_PCT_COLS estejam prontos
      // antes de fetchSPList (evita race condition e campos inexistentes no $select)
      await fetchHeadPctCols(token, SP_SITE_URL, SP_LIST_NAME);
      const choices = await fetchSPChoices(token, SP_SITE_URL, SP_LIST_NAME);
      // fetchDistFile lança em erros reais (rede/auth/JSON corrompido).
      // Separamos do Promise.all para tratar sem abortar o carregamento dos projetos SP.
      let dist; let distError = null;
      try {
        dist = await fetchDistFile(token, SP_SITE_URL);
        distFetchBlockedRef.current = false; // carregou com sucesso — desbloqueia saves
      } catch(distE) {
        distError = distE.message;
        distFetchBlockedRef.current = true;  // bloqueia saves até próximo loadAll bem-sucedido
        dist = null;  // não sobrescreve o estado atual
      }
      const [spItems, team, hteam, kateam] = await Promise.all([
        fetchSPList(token, SP_SITE_URL, SP_LIST_NAME),
        fetchTeamMembers(token, SP_SITE_URL),
        fetchHeadMembers(token, SP_SITE_URL),
        fetchKAMembers(token, SP_SITE_URL),
      ]);
      setSpChoices(choices||{});
      if (dist !== null) {
        // Só atualiza estado de distribuições quando o fetch foi bem-sucedido
        setDistData(dist);
        setExtraAllocations(dist.extraAllocations||[]);
        setVacations(dist.vacations||[]);
      }
      setTeamMembers(team.members);
      setTeamDescriptivos(team.descriptivos||{});
      setHeadMembers(hteam.members);
      setHeadDescriptivos(hteam.descriptivos||{});
      setKaMembers(kateam);
      setProjects(mergeProjectsWithDist(spItems, dist || distDataRef.current));
      if (distError) {
        setError(`⚠️ Alocações/férias não carregadas: ${distError}\nSalvamentos bloqueados até recarregar com sucesso.`);
      }
    } catch(e) {
      // Diagnostic: try to list all visible lists to find correct name
      let diagMsg = 'Erro ao carregar dados: '+e.message;
      try {
        const diagUrl = `${SP_SITE_URL}/_api/web/lists?$select=Title,Hidden,RootFolder/ServerRelativeUrl&$expand=RootFolder&$top=100`;
        const diagRes = await fetch(diagUrl, {headers:{'Authorization':`Bearer ${token}`,'Accept':'application/json;odata=nometadata'}});
        if (diagRes.ok) {
          const diagJson = await diagRes.json();
          const names = (diagJson.value||[]).map(l=>`"${l.Title}"${l.Hidden?'[oculta]':''} (${l.RootFolder?.ServerRelativeUrl||''})`).join(' | ');
          diagMsg += `\n\n📋 Listas encontradas no site:\n${names||'(nenhuma)'}`;
        } else {
          diagMsg += `\n\n⚠️ Sem acesso ao site (${diagRes.status}). Verifique permissões do app no Azure AD (AllSites.Read).`;
        }
      } catch(diagE) { diagMsg += '\n\n⚠️ Diagnóstico falhou: '+diagE.message; }
      setError(diagMsg);
    }
    finally { setLoading(false); }
  },[]);

  // ── Save extra allocations / vacations to the shared dist.json in SharePoint ──
  // Usa distDataRef.current (sempre atualizado) para evitar sobrescrever dados
  // salvos por outro callback antes de um re-render completar.
  const saveExtraAllocs = useCallback(async(newExtras)=>{
    if (distFetchBlockedRef.current) { setSaveMsg({type:'error', text:'❌ Dados não carregados do SP. Recarregue antes de salvar.'}); setTimeout(()=>setSaveMsg(null),7000); throw new Error('Dist fetch blocked'); }
    if (saveLockRef.current) { setSaveMsg({type:'warn', text:'⏳ Aguarde o salvamento anterior terminar.'}); setTimeout(()=>setSaveMsg(null),4000); throw new Error('Save in progress'); }
    saveLockRef.current = true;
    const prevDist = distDataRef.current;
    const newDist = {...prevDist, extraAllocations: newExtras};
    distDataRef.current = newDist;
    setSaving(true); setSaveMsg(null);
    try {
      const tok = await getWriteToken();
      await saveDistFile(tok, SP_SITE_URL, newDist);
      setExtraAllocations(newExtras);
      setDistData(newDist);
      setSaveMsg({type:'success', text:'✅ Alocações extras salvas no SharePoint.'});
    } catch(e) {
      distDataRef.current = prevDist;
      setSaveMsg({type:'error', text:`❌ Erro ao salvar alocações: ${e.message}. Tente novamente.`});
      throw e;
    } finally {
      saveLockRef.current = false;
      setSaving(false);
      setTimeout(()=>setSaveMsg(null), 7000);
    }
  },[authState.token]);

  const saveVacations = useCallback(async(newVacs)=>{
    if (distFetchBlockedRef.current) { setSaveMsg({type:'error', text:'❌ Dados não carregados do SP. Recarregue antes de salvar.'}); setTimeout(()=>setSaveMsg(null),7000); throw new Error('Dist fetch blocked'); }
    if (saveLockRef.current) { setSaveMsg({type:'warn', text:'⏳ Aguarde o salvamento anterior terminar.'}); setTimeout(()=>setSaveMsg(null),4000); throw new Error('Save in progress'); }
    saveLockRef.current = true;
    const prevDist = distDataRef.current;
    const newDist = {...prevDist, vacations: newVacs};
    distDataRef.current = newDist;
    setSaving(true); setSaveMsg(null);
    try {
      const tok = await getWriteToken();
      await saveDistFile(tok, SP_SITE_URL, newDist);
      // Só atualiza o estado React APÓS confirmação do SP — evita mostrar dado não salvo
      setVacations(newVacs);
      setDistData(newDist);
      setSaveMsg({type:'success', text:'✅ Férias salvas no SharePoint.'});
    } catch(e) {
      distDataRef.current = prevDist;
      setSaveMsg({type:'error', text:`❌ Erro ao salvar férias: ${e.message}. Tente novamente.`});
      throw e;  // re-throw: modal permanece aberto e exibe erro
    } finally {
      saveLockRef.current = false;
      setSaving(false);
      setTimeout(()=>setSaveMsg(null), 7000);
    }
  },[authState.token]);

  // ── Analytics event logger ────────────────────────────────────────────────
  // Grava entrada de analytics no dist.json. Fire-and-forget — nunca bloqueia o fluxo.
  // NÃO adquire o saveLock: é chamado sempre APÓS o save principal (que já liberou o lock),
  // garantindo que não há save concorrente com dados reais nesse momento.
  const logEvent = useCallback(async(action, detail='')=>{
    if (!authState.isAuth || !authState.token) return;
    if (distFetchBlockedRef.current) return; // não gravar analytics se dist não foi carregado
    const key = detail ? `${action}:${detail}` : action;
    if (sessionLoggedRef.current.has(key)) return; // já logado nesta sessão
    sessionLoggedRef.current.add(key);
    try {
      const entry = {
        email:  authState.email||'',
        name:   authState.user||'',
        action,
        detail,
        ts:     new Date().toISOString(),
      };
      const tok = await getWriteToken(); // renova token para evitar 401 no fire-and-forget
      const cur  = distDataRef.current;
      const logs = [...(cur.analytics||[]), entry].slice(-ANALYTICS_MAX);
      const newDist = {...cur, analytics: logs};
      distDataRef.current = newDist;
      setDistData(newDist);
      await saveDistFile(tok, SP_SITE_URL, newDist);
    } catch { /* falha silenciosa — analytics não são críticos */ }
  },[authState]);

  const signInAndFetch = useCallback(async()=>{
    if (!clientId) { setError('⚙️ Client ID não configurado. Edite APP_CONFIG no início do arquivo.'); return; }
    setLoading(true); setError('');
    try {
      const {token,user,email} = await acquireToken(clientId,tenantId);
      // Busca nível de acesso ANTES de mostrar a home (evita flash do cartão Gestão)
      const access = await fetchUserAccess(token, SP_SITE_URL, email);
      setAuthState({isAuth:true,user,token,email});
      setAccessLevel(access);
      await loadAll(token);
      // Log de acesso — após loadAll para ter distDataRef atualizado
      setTimeout(()=>logEvent('login','app'), 2000);
    } catch(e) { setError('Erro: '+e.message); }
    finally { setLoading(false); }
  },[clientId,tenantId,loadAll]);

  const signOut = useCallback(async()=>{
    await signOutMsal(clientId,tenantId);
    setAuthState({isAuth:false,user:'',token:''});
    setProjects([]);
    setDistData({distributions:{},localProjects:[]});
  },[clientId,tenantId]);

  // ── Token refresh helper ──
  // Renova o token silenciosamente antes de qualquer escrita no SP.
  // O MSAL usa o cache se o token ainda for válido (cheap) ou faz refresh automático se expirou.
  // Isso evita o erro 401 que ocorre quando o usuário fica >1h sem recarregar o app.
  const getWriteToken = useCallback(async()=>{
    try {
      const {token} = await acquireToken(clientId, tenantId);
      // Atualiza authState se o token mudou (evita stale para próximas operações)
      if (token !== authState.token) setAuthState(prev=>({...prev, token}));
      return token;
    } catch {
      // Se o silent refresh falhar, usa o token atual e deixa o erro de SP aparecer normalmente
      return authState.token;
    }
  },[clientId, tenantId, authState.token]);

  // ── Save Project ──
  // SP projects:    PATCH/POST List_Pulse  +  update distributions in dist file
  // Local projects: save full project obj in dist file (shared via SP, no new SP columns)
  const saveProject = useCallback(async(project)=>{
    if (!authState.isAuth || !authState.token) {
      // No auth: session-only (warn user)
      if (project.spId) {
        setProjects(prev=>prev.map(p=>p.id===project.id ? {...project} : p));
      } else {
        setProjects(prev=>[...prev, {...project, id:'local_'+Date.now(), source:'local'}]);
      }
      setSaveMsg({type:'warn',text:'⚠️ Salvo localmente nesta sessão. Conecte ao SharePoint para compartilhar.'});
      setShowEdit(null);
      setTimeout(()=>setSaveMsg(null),7000);
      return;
    }
    if (distFetchBlockedRef.current) {
      setSaveMsg({type:'error', text:'❌ Dados não carregados do SP. Recarregue antes de salvar.'});
      setTimeout(()=>setSaveMsg(null),7000);
      return;
    }
    if (saveLockRef.current) {
      setSaveMsg({type:'warn', text:'⏳ Aguarde o salvamento anterior terminar.'});
      setTimeout(()=>setSaveMsg(null),4000);
      return;
    }
    saveLockRef.current = true;
    const prevDist = distDataRef.current;  // salva para rollback

    setSaving(true); setSaveMsg(null);
    let savedSuccessfully = false;
    try {
      const tok = await getWriteToken();

      // Usa distDataRef.current para preservar férias/extras salvos anteriormente
      const newDist = {
        ...distDataRef.current,
        distributions:     {...(distDataRef.current.distributions||{})},
        headDistributions: {...(distDataRef.current.headDistributions||{})},
        localProjects:     [...(distDataRef.current.localProjects||[])],
      };

      if (project.source==='sharepoint') {
        // ── SP project ──
        const payload = buildSPPayload(project);
        if (project.spId) {
          await patchSPItem(tok, SP_SITE_URL, SP_LIST_NAME, project.spId, payload);
        } else {
          const maxIndice = projectsRef.current
            .filter(p=>p.source==='sharepoint')
            .map(p=>Number(p.indice)||0)
            .reduce((a,b)=>Math.max(a,b), 0);
          let freshMaxIndice = maxIndice;
          try {
            const base = _spListBase(SP_SITE_URL, SP_LIST_NAME);
            const idxRes = await spFetch(tok,
              `${base}/items?$select=indice&$orderby=indice desc&$top=1&$filter=Title ne '${DIST_MARKER}'`
            );
            const topItem = (idxRes.value||[])[0];
            if (topItem) freshMaxIndice = Math.max(freshMaxIndice, Number(topItem.indice)||0);
          } catch {}
          const tempTitle = `__new_${Date.now()}__`;
          const created = await createSPItem(tok, SP_SITE_URL, SP_LIST_NAME, {
            Title: tempTitle,
            indice: freshMaxIndice + 1,
          });
          const newId = created.Id||created.id;
          const patchPayload = { ...payload };
          await patchSPItem(tok, SP_SITE_URL, SP_LIST_NAME, newId, patchPayload);
          project = {...project, spId:newId, id:String(newId), source:'sharepoint'};
        }
        // Save distributions
        const dist={};
        PHASES.forEach(ph=>{ dist[ph.key]=project.phases[ph.key]?.pcts||[]; });
        newDist.distributions[String(project.spId)] = dist;
        const headDist={};
        PHASES.forEach(ph=>{ headDist[ph.key]=project.headPhases?.[ph.key]?.pcts||[]; });
        newDist.headDistributions[String(project.spId)] = headDist;

      } else {
        // ── Local project → stored entirely in dist file ──
        const finalId = project.id?.startsWith('proj_')||project.id?.startsWith('local_')
          ? project.id : 'local_'+Date.now();
        const localProj = {...project, id:finalId, spId:null, source:'local'};
        const idx = newDist.localProjects.findIndex(p=>p.id===localProj.id);
        if (idx>=0) newDist.localProjects[idx] = localProj;
        else        newDist.localProjects.push(localProj);
        project = localProj;
      }

      // Grava dist.json ANTES de atualizar o estado React
      distDataRef.current = newDist;
      await saveDistFile(tok, SP_SITE_URL, newDist);

      // Só atualiza UI após confirmação do SP
      setDistData(newDist);
      if (project.source==='sharepoint') {
        if (project.spId && projects.find(p=>p.id===project.id)) {
          setProjects(prev=>prev.map(p=>p.id===project.id ? {...project} : p));
        } else {
          setProjects(prev=>[...prev, project]);
        }
        setSaveMsg({type:'success', text:'✓ Salvo no SharePoint.'});
      } else {
        if (projects.find(p=>p.id===project.id)) {
          setProjects(prev=>prev.map(p=>p.id===project.id ? {...project} : p));
        } else {
          setProjects(prev=>[...prev, project]);
        }
        setSaveMsg({type:'success', text:'✓ Projeto salvo na ferramenta (visível para todos).'});
      }
      savedSuccessfully = true;
      setShowEdit(null);  // fecha modal apenas em sucesso
      // logEvent APÓS o save principal — evita race condition com saveDistFile concorrente
      logEvent('save','projeto');

    } catch(e) {
      distDataRef.current = prevDist;  // rollback ref em caso de falha
      setSaveMsg({type:'error', text:'Erro ao salvar: '+e.message});
    } finally {
      saveLockRef.current = false;
      setSaving(false);
      if (!savedSuccessfully) setTimeout(()=>setSaveMsg(null),8000);
      else setTimeout(()=>setSaveMsg(null),5000);
    }
  },[authState, projects]);  // projects needed for setProjects logic after saveDistFile

  // ── Save Pulse (full-field PATCH from PulseView) ──
  const savePulse = useCallback(async(project)=>{
    if (!authState.isAuth || !project.spId) return;
    if (distFetchBlockedRef.current) {
      setSaveMsg({type:'error', text:'❌ Dados não carregados do SP. Recarregue antes de salvar.'});
      setTimeout(()=>setSaveMsg(null),7000);
      return;
    }
    if (saveLockRef.current) {
      setSaveMsg({type:'warn', text:'⏳ Aguarde o salvamento anterior terminar.'});
      setTimeout(()=>setSaveMsg(null),4000);
      return;
    }
    saveLockRef.current = true;
    const prevDist = distDataRef.current;
    setSaving(true); setSaveMsg(null);
    try {
      const payload = {
        Nome_Programa:      project.title||null,
        Cliente:            project.client||null,
        Status_Programa:    project.status||null,
        Ciclo_Orcamentario: project.ciclo||null,
        KA:                 project.ka||null,
        Head_1:             project.head1||null,
        Head_2:             project.head2||null,
        Head_3:             project.head3||null,
      };
      // Pulse extra fields — regras definitivas:
      // 1. Só inclui campos com match EXATO confirmado em _spFieldMap
      // 2. NUNCA envia null/vazio — campos sem valor são omitidos (SP mantém o existente)
      // 3. Para limpar um campo, o usuário deve fazê-lo diretamente no SP ou aguardamos
      //    mapearmos os nomes corretos de todos os campos unresolved
      if (project.pulseData) {
        PULSE_FIELDS.forEach(f=>{
          const mapped = _spFieldMap[f.k];
          // Pula campos não existentes no SP ou não resolvidos
          if (mapped==='__nonexistent__') return;
          if (!mapped && _spValidFields.size>0) return;
          const spKey = mapped||f.k;
          const v = project.pulseData[f.k];
          const isEmpty = v===''||v===null||v===undefined;
          if (isEmpty) return; // nunca enviar null — omite e SP mantém valor atual
          if (f.t==='date') {
            const d=fmtDateForSP(v); if(d) payload[spKey]=d;
          } else if (f.t==='number') {
            const n=parseFloat(String(v).replace(',','.'));
            if (!isNaN(n)) {
              // Campos Text (tipo 2) no SP exigem string; Number/Currency (9/10) exigem número
              const spType = _spFieldTypes[spKey];
              payload[spKey] = (spType===2||spType===3) ? String(n) : n;
            }
          } else if (f.t==='multicheck') {
            const vals=v.split(',').map(x=>x.trim()).filter(Boolean);
            if (vals.length>0) {
              const spType = _spFieldTypes[spKey];
              if (spType===15) {
                // MultiChoice tipo 15 — SP espera array direto: ["val1","val2"]
                payload[spKey] = vals;
              } else {
                // Choice (6) ou Text (2/3) — string simples separada por vírgula
                payload[spKey] = vals.join(',');
              }
            }
          } else {
            payload[spKey]=v;
          }
        });
      }
      for (let i=0; i<MAX_ANALYSTS; i++) {
        payload[`Analista_${i+1}`] = project.analysts[i]||null;
      }
      PHASES.forEach(ph=>{
        const phase     = project.phases[ph.key]||{};
        const headPhase = project.headPhases?.[ph.key]||{};
        const total     = totalPhasePct(phase);
        const headTotal = totalPhasePct(headPhase);
        payload[`Inicio_${ph.key}`]                       = phase.start ? fmtDateForSP(phase.start) : null;
        payload[PHASE_END_COLS[ph.key]||`Fim_${ph.key}`] = phase.end   ? fmtDateForSP(phase.end)   : null;
        if (!PHASE_NO_PCT.has(ph.key)) {
          payload[`Analista_${ph.key}_PCT`] = pctToSP(total);
          const headCol = HEAD_PCT_COLS[ph.key];
          if (headCol) payload[headCol]     = pctToSP(headTotal);
        }
      });
      // Renova token antes de qualquer escrita (evita 401 por token expirado após >1h)
      const tok = await getWriteToken();
      console.log('🔵 savePulse payload:', JSON.stringify(payload, null, 2));
      await patchSPItem(tok, SP_SITE_URL, SP_LIST_NAME, project.spId, payload);
      // Usa distDataRef.current para garantir que férias/extras salvos antes não sejam perdidos.
      // SAFEGUARD: preserva vacations e extraAllocations do estado React (fonte de verdade)
      // para evitar sobrescrita acidental caso distDataRef ainda seja o estado inicial vazio.
      const cur = distDataRef.current;
      const newDist = {
        ...cur,
        distributions:     {...(cur.distributions||{})},
        headDistributions: {...(cur.headDistributions||{})},
        localProjects:     [...(cur.localProjects||[])],
        // Garante que nunca sobrescreve com array vazio se o estado React já tem dados
        extraAllocations:  (cur.extraAllocations?.length ? cur.extraAllocations : undefined)
                           ?? extraAllocations ?? [],
        vacations:         (cur.vacations?.length        ? cur.vacations        : undefined)
                           ?? vacations ?? [],
      };
      const distEntry={};
      PHASES.forEach(ph=>{ distEntry[ph.key]=project.phases[ph.key]?.pcts||[]; });
      newDist.distributions[String(project.spId)] = distEntry;
      const headDistEntry={};
      PHASES.forEach(ph=>{ headDistEntry[ph.key]=project.headPhases?.[ph.key]?.pcts||[]; });
      newDist.headDistributions[String(project.spId)] = headDistEntry;
      distDataRef.current = newDist;
      await saveDistFile(tok, SP_SITE_URL, newDist);
      // Só atualiza UI após confirmação do SP
      setDistData(newDist);
      setProjects(prev=>prev.map(p=>p.id===project.id ? {...project} : p));
      if (_spUnresolved.length>0) {
        const names = _spUnresolved.map(u=>u.l).join(', ');
        setSaveMsg({type:'warn', text:`✓ Salvo — ${_spUnresolved.length} campo(s) com nome interno diferente no SP (não gravados): ${names}`});
      } else {
        setSaveMsg({type:'success', text:'✓ Salvo no SharePoint.'});
      }
      // logEvent APÓS o save principal — evita race condition com saveDistFile concorrente
      logEvent('save','pulse');
    } catch(e) {
      distDataRef.current = prevDist;  // rollback ref em falha
      setSaveMsg({type:'error', text:'Erro ao salvar: '+e.message});
    } finally {
      saveLockRef.current = false;
      setSaving(false);
      setTimeout(()=>setSaveMsg(null), 8000);
    }
  },[authState, extraAllocations, vacations]);  // extraAllocations/vacations como fallback de safeguard

  // ── Suggestions ──
  function getSuggestions(proj, phKey) {
    const ph = proj.phases[phKey];
    if (!ph?.start||!ph?.end) return [];
    const mths = rangeMonths(monthKey(parseSPDate(ph.start)),monthKey(parseSPDate(ph.end)));
    return analysts.filter(a=>!proj.analysts.includes(a))
      .map(a=>({analyst:a, maxAlloc:Math.max(0,...mths.map(m=>allocations[a]?.[m]||0))}))
      .map(s=>({...s, available:100-s.maxAlloc}))
      .filter(s=>s.available>0).sort((a,b)=>b.available-a.available).slice(0,5);
  }

  // ── CSV Import ──
  const importCSV = useCallback(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const text = e.target.result;
      const firstLine = text.split('\n')[0]||'';
      const delim = firstLine.split(';').length>firstLine.split(',').length?';':',';
      Papa.parse(text,{header:true,skipEmptyLines:true,delimiter:delim,
        complete:r=>{
          if (r.errors.length&&!r.data.length) { setError('Erro CSV: '+r.errors[0].message); return; }
          setProjects(r.data.map((row,i)=>parseSPItem({Id:row.Id||row.id||i+1,...row})));
          setError('');
        },
        error:e=>setError('Erro CSV: '+e.message),
      });
    };
    reader.readAsText(file,'UTF-8');
  },[]);

  // ── Not authenticated: show full-screen login ──
  if (!authState.isAuth) {
    return (
      <LoginScreen
        onSignIn={signInAndFetch}
        onImportCSV={importCSV}
        loading={loading}
        error={error}
        onClearError={()=>setError('')}
        clientId={clientId}
        setClientId={setClientId}
        tenantId={tenantId}
        setTenantId={setTenantId}
        isConfigured={!!clientId}
      />
    );
  }

  // ── Authenticated: Home screen (module selector) ──
  if (!module) {
    return (
      <HomeScreen
        onSelect={m=>{ setModule(m); logEvent('module_view', m); }}
        authState={authState}
        onSignOut={signOut}
        loading={loading}
        onRefresh={()=>loadAll(authState.token)}
        error={error}
        onClearError={()=>setError('')}
        accessLevel={accessLevel}
      />
    );
  }

  // ── Authenticated: helper (used in Gestão only) ──
  function addAnalystToProject(proj, analyst) {
    const updated={...proj,analysts:[...proj.analysts,analyst]};
    PHASES.forEach(ph=>{
      updated.phases={...updated.phases,[ph.key]:{...updated.phases[ph.key],pcts:[...(updated.phases[ph.key]?.pcts||[]),0]}};
    });
    setShowEdit(updated);
  }

  // ── Shared chrome ──
  const saveMsgBanner = saveMsg && (
    <div className={`slide-down sticky top-0 z-40 text-center py-2 text-sm font-medium ${
      saveMsg.type==='success'?'bg-emerald-600 text-white':
      saveMsg.type==='error'?'bg-red-600 text-white':'bg-amber-500 text-white'}`}>
      {saveMsg.text}
    </div>
  );
  const errorBanner = error && (
    <div className="mt-3 bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm flex items-start gap-2 mx-4">
      <span className="flex-1 whitespace-pre-wrap">{error}</span>
      <button onClick={()=>setError('')} className="text-red-400 hover:text-red-600 shrink-0">✕</button>
    </div>
  );

  // ── Pulse module ──
  if (module==='pulse') {
    return (
      <div className="min-h-screen bg-slate-50">
        <AppHeader view={view} setView={setView} authState={authState}
          onSignOut={signOut} projectCount={projects.length} loading={loading}
          onRefresh={()=>loadAll(authState.token)} module={module} onHome={()=>setModule(null)}/>
        {saveMsgBanner}
        {errorBanner}
        <PulseView
          projects={projects}
          ciclos={ciclos}
          allAnalysts={analysts}
          allKAs={kaMembers}
          onSave={savePulse}

          spChoices={spChoices}
        />
      </div>
    );
  }

  // ── Módulos simples (C&D, EB, Frentes Internacionais) ──
  const simpleModuleConfig = MODULE_CONFIGS[module];
  if (simpleModuleConfig && accessLevel<=2) {
    return (
      <div className="min-h-screen bg-slate-50">
        <AppHeader view={view} setView={setView} authState={authState}
          onSignOut={signOut} projectCount={filteredProjects.filter(p=>p.solucao===simpleModuleConfig.frente).length}
          loading={loading} onRefresh={()=>loadAll(authState.token)} module={module} onHome={()=>setModule(null)}
          entityView={entityView} setEntityView={setEntityView}/>
        {saveMsgBanner}
        <ModuleProjectsView
          projects={projects}
          moduleConfig={simpleModuleConfig}
          allAnalysts={analysts}
          allHeads={heads}
          allKAs={kaMembers}
          spChoices={spChoices}
          onSave={saveProject}
          saving={saving}
          isSpConnected={authState.isAuth}

          tenantId={tenantId}/>
      </div>
    );
  }

  // ── Analytics module (admin only) ──
  if (module==='analytics' && (authState.email||'').toLowerCase()===ANALYTICS_ADMIN) {
    const logs = distDataRef.current?.analytics||[];
    return (
      <div className="min-h-screen bg-slate-50">
        <AppHeader view={view} setView={setView} authState={authState}
          onSignOut={signOut} projectCount={projects.length} loading={loading}
          onRefresh={()=>loadAll(authState.token)} module={module} onHome={()=>setModule(null)}

  // ── Clientes × Frentes module ──
  if (module==='clientes') {

      {saveMsgBanner}

      <main className="max-w-screen-2xl mx-auto px-4 pb-10">
        {ciclos.length>0&&(
          <div className="flex items-center gap-2 mt-3 mb-1">
            <span className="text-xs font-medium text-slate-500 shrink-0">Ciclo orçamentário:</span>
            <select value={cicloFilter} onChange={e=>setCicloFilter(e.target.value)}
              className="text-sm border border-slate-200 rounded-lg px-3 py-1.5 bg-white text-slate-700 focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400">
              <option value="">Todos</option>
              {ciclos.map(c=><option key={c} value={c}>{c}</option>)}

          </div>
        )}
        {view==='dashboard'&&(
          <DashboardView analysts={activeNames} allocations={activeAllocsWithExtras} months={months}
            monthRange={monthRange} setMonthRange={setMonthRange} onAnalystClick={setShowAnalystDetail}
            vacations={vacations} entityView={entityView}
            descriptivos={entityView==='head'?headDescriptivos:teamDescriptivos}/>
        )}
        {view==='monthly'&&(
          <MonthlyGrid analysts={activeNames} allocations={activeAllocs} months={months}
            monthRange={monthRange} setMonthRange={setMonthRange} onAnalystClick={setShowAnalystDetail}
            projects={filteredProjects} extraAllocations={extraAllocations} vacations={vacations}
            entityType={entityView}/>
        )}
        {view==='projects'&&(
          <ProjectsView projects={filteredProjects} onEdit={p=>setShowEdit(p)} onNew={()=>setShowEdit('new')}
            getSuggestions={getSuggestions} onAddAnalyst={addAnalystToProject}/>
        )}
        {view==='suggestions'&&(
          <SuggestionsView projects={filteredProjects} getSuggestions={getSuggestions}
            onEdit={p=>setShowEdit(p)} onAddAnalyst={addAnalystToProject}/>
        )}
      </main>

      {showEdit&&(
        <ProjectModal
          project={showEdit==='new'?null:showEdit}
          allAnalysts={analysts}
          allHeads={heads}
          allKAs={kaMembers}
          onSave={saveProject}
          onClose={()=>setShowEdit(null)}
          saving={saving}
          isSpConnected={authState.isAuth}
          clientId={clientId}
          tenantId={tenantId}
          spChoices={spChoices}/>
      )}
      {showAnalystDetail&&(
        <AnalystDetailModal analyst={showAnalystDetail} allProjects={filteredProjects}
          extraAllocations={extraAllocations} onSaveExtras={saveExtraAllocs}
          vacations={vacations} onSaveVacations={saveVacations}
          entityType={entityView}
          onClose={()=>setShowAnalystDetail(null)}/>
      )}
    </div>
  );
}

// ─── Extra Allocations Merge ──────────────────────────────────────────────────
// Merges extra (local-only) allocations into a computed allocation map.
// granularity: 'month' (col = "YYYY-MM") | 'week' (col = "YYYY-MM-DD" Monday) | 'day' (col = "YYYY-MM-DD")
function mergeExtras(base, extras, cols, granularity) {
  if (!extras || extras.length===0) return base;
  // Deep-clone base so we don't mutate
  const result={};
  Object.entries(base).forEach(([a,vals])=>{ result[a]={...vals}; });
  extras.forEach(ea=>{
    if (!ea.analyst||!ea.start||!ea.end||!ea.pct) return;
    if (!result[ea.analyst]) result[ea.analyst]={};
    const eaS=parseSPDate(ea.start), eaE=parseSPDate(ea.end);
    if (!eaS||!eaE) return;
    cols.forEach(col=>{
      let contribution=0;
      if (granularity==='month') {
        const [y,m]=col.split('-').map(Number);
        const dim=new Date(y,m,0).getDate();
        const ov=daysOverlapInMonth(ea.start,ea.end,col);
        if(ov>0) contribution=ea.pct*(ov/dim);
      } else if (granularity==='week') {
        const wkS=parseSPDate(col), wkE=calAddDays(wkS,6);
        const oS=eaS>wkS?eaS:wkS, oE=eaE<wkE?eaE:wkE;
        const ov=Math.max(0,Math.round((oE-oS)/864e5)+1);
        if(ov>0) contribution=ea.pct*(ov/7);
      } else {
        const d=parseSPDate(col);
        if(d&&d>=eaS&&d<=eaE) contribution=ea.pct;
      }
      if(contribution>0) result[ea.analyst][col]=(result[ea.analyst][col]||0)+contribution;
    });
  });
  Object.values(result).forEach(a=>Object.keys(a).forEach(k=>{a[k]=Math.round(a[k]);}));
  return result;
}

// ─── Monthly / Weekly / Daily Grid ────────────────────────────────────────────
function MonthlyGrid({analysts,allocations,months,monthRange,setMonthRange,onAnalystClick,projects,extraAllocations,vacations,entityType}) {
  const [gridView, setGridView] = useState('month');
  const isHead = entityType==='head';

  const weeks = useMemo(()=> gridView==='week' ? rangeWeeks(monthRange.start,monthRange.end) : [], [gridView,monthRange]);
  const days  = useMemo(()=> gridView==='day'  ? rangeDays(monthRange.start,monthRange.end,45) : [], [gridView,monthRange]);

  const weekAllocs = useMemo(()=> gridView==='week'
    ? (isHead ? computeHeadAllocationsWeekly(projects||[],weeks) : computeAllocationsWeekly(projects||[],weeks))
    : {}, [gridView,isHead,projects,weeks]);
  const dayAllocs  = useMemo(()=> gridView==='day'
    ? (isHead ? computeHeadAllocationsDaily(projects||[],days) : computeAllocationsDaily(projects||[],days))
    : {}, [gridView,isHead,projects,days]);

  // Merge extra (local-only) allocations on top of computed ones
  const mergedMonth = useMemo(()=>mergeExtras(allocations,   extraAllocations, months, 'month'), [allocations,   extraAllocations, months]);
  const mergedWeek  = useMemo(()=>mergeExtras(weekAllocs,    extraAllocations, weeks,  'week'),  [weekAllocs,    extraAllocations, weeks]);
  const mergedDay   = useMemo(()=>mergeExtras(dayAllocs,     extraAllocations, days,   'day'),   [dayAllocs,     extraAllocations, days]);

  const cols   = gridView==='month' ? months : gridView==='week' ? weeks : days;
  const allocs = gridView==='month' ? mergedMonth : gridView==='week' ? mergedWeek : mergedDay;
  const vacMap = useMemo(()=>buildVacationMap(vacations, cols, gridView),[vacations,cols,gridView]);

  const DAY_ABR = ['D','S','T','Q','Q','S','S'];
  function colHeader(col) {
    if (gridView==='month') return <span className="whitespace-nowrap">{monthLabel(col)}</span>;
    if (gridView==='week')  return <span className="whitespace-nowrap">{weekLabel(col)}</span>;
    const d=parseSPDate(col);
    const isToday=d&&calSameDay(d,new Date());
    return (
      <span className={`flex flex-col items-center leading-tight gap-0.5 ${isToday?'text-indigo-600 font-bold':''}`}>
        <span>{String(d.getDate()).padStart(2,'0')}</span>
        <span className="text-xs font-normal opacity-50">{DAY_ABR[d.getDay()]}</span>
      </span>
    );
  }

  const minColW = gridView==='day' ? 'min-w-[38px]' : gridView==='week' ? 'min-w-[58px]' : 'min-w-[64px]';

  if (analysts.length===0) return (
    <div className="mt-10 text-center text-slate-400">
      <p className="text-4xl mb-3">📅</p>
      <p className="text-lg font-medium">Nenhum dado carregado</p>
      <p className="text-sm mt-1">Conecte ao SharePoint ou importe um CSV.</p>
    </div>
  );

  return (
    <div className="fade-in mt-4 space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <h2 className="text-lg font-bold text-slate-800">
          {isHead?'Grade de Alocação — Heads':'Grade de Alocação — Analistas'}
        </h2>
        <div className="flex items-center gap-2 flex-wrap">
          {/* View switcher */}
          <div className="flex bg-slate-100 rounded-lg p-0.5 gap-0.5">
            {['month','week','day'].map(v=>(
              <button key={v} onClick={()=>setGridView(v)}
                className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${gridView===v?'bg-white shadow text-indigo-600':'text-slate-500 hover:text-slate-700'}`}>
                {v==='month'?'Mês':v==='week'?'Semana':'Dia'}
              </button>
            ))}
          </div>
          <MonthRangePicker monthRange={monthRange} setMonthRange={setMonthRange}/>
        </div>
      </div>

      {gridView==='day'&&days.length>=45&&(
        <p className="text-xs text-amber-600 bg-amber-50 border border-amber-100 px-3 py-1.5 rounded-lg inline-block">
          ⚠️ Mostrando os primeiros 45 dias do período. Reduza o intervalo para ver mais precisão.
        </p>
      )}

      <div className="scroll-table bg-white rounded-xl border border-slate-200 overflow-hidden">
        <table className="min-w-full text-sm border-collapse">
          <thead>
            <tr className="bg-slate-50 border-b border-slate-200">
              <th className="sticky left-0 bg-slate-50 px-4 py-3 text-left text-xs font-semibold text-slate-600 min-w-40 z-20">Analista</th>
              {cols.map(col=>(
                <th key={col} className={`px-1 py-2 text-center text-xs font-medium text-slate-500 ${minColW}`}>
                  {colHeader(col)}
                </th>
              ))}
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {analysts.map(analyst=>(
              <tr key={analyst} className="hover:bg-slate-50 transition">
                <td className="sticky left-0 bg-white hover:bg-slate-50 px-4 py-2.5 font-medium text-slate-800">
                  <button onClick={()=>onAnalystClick(analyst)} className="hover:text-indigo-600 transition text-left w-full truncate">
                    {analyst}
                  </button>
                </td>
                {cols.map(col=>{
                  const vacPct=vacMap[analyst]?.[col]||0;
                  const allocPct=allocs[analyst]?.[col]||0;
                  // Combine: vacation days block 100%, non-vacation days have normal alloc
                  // vacPct is already proportional (e.g. 33 = 10/30 days vacation)
                  // For remaining fraction: allocPct × (1 - vacPct/100)
                  const combined = vacPct>0
                    ? Math.min(100, Math.round(vacPct + allocPct*(1-vacPct/100)))
                    : allocPct;
                  const fullVac = vacPct===100;
                  if (vacPct>0) return (
                    <td key={col}
                      className="px-0.5 py-1.5 text-center text-xs font-semibold bg-blue-100 text-blue-700 select-none"
                      title={fullVac?'Férias':`Férias parcial (${vacPct}% do período)`}>
                      {fullVac?'🏖':`🏖 ${combined}%`}
                    </td>
                  );
                  return (
                    <td key={col} className={`px-0.5 py-2 text-center text-xs font-semibold ${cellClass(combined)}`}>
                      {combined>0?combined+'%':''}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="flex items-center gap-4 text-xs text-slate-500 flex-wrap">
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-green-200 inline-block"/>≤90%</span>
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-yellow-200 inline-block"/>90–100%</span>
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-red-200 inline-block"/>&gt;100%</span>
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-blue-200 inline-block"/>🏖 Férias</span>
      </div>
    </div>
  );
}
